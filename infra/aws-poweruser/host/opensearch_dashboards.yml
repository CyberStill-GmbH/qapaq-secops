# opensearch_dashboards.yml del nodo PowerUser = wazuh/dashboard/opensearch_dashboards.qapaq.yml +
# conexión al indexer de wazuh-docker. La única entrada es la sesión QAPAQ (proxy auth): el edge
# fija x-proxy-user / x-proxy-roles tras /api/auth/introspect y el indexer solo los acepta desde
# la IP fija del contenedor del dashboard (172.30.89.10).
server.host: 0.0.0.0
server.port: 5601
server.ssl.enabled: false

opensearch.hosts: https://wazuh.indexer:9200
opensearch.ssl.verificationMode: certificate
opensearch.ssl.certificateAuthorities: ['/usr/share/wazuh-dashboard/certs/root-ca.pem']
opensearch_security.readonly_mode.roles: ['kibana_read_only']
opensearch_security.cookie.secure: true
opensearch_security.cookie.ttl: 900000
opensearch_security.session.ttl: 900000
opensearch_security.session.keepalive: true

opensearch_security.auth.type: 'proxy'
opensearch_security.proxycache.user_header: 'x-proxy-user'
opensearch_security.proxycache.roles_header: 'x-proxy-roles'
opensearch_security.auth.logout_url: '/qapaq/logout'
opensearch_security.multitenancy.enabled: true
opensearch_security.multitenancy.tenants.enable_private: true
opensearch_security.multitenancy.tenants.preferred: ['Global', 'Private']
opensearch.requestHeadersAllowlist:
  ['securitytenant', 'Authorization', 'x-forwarded-for', 'x-proxy-user', 'x-proxy-roles']

qapaq_ops.enabled: true
qapaq_ops.apiPrefix: '/api'
qapaq_ops.login.enabled: true
qapaq_ops.login.defaultNextUrl: '/app/qapaq-overview'
# Qapaqzito usa DeepSeek desde la API QAPAQ; la clave solo vive en el backend.
qapaq_ops.qapaqzito.enabled: true
qapaq_ops.login.passwordEnabled: true
qapaq_ops.login.destinationLabel: 'QAPAQ'

# Estado declarado de las integraciones («Resumen del SOC» e «Integraciones», qapaq_ops server/config.ts).
# state: auto (lo deciden los datos del Indexer) | blocked | disabled | pending. Lo que no se puede
# medir en el Indexer (un permiso de Entra que falta) se declara aquí; al conceder el permiso, volver
# a `auto` (o borrar la clave) y recrear solo el contenedor del dashboard.
qapaq_ops.integrations.office365.state: 'auto'
qapaq_ops.integrations.sharepoint.state: 'auto'
qapaq_ops.integrations.alertMail.state: 'blocked'
qapaq_ops.integrations.alertMail.missingPermissions: ['Mail.Send']
qapaq_ops.integrations.alertMail.note: 'Sin Microsoft Graph › Mail.Send (aplicación) el notificador no puede enviar el correo de alertas de nivel ≥ 8.'

opensearchDashboards.branding:
  applicationTitle: 'QAPAQ SecOps'
  useExpandedHeader: false

uiSettings:
  overrides:
    'theme:version': 'v7'
    'theme:darkMode': true
    defaultRoute: '/app/qapaq-overview'
    'state:storeInSessionStorage': true
