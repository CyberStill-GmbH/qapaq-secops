# Configuración de terraform-docs para el root y sus módulos.
# Regenerar: terraform-docs -c infra/azure/.terraform-docs.yml infra/azure
#            terraform-docs -c infra/azure/.terraform-docs.yml infra/azure/modules/<módulo>
formatter: markdown table

recursive:
  enabled: true
  path: modules
  include-main: true

output:
  file: README.md
  mode: inject
  template: |-
    <!-- BEGIN_TF_DOCS -->
    {{ .Content }}
    <!-- END_TF_DOCS -->

sort:
  enabled: true
  by: required

settings:
  anchor: false
  default: true
  escape: true
  hide-empty: false
  html: true
  indent: 2
  lockfile: true
  required: true
  sensitive: true
  type: true
