# Opt-in development observability overlay. Local-only; not a production release.
services:
  loki:
    image: grafana/loki:3.7.0
    command: ['-config.file=/etc/loki/config.yaml']
    ports:
      - '127.0.0.1:3100:3100'
    volumes:
      - ./observability/loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    mem_limit: 512m
    cpus: 1.0
    profiles: ['observability']

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--storage.tsdb.retention.size=2GB'
    ports:
      - '127.0.0.1:9090:9090'
    volumes:
      - ./observability/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    mem_limit: 384m
    cpus: 1.0
    profiles: ['observability']

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    command: ['--config=/etc/otelcol-contrib/config.yaml']
    ports:
      - '127.0.0.1:4317:4317'
      - '127.0.0.1:4318:4318'
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    mem_limit: 192m
    cpus: 0.5
    depends_on:
      loki:
        condition: service_started
    profiles: ['observability']

  grafana:
    image: grafana/grafana:13.1.6
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in the ignored local env file}
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_LOG_MODE: console
    ports:
      - '127.0.0.1:3001:3000'
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    mem_limit: 384m
    cpus: 1.0
    depends_on:
      loki:
        condition: service_started
      prometheus:
        condition: service_started
    profiles: ['observability']

volumes:
  loki-data:
  prometheus-data:
  grafana-data:
