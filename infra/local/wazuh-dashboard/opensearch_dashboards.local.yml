# opensearch_dashboards.yml del dashboard LOCAL (wazuh-docker single-node) con el bloque QAPAQ.
# Base: config/wazuh_dashboard/opensearch_dashboards.yml de wazuh-docker (TLS, indexer, sesión).
# Diferencias con wazuh/dashboard/opensearch_dashboards.qapaq.yml (producción, detrás del edge):
#   - Se mantiene la autenticación básica del Security plugin (admin/SecretPassword en local):
#     no hay edge nginx ni proxy auth, así que qapaq_ops.login queda desactivado y /app/login es el
#     formulario de Wazuh (con logos QAPAQ).
#   - Sin aviso P1 ni Qapaqzito: no hay API QAPAQ en el mismo origen (https://localhost/api).
server.host: 0.0.0.0
server.port: 5601
opensearch.hosts: https://wazuh.indexer:9200
opensearch.ssl.verificationMode: certificate
opensearch.requestHeadersWhitelist: ["securitytenant","Authorization"]
opensearch_security.multitenancy.enabled: false
opensearch_security.readonly_mode.roles: ["kibana_read_only"]
server.ssl.enabled: true
server.ssl.key: "/usr/share/wazuh-dashboard/certs/wazuh-dashboard-key.pem"
server.ssl.certificate: "/usr/share/wazuh-dashboard/certs/wazuh-dashboard.pem"
opensearch.ssl.certificateAuthorities: ["/usr/share/wazuh-dashboard/certs/root-ca.pem"]
# Session expiration settings
opensearch_security.cookie.ttl: 900000
opensearch_security.session.ttl: 900000
opensearch_security.session.keepalive: true

# --- Login básico del Security plugin con texto QAPAQ ---
opensearch_security.ui.basicauth.login.title: 'QAPAQ SecOps'
opensearch_security.ui.basicauth.login.subtitle: 'Inicia sesión con tu usuario del SOC'
opensearch_security.ui.basicauth.login.showbrandimage: true
opensearch_security.ui.basicauth.login.brandimage: '/ui/qapaq/qapaq_wordmark_on_dark.svg'

# --- Marca QAPAQ (los activos sustituidos van en la imagen; ver Dockerfile) ---
opensearchDashboards.branding:
  applicationTitle: 'QAPAQ SecOps'
  useExpandedHeader: false

uiSettings:
  overrides:
    'theme:version': 'v7'
    'theme:darkMode': true
    defaultRoute: '/app/wz-home'
    'state:storeInSessionStorage': true
