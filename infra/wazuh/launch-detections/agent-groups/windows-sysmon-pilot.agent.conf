<!--
  Candidato deshabilitado. La regla QAPAQ 101100 usa Sysmon Event ID 1.
  Event ID 1 puede contener command line; no aplicar sin una política de
  privacidad/retención aprobada y validación de configuración Sysmon.
-->
<agent_config os="^Windows">
  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
    <query>Event/System[EventID=1]</query>
  </localfile>
</agent_config>
