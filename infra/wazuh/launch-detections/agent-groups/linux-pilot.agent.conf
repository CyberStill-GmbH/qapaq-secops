<!--
  Plantilla para grupo piloto Linux. Los logs de autenticación se agregan en overlays
  por distro (Debian/Ubuntu o RHEL/Rocky); no asumir que existe /var/log/auth.log.
-->
<agent_config os="^Linux">
  <syscheck>
    <disabled>no</disabled>
    <scan_on_start>yes</scan_on_start>
    <frequency>43200</frequency>
    <directories check_all="yes" realtime="yes">/etc/ssh</directories>
    <directories check_all="yes" realtime="yes">/etc/cron.d</directories>
    <directories check_all="yes" realtime="yes">/etc/systemd/system</directories>
    <directories check_all="yes" realtime="yes">/etc/sudoers.d</directories>
    <directories check_all="yes" realtime="yes">/root/.ssh</directories>
  </syscheck>
  <rootcheck>
    <disabled>no</disabled>
    <!-- Capas overlay de Docker/containerd: cambian mientras check_sys las recorre y disparan la regla 521
         («Possible kernel level rootkit») como falso positivo (328 alertas el 2026-11-03). Igual que
         linux-servers; la regla QAPAQ 101765 lo baja a nivel 0 si un agente sin este grupo lo reporta. -->
    <ignore type="sregex">^/var/lib/docker/</ignore>
    <ignore type="sregex">^/var/lib/containerd/</ignore>
  </rootcheck>
  <sca>
    <enabled>yes</enabled>
    <scan_on_start>yes</scan_on_start>
    <interval>12h</interval>
  </sca>
  <wodle name="syscollector">
    <disabled>no</disabled>
    <scan_on_start>yes</scan_on_start>
    <interval>1h</interval>
  </wodle>
</agent_config>
