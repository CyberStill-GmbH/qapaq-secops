<!--
  QAPAQ · perfil de agente: servidores web y expuestos a Internet
  Tier 1. Expuestos: webshell, explotación y barridos.
  Grupo Wazuh autocontenido: un agente pertenece a un solo perfil QAPAQ. Así no se duplican
  canales (dos <localfile> sobre el mismo canal no se fusionan). Los canales eventchannel por
  defecto del ossec.conf local se retiran en la instalación (deploy/windows/Install-QapaqWazuhAgent.ps1).
  Las consultas XPath se validan en un piloto con `wevtutil qe <canal> /q:"<xpath>" /c:5` antes
  del despliegue masivo.
  Justificación de cada canal: docs/security/agents/02-perfiles-de-agente.md
-->
  <agent_config os="^Windows">
    <labels>
      <label key="qapaq_profile">srv-web</label>
      <label key="qapaq_criticality">high</label>
      <label key="qapaq_tier">tier1</label>
    </labels>
    <!-- Security: lista cerrada de eventos con regla consumidora. -->
    <localfile>
      <location>Security</location>
      <log_format>eventchannel</log_format>
      <query>*[System[(EventID=1102 or EventID=4625 or EventID=4648 or EventID=4697 or EventID=4698 or EventID=4702 or EventID=4719 or EventID=4720 or EventID=4722 or EventID=4724 or EventID=4726 or EventID=4732 or EventID=4738 or EventID=4740)] or (System[EventID=4624] and EventData[Data[@Name='LogonType']='2' or Data[@Name='LogonType']='10'])]</query>
    </localfile>
    <!-- System: servicio instalado (7045), tipo de inicio cambiado (7040), log borrado (104). -->
    <localfile>
      <location>System</location>
      <log_format>eventchannel</log_format>
      <query>*[System[(EventID=104 or EventID=7040 or EventID=7045)]]</query>
    </localfile>
    <!-- PowerShell 4104 solo nivel Warning: los bloques que Windows marca como sospechosos. -->
    <localfile>
      <location>Microsoft-Windows-PowerShell/Operational</location>
      <log_format>eventchannel</log_format>
      <query>*[System[EventID=4104 and Level=3]]</query>
    </localfile>
    <!-- Sysmon: proceso, red, hilo remoto, acceso a LSASS, archivo, registro y manipulación. -->
    <localfile>
      <location>Microsoft-Windows-Sysmon/Operational</location>
      <log_format>eventchannel</log_format>
      <query>*[System[(EventID=1 or EventID=3 or EventID=8 or EventID=10 or EventID=11 or EventID=12 or EventID=13 or EventID=25)]]</query>
    </localfile>
    <!-- Application: solo eventos de error/aviso de Sophos local; Sophos Central llega por API. -->
    <localfile>
      <location>Application</location>
      <log_format>eventchannel</log_format>
      <query>*[System[Provider[@Name='Sophos Endpoint Defense' or @Name='Sophos System Protection' or @Name='HitmanPro.Alert' or @Name='Sophos MCS Agent'] and (Level=1 or Level=2 or Level=3)]]</query>
    </localfile>
    <!-- IIS (sitio 1): ataques web contra servidores expuestos; ajustar el número de sitio en el piloto. -->
    <localfile>
      <location>C:\inetpub\logs\LogFiles\W3SVC1\u_ex%y%m%d.log</location>
      <log_format>iis</log_format>
    </localfile>
    <syscheck>
      <disabled>no</disabled>
      <frequency>43200</frequency>
      <scan_on_start>yes</scan_on_start>
      <max_eps>100</max_eps>
      <process_priority>10</process_priority>
      <!-- Persistencia: tareas programadas y carpetas de inicio. -->
      <directories realtime="yes" check_all="yes">C:\Windows\System32\Tasks</directories>
      <directories realtime="yes" check_all="yes">C:\ProgramData\Microsoft\Windows\Start Menu\Programs\StartUp</directories>
      <!-- hosts/lmhosts: redirección de nombres (pharming hacia banca/proveedores). -->
      <directories check_all="yes" report_changes="yes">C:\Windows\System32\drivers\etc</directories>
      <!-- Perfiles globales de PowerShell: persistencia que se ejecuta en cada sesión. -->
      <directories realtime="yes" check_all="yes" restrict="profile\.ps1$">C:\Windows\System32\WindowsPowerShell\v1.0</directories>
      <!-- Autoprotección del agente: cambios locales que intentan cegar la recolección. -->
      <directories realtime="yes" check_all="yes" restrict="ossec\.conf$|local_internal_options\.conf$">C:\Program Files (x86)\ossec-agent</directories>
      <!-- Registro: persistencia y debilitamiento de credenciales. -->
      <windows_registry arch="both">HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\Run</windows_registry>
      <windows_registry arch="both">HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\RunOnce</windows_registry>
      <windows_registry arch="both">HKEY_LOCAL_MACHINE\Software\Microsoft\Windows NT\CurrentVersion\Image File Execution Options</windows_registry>
      <windows_registry arch="both">HKEY_LOCAL_MACHINE\Software\Microsoft\Windows NT\CurrentVersion\Winlogon</windows_registry>
      <windows_registry>HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Lsa</windows_registry>
      <windows_registry>HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\SecurityProviders\WDigest</windows_registry>
      <!-- Ruido conocido: archivos temporales y registros que rotan. -->
      <ignore type="sregex">\.log$|\.tmp$|\.etl$</ignore>
      <!-- Raíz web: scripts y binarios nuevos son el indicador de webshell más directo. -->
      <directories realtime="yes" check_all="yes" restrict="\.aspx?$|\.ashx$|\.asmx$|\.asp$|\.php$|\.jsp$|\.dll$|\.exe$|\.config$">C:\inetpub\wwwroot</directories>
      <directories realtime="yes" check_all="yes">C:\Windows\System32\inetsrv\config</directories>
    </syscheck>
    <!-- Inventario para vulnerabilidades y contexto de activo. Sin procesos: volumen y privacidad. -->
    <wodle name="syscollector">
      <disabled>no</disabled>
      <interval>6h</interval>
      <scan_on_start>yes</scan_on_start>
      <hardware>yes</hardware>
      <os>yes</os>
      <network>yes</network>
      <packages>yes</packages>
      <ports all="no">yes</ports>
      <processes>no</processes>
      <hotfixes>yes</hotfixes>
    </wodle>
    <!-- Rootcheck en Windows: sus políticas rcl están obsoletas y SCA (CIS) las reemplaza;
         activarlo solo suma falsos positivos y CPU. -->
    <rootcheck>
      <disabled>yes</disabled>
    </rootcheck>
    <sca>
      <enabled>yes</enabled>
      <scan_on_start>yes</scan_on_start>
      <interval>24h</interval>
      <skip_nfs>yes</skip_nfs>
    </sca>
    <!-- Monitor-only: QAPAQ ejecuta respuestas solo por Ankay con aprobación SoD. -->
    <active-response>
      <disabled>yes</disabled>
    </active-response>
    <client_buffer>
      <disabled>no</disabled>
      <queue_size>5000</queue_size>
      <events_per_second>500</events_per_second>
    </client_buffer>
  </agent_config>
  <agent_config os="^Linux">
    <labels>
      <label key="qapaq_profile">srv-web</label>
      <label key="qapaq_criticality">high</label>
      <label key="qapaq_tier">tier1</label>
    </labels>
    <!-- auditd: execve privilegiado, cambios de identidad y módulos de kernel (reglas en deploy/linux/audit). -->
    <localfile>
      <location>/var/log/audit/audit.log</location>
      <log_format>audit</log_format>
    </localfile>
    <!-- nginx: solicitudes web (decoders web-accesslog). -->
    <localfile>
      <location>/var/log/nginx/access.log</location>
      <log_format>syslog</log_format>
    </localfile>
    <!-- nginx: errores. -->
    <localfile>
      <location>/var/log/nginx/error.log</location>
      <log_format>syslog</log_format>
    </localfile>
    <!-- Apache (Debian/Ubuntu). -->
    <localfile>
      <location>/var/log/apache2/access.log</location>
      <log_format>apache</log_format>
    </localfile>
    <!-- Apache (RHEL/Rocky). -->
    <localfile>
      <location>/var/log/httpd/access_log</location>
      <log_format>apache</log_format>
    </localfile>
    <syscheck>
      <disabled>no</disabled>
      <frequency>43200</frequency>
      <scan_on_start>yes</scan_on_start>
      <max_eps>100</max_eps>
      <process_priority>10</process_priority>
      <!-- Identidad y privilegios: altas de usuarios, sudo, PAM. whodata atribuye el cambio al usuario. -->
      <directories whodata="yes" check_all="yes">/etc/passwd,/etc/shadow,/etc/group,/etc/gshadow</directories>
      <directories whodata="yes" check_all="yes" report_changes="yes">/etc/sudoers,/etc/sudoers.d</directories>
      <directories whodata="yes" check_all="yes">/etc/pam.d</directories>
      <!-- Acceso remoto: llaves autorizadas y configuración SSH. -->
      <directories whodata="yes" check_all="yes" report_changes="yes">/etc/ssh</directories>
      <directories whodata="yes" check_all="yes">/root/.ssh</directories>
      <!-- Persistencia: cron, systemd, perfiles de shell y precarga de bibliotecas. -->
      <directories realtime="yes" check_all="yes">/etc/cron.d,/etc/cron.daily,/etc/cron.hourly,/etc/crontab,/var/spool/cron</directories>
      <directories realtime="yes" check_all="yes">/etc/systemd/system,/etc/profile.d</directories>
      <directories realtime="yes" check_all="yes" report_changes="yes">/etc/ld.so.preload</directories>
      <!-- Autoprotección: reglas de auditoría y configuración del agente. -->
      <directories realtime="yes" check_all="yes">/etc/audit,/var/ossec/etc/ossec.conf,/var/ossec/etc/local_internal_options.conf</directories>
      <ignore type="sregex">\.swp$|\.tmp$|~$</ignore>
      <!-- Raíz web y configuración del servidor: webshells y redirecciones. -->
      <directories realtime="yes" check_all="yes" restrict="\.php$|\.jsp$|\.aspx?$|\.sh$|\.py$|\.pl$|\.cgi$|\.war$">/var/www</directories>
      <directories realtime="yes" check_all="yes">/etc/nginx,/etc/apache2,/etc/httpd</directories>
    </syscheck>
    <!-- Inventario para vulnerabilidades y contexto de activo. Sin procesos: volumen y privacidad. -->
    <wodle name="syscollector">
      <disabled>no</disabled>
      <interval>6h</interval>
      <scan_on_start>yes</scan_on_start>
      <hardware>yes</hardware>
      <os>yes</os>
      <network>yes</network>
      <packages>yes</packages>
      <ports all="no">yes</ports>
      <processes>no</processes>
    </wodle>
    <!-- Rootcheck en Linux: detecta rootkits de usuario/kernel, procesos y puertos ocultos.
         check_unixaudit queda en no porque SCA (CIS) cubre el endurecimiento. -->
    <rootcheck>
      <disabled>no</disabled>
      <frequency>43200</frequency>
      <check_dev>yes</check_dev>
      <check_files>yes</check_files>
      <check_if>yes</check_if>
      <check_pids>yes</check_pids>
      <check_ports>yes</check_ports>
      <check_sys>yes</check_sys>
      <check_trojans>yes</check_trojans>
      <check_unixaudit>no</check_unixaudit>
      <skip_nfs>yes</skip_nfs>
    </rootcheck>
    <sca>
      <enabled>yes</enabled>
      <scan_on_start>yes</scan_on_start>
      <interval>24h</interval>
      <skip_nfs>yes</skip_nfs>
    </sca>
    <active-response>
      <disabled>yes</disabled>
    </active-response>
    <client_buffer>
      <disabled>no</disabled>
      <queue_size>5000</queue_size>
      <events_per_second>500</events_per_second>
    </client_buffer>
  </agent_config>
