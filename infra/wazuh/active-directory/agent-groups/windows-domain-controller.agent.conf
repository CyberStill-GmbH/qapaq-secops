<!--
  Perfil complementario al grupo Windows piloto, que ya recoge Security y System.
  Asociar solo a controladores de dominio; combinar con la política central vigente.
  No duplica Security/System ni habilita respuesta activa.
-->
<agent_config os="^Windows">
  <localfile>
    <location>Directory Service</location>
    <log_format>eventchannel</log_format>
  </localfile>
  <localfile>
    <location>DNS Server</location>
    <log_format>eventchannel</log_format>
  </localfile>
  <localfile>
    <location>Microsoft-Windows-GroupPolicy/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>
  <localfile>
    <location>Microsoft-Windows-PowerShell/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>
</agent_config>
