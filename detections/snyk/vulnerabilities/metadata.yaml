  - 101451
  - 101452
  - 101453
  - 101454
  - 101455
  - 101456
  - 101457
  - 101458
mitre:
- technique: T1190
  tactic: initial-access
severity:
  levels: 3 baja · 5 media · 10 alta · 11 alta+exploit · 12 crítica · 13 crítica+exploit
  priority_hint: P2 crítica; P3 alta
  rationale: Escala Snyk mapeada a modules/telemetry.
false_positives:
- Dependencias de desarrollo no desplegadas.
- Issues ya mitigados por WAF sin marcar en Snyk.
tuning: []
tests:
  runner: logtest
  suite: collectors
  fixtures: wazuh/provider-ingestion/tests/collector-cases.jsonl
