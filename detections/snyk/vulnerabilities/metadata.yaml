# QAPAQ SecOps · metadatos de detección (estándar: docs/detection-engineering/01-ciclo-de-vida.md#metadatos)
# Referencia: las reglas viven en su ruta canónica y no se mueven.
id: QAPAQ-DET-SNYK-001
title: Vulnerabilidades de código y dependencias (Snyk)
source: snyk
use_case: vulnerabilities
status: production
version: 1.0.0
owner: provider-ingestion
reviewers:
- qapaq.soc.lead
created: '2026-11-04'
updated: '2026-11-04'
hypothesis: Una vulnerabilidad abierta y explotable en código propio es la puerta de entrada más probable de una
  fintech digital.
data_sources:
- Snyk REST API de issues (collector qapaq-collector-snyk, cada 15 min)
rules:
  file: wazuh/provider-ingestion/rules/qapaq_snyk_rules.xml
