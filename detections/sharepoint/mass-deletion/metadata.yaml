# QAPAQ SecOps · metadatos de detección (estándar: docs/detection-engineering/01-ciclo-de-vida.md#metadatos)
# Reglas nuevas del programa en rule.xml de esta carpeta. SharePoint/OneDrive: docs/23-sharepoint-onedrive.md.
id: QAPAQ-DET-SP-002
title: Borrado masivo y vaciado de la papelera en SharePoint/OneDrive
source: sharepoint
use_case: mass-deletion
status: testing
version: 1.0.0
owner: soc-detection-engineering
reviewers:
- qapaq.soc.lead
created: '2026-11-09'
updated: '2026-11-11'
hypothesis: El sabotaje, el ransomware en la nube o el borrado de rastros tras exfiltrar eliminan muchos elementos en minutos
  y vacían la papelera de segunda etapa para impedir la restauración.
data_sources:
- Office 365 Management Activity API, Audit.SharePoint (módulo office365 de Wazuh; ActivityFeed.Read)
- Microsoft Graph Purview Audit Search /security/auditLog/queries (collector qapaq-sharepoint-audit; AuditLogsQuery-SharePoint.Read.All
  / AuditLogsQuery-OneDrive.Read.All)
rules:
  file: detections/sharepoint/mass-deletion/rule.xml
  ids:
  - 101915
  - 101916
  - 101917
  - 101918
  - 101919
  - 101920
  installed_as: etc/rules/qapaq_soc_sharepoint_mass_deletion.xml
mitre:
- technique: T1485
  tactic: impact
- technique: T1490
  tactic: impact
severity:
  levels: 3 marca · 2 cuenta de servicio · 10 borrado masivo (100/10 min) · 12 vaciado de la papelera de 2.ª etapa (25/15
    min) · 13 destrucción (300/15 min)
  priority_hint: P1 (12–13) / P2 (10)
  rationale: Vaciar la segunda etapa y borrar 300 elementos no tiene uso cotidiano.
false_positives:
- Reorganización de bibliotecas por el dueño del sitio (con aviso previo).
- Retención o limpieza automatizada con cuenta de servicio (registrar en la allowlist).
tuning:
- Allowlist qapaq-m365-service-accounts.
- Umbrales por usuario; la regla de 300 atraviesa las alertas de 100 porque tiene nivel mayor.
lists:
- detections/lists/qapaq-m365-service-accounts
tests:
  runner: logtest
  fixtures: detections/sharepoint/mass-deletion/fixtures.jsonl
  expected: detections/sharepoint/mass-deletion/expected.txt
  generator: wazuh/provider-ingestion/sharepoint/tests/make_fixtures.py
runbook: docs/detection-engineering/runbooks/exfiltracion-sharepoint.md
notes: Activa desde 2026-11-10 en AWS con datos reales (módulo office365, Audit.SharePoint, ActivityFeed.Read). Operaciones
  sin registro real todavía siguen en el grupo qapaq_pending_provider_evidence (docs/23).
