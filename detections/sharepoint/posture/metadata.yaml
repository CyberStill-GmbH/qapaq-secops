runbook: docs/detection-engineering/runbooks/exfiltracion-sharepoint.md
notes: 'Sin datos al 2026-11-11: faltan SharePointTenantSettings.Read.All y Sites.Read.All (HTTP 403); el collector emite
  solo eventos de capacidad (101969). Probado con fixtures sintéticos.'
