<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080808" />
    <meta name="description" content="Acceso institucional a QAPAQ SecOps." />
    <title>Iniciar sesión · QAPAQ SecOps</title>
    <style>
      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
        background: #080808;
      }
      .auth-startup {
        position: fixed;
        z-index: 100;
        inset: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #080808;
      }
      .auth-splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #080808;
        pointer-events: none;
      }
      .auth-splash-mark {
        width: clamp(64px, 7vw, 96px);
        aspect-ratio: 1;
        background: #fff;
        opacity: 0.76;
        filter: drop-shadow(0 0 16px rgb(255 255 255 / 12%));
        mask: url('%BASE_URL%qapaq-q-mask.png') center / contain no-repeat;
        -webkit-mask: url('%BASE_URL%qapaq-q-mask.png') center / contain no-repeat;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="auth-startup" aria-busy="true" aria-label="QAPAQ SecOps">
        <div class="auth-splash" aria-hidden="true"><span class="auth-splash-mark"></span></div>
      </main>
    </div>
    <noscript>Activa JavaScript para iniciar la interfaz.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
