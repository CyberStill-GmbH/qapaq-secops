name: Repair Wazuh dashboard credential

on:
  workflow_dispatch:

permissions:
  id-token: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::955200662475:role/qapaq-secops-github-terraform-demo
          aws-region: us-east-1
          role-session-name: qapaq-secops-wazuh-credential-repair
          allowed-account-ids: 955200662475

      - name: Rotate and store dashboard admin credential
        shell: bash
        run: |
          set -euo pipefail
          instance_id="$(aws ec2 describe-instances \
            --filters 'Name=tag:Name,Values=qapaq-secops-demo-wazuh' 'Name=instance-state-name,Values=running' \
            --query 'Reservations[].Instances[].InstanceId | [0]' --output text)"
          if [[ -z "$instance_id" || "$instance_id" == None ]]; then
            echo 'No running Wazuh EC2 instance found.' >&2
            exit 1
          fi

          remote_script="$(cat <<'REMOTE'
          set -euo pipefail
          umask 077
          password="$(openssl rand -hex 24)"
          tool=/usr/share/wazuh-indexer/plugins/opensearch-security/tools/wazuh-passwords-tool.sh
          phase=rotate
          if ! bash "$tool" -u admin -p "$password" >/dev/null 2>&1; then
            unset password
            echo "Wazuh admin credential repair failed during $phase." >&2
            exit 1
          fi
          secret_file="$(mktemp /dev/shm/qapaq-wazuh-admin-secret.XXXXXX)"
          trap 'rm -f "$secret_file"; unset password' EXIT
          printf '{"username":"admin","password":"%s"}' "$password" > "$secret_file"
          phase=store
          if ! aws secretsmanager put-secret-value \
            --region us-east-1 \
            --secret-id qapaq-secops/demo/wazuh/dashboard-admin \
            --secret-string "file://$secret_file" >/dev/null 2>&1; then
            echo "Wazuh admin credential repair failed during $phase." >&2
            exit 1
          fi
          echo 'Wazuh admin credential rotated and stored in Secrets Manager.'
          REMOTE
          )"
          payload="$(jq -cn --arg command "$remote_script" '{commands: [$command]}')"
          command_id="$(aws ssm send-command \
            --instance-ids "$instance_id" \
            --document-name AWS-RunShellScript \
            --comment 'Rotate and synchronize Wazuh dashboard admin credential' \
            --parameters "$payload" \
            --query 'Command.CommandId' --output text)"

          for attempt in $(seq 1 60); do
            status="$(aws ssm get-command-invocation --command-id "$command_id" \
              --instance-id "$instance_id" --query Status --output text 2>/dev/null || true)"
            case "$status" in
              Success|Failed|Cancelled|TimedOut|Undeliverable|Terminated) break ;;
            esac
            sleep 5
          done
          if [[ "$status" != Success ]]; then
            echo "SSM credential repair ended with status: ${status:-unknown}" >&2
            aws ssm get-command-invocation --command-id "$command_id" \
              --instance-id "$instance_id" \
              --query '{Output:StandardOutputContent,Error:StandardErrorContent}' --output json || true
            exit 1
          fi
          aws ssm get-command-invocation --command-id "$command_id" \
            --instance-id "$instance_id" --query StandardOutputContent --output text
