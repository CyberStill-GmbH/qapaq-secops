name: Seed one EUS2 Key Vault secret through ARM

on:
  workflow_dispatch:
    inputs:
      source_secret:
        description: GitHub Environment secret or fixed Indexer bootstrap placeholder (exact allowlist)
        required: true
        type: choice
        options:
          - QAPAQ_EUS2_ENTRA_CLIENT_SECRET
          - QAPAQ_EUS2_OFFICE365_CLIENT_SECRET
          - QAPAQ_EUS2_SOPHOS_CLIENT_ID
          - QAPAQ_EUS2_SOPHOS_CLIENT_SECRET
          - QAPAQ_EUS2_CATO_API_KEY
          - QAPAQ_EUS2_TEAMS_WORKFLOW_URL
          - QAPAQ_EUS2_WAZUH_INSTALL_FILES_TAR_B64
          - QAPAQ_EUS2_WAZUH_INDEXER_READER_BOOTSTRAP
          - QAPAQ_EUS2_WAZUH_INDEXER_PROXY_CA_BOOTSTRAP
      confirm_seed:
        description: Type SEED-EUS2-SECRET to request one create-only secret write
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: seed-eus2-key-vault-secret
  cancel-in-progress: false

jobs:
  validate_request:
    name: Validate request before resolving Environment secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Validate branch, phrase and static allowlist
        env:
          TARGET_REF: ${{ github.ref }}
          SOURCE_SECRET_NAME: ${{ inputs.source_secret }}
          CONFIRM_SEED: ${{ inputs.confirm_seed }}
        run: |
          set -euo pipefail
          [[ "$TARGET_REF" == 'refs/heads/main' ]] || {
            echo '::error::This workflow is restricted to main.'; exit 1;
          }
          [[ "$CONFIRM_SEED" == 'SEED-EUS2-SECRET' ]] || {
            echo '::error::Confirmation phrase is incorrect.'; exit 1;
          }
          case "$SOURCE_SECRET_NAME" in
            QAPAQ_EUS2_ENTRA_CLIENT_SECRET|QAPAQ_EUS2_OFFICE365_CLIENT_SECRET|\
            QAPAQ_EUS2_SOPHOS_CLIENT_ID|QAPAQ_EUS2_SOPHOS_CLIENT_SECRET|\
            QAPAQ_EUS2_CATO_API_KEY|QAPAQ_EUS2_TEAMS_WORKFLOW_URL|\
            QAPAQ_EUS2_WAZUH_INSTALL_FILES_TAR_B64|\
            QAPAQ_EUS2_WAZUH_INDEXER_READER_BOOTSTRAP|\
            QAPAQ_EUS2_WAZUH_INDEXER_PROXY_CA_BOOTSTRAP) ;;
            *) echo '::error::Source secret is not allowlisted.'; exit 1 ;;
          esac

  seed:
    needs: validate_request
    if: needs.validate_request.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: azure-demo-eus2
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_EUS2_SECRET_SEEDER_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_EUS2_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_EUS2_SUBSCRIPTION_ID }}
      SOURCE_SECRET_NAME: ${{ inputs.source_secret }}
      VAULT_NAME: kv-qapaqsecopsd-3a2405f3
      RESOURCE_GROUP: rg-qapaqsecopsdemoeus-3a2405f3
    steps:
      - name: Check out protected main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate Azure target identifiers
        run: |
          set -euo pipefail
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            [[ -n "${!name}" ]] || {
              echo "::error::Missing required azure-demo-eus2 variable: $name"; exit 1;
            }
          done
          [[ "$AZURE_SUBSCRIPTION_ID" == 'aaf787f8-5964-4470-9eb6-89d15eacda61' ]] || {
            echo '::error::Refusing an unexpected subscription.'; exit 1;
          }

      - name: Sign in with EUS2 seeder OIDC identity
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_EUS2_SECRET_SEEDER_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_EUS2_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_EUS2_SUBSCRIPTION_ID }}

      - name: Verify subscription and private Key Vault configuration
        shell: bash
        run: |
          set -euo pipefail
          vault_id="/subscriptions/${AZURE_SUBSCRIPTION_ID}/resourceGroups/${RESOURCE_GROUP}/providers/Microsoft.KeyVault/vaults/${VAULT_NAME}"
          account="$RUNNER_TEMP/eus2-seed-account.json"
          vault="$RUNNER_TEMP/eus2-seed-vault.json"
          trap 'rm -f "$account" "$vault"' EXIT
          az account show --query '{id:id,tenantId:tenantId}' -o json > "$account"
          jq -e --arg s "$AZURE_SUBSCRIPTION_ID" --arg t "$AZURE_TENANT_ID" \
            '.id == $s and .tenantId == $t' "$account" >/dev/null || {
              echo '::error::Unexpected OIDC tenant or subscription.'; exit 1;
            }
          az keyvault show --name "$VAULT_NAME" --resource-group "$RESOURCE_GROUP" \
            --subscription "$AZURE_SUBSCRIPTION_ID" \
          --query '{id:id,location:location,pna:properties.publicNetworkAccess,action:properties.networkAcls.defaultAction,bypass:properties.networkAcls.bypass,privateEndpoints:properties.privateEndpointConnections[].properties.privateLinkServiceConnectionState.status}' \
            -o json > "$vault"
          jq -e --arg id "$vault_id" \
            '.id == $id and .location == "eastus2" and .pna == "Disabled" and .action == "Deny" and .bypass == "None" and (.privateEndpoints | type == "array" and length > 0 and all(.[]; . == "Approved"))' \
            "$vault" >/dev/null || {
              echo '::error::Vault target, private endpoint or network policy differs; refusing to write.'; exit 1;
            }
          echo 'Vault identity, approved private endpoint and network controls verified; no network setting changed.'

      - name: Resolve allowlisted Key Vault secret name
        id: target
        run: |
          set -euo pipefail
          name="$(python3 .github/ci/prepare-eus2-key-vault-parameters.py --resolve-name "$SOURCE_SECRET_NAME")"
          echo "secret_name=$name" >> "$GITHUB_OUTPUT"

      - name: Refuse overwrite
        shell: bash
        env:
          SECRET_NAME: ${{ steps.target.outputs.secret_name }}
        run: |
          set -euo pipefail
          secret_id="/subscriptions/${AZURE_SUBSCRIPTION_ID}/resourceGroups/${RESOURCE_GROUP}/providers/Microsoft.KeyVault/vaults/${VAULT_NAME}/secrets/${SECRET_NAME}"
          result="$RUNNER_TEMP/eus2-seed-existing.txt"
          error="$RUNNER_TEMP/eus2-seed-existing.err"
          trap 'rm -f "$result" "$error"' EXIT
          set +e
          az resource show --ids "$secret_id" --api-version 2025-05-01 --query id -o tsv \
            --only-show-errors > "$result" 2> "$error"
          status=$?
          set -e
          if [[ $status -eq 0 && -s "$result" ]]; then
            echo '::error::Secret already exists; this flow is create-only and will not rotate it.'; exit 1;
          fi
          grep -q 'ResourceNotFound' "$error" || {
            echo '::error::Could not confirm the secret is absent; refusing to write.'; exit 1;
          }

      - name: Create protected ARM parameter file
        if: ${{ !startsWith(inputs.source_secret, 'QAPAQ_EUS2_WAZUH_INDEXER_') }}
        shell: bash
        env:
          SOURCE_SECRET_NAME: ${{ inputs.source_secret }}
          SELECTED_SECRET_VALUE: ${{ secrets[inputs.source_secret] }}
        run: |
          set -euo pipefail
          parameter_file="$RUNNER_TEMP/eus2-kv-parameters.json"
          python3 .github/ci/prepare-eus2-key-vault-parameters.py --write "$parameter_file"
          chmod 600 "$parameter_file"

      - name: Create fixed bootstrap placeholder parameter file
        if: ${{ startsWith(inputs.source_secret, 'QAPAQ_EUS2_WAZUH_INDEXER_') }}
        shell: bash
        env:
          SOURCE_SECRET_NAME: ${{ inputs.source_secret }}
        run: |
          set -euo pipefail
          parameter_file="$RUNNER_TEMP/eus2-kv-parameters.json"
          python3 .github/ci/prepare-eus2-key-vault-parameters.py --write-bootstrap-placeholder "$parameter_file"
          chmod 600 "$parameter_file"

      - name: Deploy one secret through ARM secureString
        shell: bash
        env:
          SECRET_NAME: ${{ steps.target.outputs.secret_name }}
        run: |
          set -euo pipefail
          parameter_file="$RUNNER_TEMP/eus2-kv-parameters.json"
          error="$RUNNER_TEMP/eus2-kv-deploy.err"
          metadata="$RUNNER_TEMP/eus2-kv-result.json"
          id="/subscriptions/${AZURE_SUBSCRIPTION_ID}/resourceGroups/${RESOURCE_GROUP}/providers/Microsoft.KeyVault/vaults/${VAULT_NAME}/secrets/${SECRET_NAME}"
          trap 'rm -f "$parameter_file" "$error" "$metadata"' EXIT
          if ! az deployment group create \
            --name "qapaq-eus2-secret-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --resource-group "$RESOURCE_GROUP" --mode Incremental \
            --template-file infra/azure/secrets/eus2-key-vault-secret.json \
            --parameters "@${parameter_file}" --output none --only-show-errors 2>"$error"; then
            echo '::error::ARM deployment failed; response body withheld.'; exit 1;
          fi
          az resource show --ids "$id" --api-version 2025-05-01 \
            --query '{id:id,enabled:properties.attributes.enabled,expires:properties.attributes.exp}' \
            -o json --only-show-errors > "$metadata" || {
              echo '::error::Deployment completed but metadata verification failed.'; exit 1;
            }
          jq -e --arg id "$id" '.id == $id and .enabled == true' "$metadata" >/dev/null || {
            echo '::error::Secret metadata does not match the selected target.'; exit 1;
          }
          {
            echo '## EUS2 Key Vault seed result'
            echo
            echo "- Secret name: ${SECRET_NAME}"
            echo '- Metadata: enabled; value was not requested.'
            echo '- Key Vault networking: unchanged and public access remains disabled.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary ARM parameters
        if: always()
        run: >-
          rm -f "$RUNNER_TEMP/eus2-kv-parameters.json"
          "$RUNNER_TEMP/eus2-kv-deploy.err"
          "$RUNNER_TEMP/eus2-kv-result.json"
          "$RUNNER_TEMP/eus2-seed-account.json"
          "$RUNNER_TEMP/eus2-seed-vault.json"
          "$RUNNER_TEMP/eus2-seed-existing.txt"
          "$RUNNER_TEMP/eus2-seed-existing.err"
