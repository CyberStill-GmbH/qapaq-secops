name: QAPAQ dashboard to Azure ACR

on:
  pull_request:
    paths:
      - "wazuh/dashboard/**"
      - ".github/workflows/qapaq-dashboard-azure.yml"
  workflow_dispatch:
    inputs:
      publish_to_acr:
        description: Publish the verified package to the Azure demo registry
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: qapaq-dashboard-azure-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and verify package without cloud credentials
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reject publish requests from non-main refs
        if: github.event_name == 'workflow_dispatch' && inputs.publish_to_acr == true && github.ref != 'refs/heads/main'
        run: |
          echo 'La publicación a ACR solo se permite desde main.' >&2
          exit 1

      - name: Build QAPAQ Dashboard package
        run: bash wazuh/dashboard/build.sh "$RUNNER_TEMP/qapaq-dashboard"

      - name: Verify package and record provenance inputs
        id: package
        working-directory: ${{ runner.temp }}/qapaq-dashboard
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t packages < <(find . -maxdepth 1 -type f -name '*.deb' -print)
          [[ "${#packages[@]}" == 1 ]] || { echo "Se esperaba un .deb; se encontraron ${#packages[@]}" >&2; exit 1; }
          sha256sum -c SHA256SUMS

          package_file="${packages[0]#./}"
          package_name="$(dpkg-deb --field "$package_file" Package)"
          package_version="$(dpkg-deb --field "$package_file" Version)"
          [[ "$package_name" == "wazuh-dashboard" ]] || { echo "Paquete inesperado: $package_name" >&2; exit 1; }

          # El build y el deploy deben consumir la misma versión upstream fijada.
          source "$GITHUB_WORKSPACE/wazuh/dashboard/upstream.lock"
          [[ "$package_version" == "${WAZUH_VERSION}-${QAPAQ_REVISION}" ]] || {
            echo "Versión del paquete ($package_version) no coincide con upstream.lock" >&2
            exit 1
          }

          package_sha256="$(sha256sum "$package_file" | awk '{print $1}')"
          printf 'commit=%s\npackage=%s\nversion=%s\nsha256=%s\n' \
            "$GITHUB_SHA" "$package_name" "$package_version" "$package_sha256" \
            > package-metadata.txt
          echo "package_sha256=$package_sha256" >> "$GITHUB_OUTPUT"
          echo "package_file=$package_file" >> "$GITHUB_OUTPUT"

      - name: Upload immutable run artifact for the publish job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qapaq-dashboard-${{ github.sha }}
          path: |
            ${{ runner.temp }}/qapaq-dashboard/*.deb
            ${{ runner.temp }}/qapaq-dashboard/SHA256SUMS
            ${{ runner.temp }}/qapaq-dashboard/package-metadata.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    name: Publish verified OCI artifact to ACR (manual, main only)
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.publish_to_acr == true &&
      github.ref == 'refs/heads/main'
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: azure-demo
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download package built by the unprivileged job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: qapaq-dashboard-${{ github.sha }}
          path: ${{ runner.temp }}/qapaq-dashboard

      - name: Validate Azure publication target
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_ACR_PUBLISHER_CLIENT_ID || vars.AZURE_ACR_PUBLISHER_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID || vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID || vars.AZURE_SUBSCRIPTION_ID }}
          ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
          ACR_LOGIN_SERVER: ${{ vars.AZURE_ACR_LOGIN_SERVER }}
        run: |
          set -euo pipefail
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID ACR_NAME ACR_LOGIN_SERVER; do
            [[ -n "${!name}" ]] || { echo "Falta la variable de entorno GitHub $name" >&2; exit 1; }
          done
          [[ "$ACR_NAME" =~ ^[a-z0-9]{5,50}$ ]] || { echo 'AZURE_ACR_NAME no cumple el formato de ACR.' >&2; exit 1; }
          [[ "$ACR_LOGIN_SERVER" == "${ACR_NAME}.azurecr.io" ]] || { echo 'El login server no coincide con el ACR configurado.' >&2; exit 1; }

      - name: Verify artifact before cloud authentication
        working-directory: ${{ runner.temp }}/qapaq-dashboard
        run: |
          set -euo pipefail
          mapfile -t packages < <(find . -maxdepth 1 -type f -name '*.deb' -print)
          [[ "${#packages[@]}" == 1 ]] || { echo "Se esperaba un .deb; se encontraron ${#packages[@]}" >&2; exit 1; }
          sha256sum -c SHA256SUMS
          grep -Fxq "commit=${GITHUB_SHA}" package-metadata.txt
          expected_version="$(awk -F= '$1 == "version" { print $2 }' package-metadata.txt)"
          actual_version="$(dpkg-deb --field "${packages[0]}" Version)"
          [[ "$actual_version" == "$expected_version" ]] || { echo 'La versión del .deb no coincide con el metadata del build.' >&2; exit 1; }

      - name: Install pinned ORAS CLI
        uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
        with:
          version: 1.3.5

      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_ACR_PUBLISHER_CLIENT_ID || vars.AZURE_ACR_PUBLISHER_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID || vars.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID || vars.AZURE_SUBSCRIPTION_ID }}

      - name: Publish package to ACR by content hash
        env:
          ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
          ACR_LOGIN_SERVER: ${{ vars.AZURE_ACR_LOGIN_SERVER }}
        working-directory: ${{ runner.temp }}/qapaq-dashboard
        shell: bash
        run: |
          set -euo pipefail
          package_file="$(find . -maxdepth 1 -type f -name '*.deb' -print -quit)"
          package_hash="$(awk -F= '$1 == "sha256" { print $2 }' package-metadata.txt)"
          [[ "$package_hash" =~ ^[0-9a-f]{64}$ ]]

          access_token="$(az acr login --name "$ACR_NAME" --expose-token --output tsv --query accessToken)"
          [[ -n "$access_token" ]] || { echo 'Azure no entregó un token temporal para ACR.' >&2; exit 1; }
          printf '%s' "$access_token" | oras login "$ACR_LOGIN_SERVER" \
            --username 00000000-0000-0000-0000-000000000000 --password-stdin
          unset access_token

          artifact_tag="git-${GITHUB_SHA}-sha256-${package_hash}"
          artifact_ref="${ACR_LOGIN_SERVER}/qapaq-dashboard:${artifact_tag}"
          oras push "$artifact_ref" \
            --artifact-type application/vnd.qapaq.dashboard.package.v1 \
            "$package_file:application/vnd.debian.binary-package" \
            SHA256SUMS:text/plain package-metadata.txt:text/plain \
            --format json > "$RUNNER_TEMP/qapaq-dashboard-publish.json"
          manifest_digest="$(jq -er '.digest' "$RUNNER_TEMP/qapaq-dashboard-publish.json")"
          [[ "$manifest_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo 'ORAS no devolvió un digest OCI verificable.' >&2; exit 1; }
          echo "Artefacto publicado: ${ACR_LOGIN_SERVER}/qapaq-dashboard@${manifest_digest}"
          echo "Referencia de contenido: ${artifact_ref}"
          printf '### Paquete QAPAQ Dashboard publicado a ACR\n\n- Commit: `%s`\n- SHA-256 del .deb: `%s`\n- OCI digest: `%s`\n' \
            "$GITHUB_SHA" "$package_hash" "$manifest_digest" >> "$GITHUB_STEP_SUMMARY"
