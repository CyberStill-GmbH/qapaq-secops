name: QAPAQ Wazuh Active Directory detections

on:
  pull_request:
    paths:
      - 'infra/wazuh/active-directory/**'
      - 'docs/security/active-directory-detection-profile.md'
      - '.github/workflows/wazuh-active-directory-detection.yml'
  push:
    branches: [main]
    paths:
      - 'infra/wazuh/active-directory/**'
      - 'docs/security/active-directory-detection-profile.md'
      - '.github/workflows/wazuh-active-directory-detection.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qapaq-wazuh-ad-detection-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ad-logtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start isolated Wazuh Manager 4.14.8
        run: docker run --detach --rm --name qapaq-wazuh-ad-test wazuh/wazuh-manager:4.14.8
      - name: Wait for Manager and run AD positive/negative fixtures
        run: |
          ready=false
          for attempt in $(seq 1 60); do
            if docker exec qapaq-wazuh-ad-test /var/ossec/bin/wazuh-analysisd -t >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true
          bash infra/wazuh/active-directory/tests/run-logtest.sh qapaq-wazuh-ad-test
      - name: Stop test Manager
        if: always()
        run: docker rm -f qapaq-wazuh-ad-test || true
