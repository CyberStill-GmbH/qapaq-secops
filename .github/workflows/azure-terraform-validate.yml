name: Azure Terraform validation

on:
  pull_request:
    paths:
      - ".github/workflows/azure-terraform-validate.yml"
      - "infra/azure/**"
      - "platform/configuration/src/schema/environment.schema.ts"
      - "scripts/check-azure-runtime-env.mjs"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/azure-terraform-validate.yml"
      - "infra/azure/**"
      - "platform/configuration/src/schema/environment.schema.ts"
      - "scripts/check-azure-runtime-env.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-terraform-validate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: fmt, init and validate (no cloud credentials)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify Azure runtime environment contract
        run: node scripts/check-azure-runtime-env.mjs

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false

      - name: Check formatting
        run: terraform -chdir=infra/azure fmt -check -recursive

      - name: Initialize without backend or provider credentials
        run: terraform -chdir=infra/azure init -backend=false -input=false -no-color

      - name: Validate configuration
        run: terraform -chdir=infra/azure validate -no-color
