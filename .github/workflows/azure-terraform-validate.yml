name: Azure Terraform validation

on:
  pull_request:
    paths:
      - ".github/workflows/azure-terraform-validate.yml"
      - ".github/workflows/terraform-azure.yml"
      - "scripts/ci/validate-azure-deployment-inputs.mjs"
      - "scripts/ci/validate-azure-deployment-inputs.test.mjs"
      - "infra/azure/**"
      - "platform/configuration/src/schema/environment.schema.ts"
      - "scripts/check-azure-runtime-env.mjs"
      - "scripts/ci/azure-tf-plan-summary.mjs"
      - "scripts/ci/azure-tf-plan-summary.test.mjs"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/azure-terraform-validate.yml"
      - ".github/workflows/terraform-azure.yml"
      - "scripts/ci/validate-azure-deployment-inputs.mjs"
      - "scripts/ci/validate-azure-deployment-inputs.test.mjs"
      - "infra/azure/**"
      - "platform/configuration/src/schema/environment.schema.ts"
      - "scripts/check-azure-runtime-env.mjs"
      - "scripts/ci/azure-tf-plan-summary.mjs"
      - "scripts/ci/azure-tf-plan-summary.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-terraform-validate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: fmt, init, validate and test (no cloud credentials)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify Azure runtime environment contract
        run: node scripts/check-azure-runtime-env.mjs

      - name: Verify Azure deploy inputs fail closed by default
        run: node --test scripts/ci/validate-azure-deployment-inputs.test.mjs

      - name: Verify Azure Terraform plan guard
        run: node --test scripts/ci/azure-tf-plan-summary.test.mjs

      - name: Verify SIEM bootstrap suppresses installer output
        run: python3 infra/azure/modules/siem_host/test_bootstrap_siem.py

      - name: Verify SIEM and Ankay disk formatting fails closed
        run: python3 infra/azure/modules/ankay_host/test_prepare_data_disk.py

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false

      - name: Check formatting
        run: terraform -chdir=infra/azure fmt -check -recursive

      - name: Initialize without backend or provider credentials
        run: terraform -chdir=infra/azure init -backend=false -input=false -no-color

      - name: Validate configuration
        run: terraform -chdir=infra/azure validate -no-color

      - name: Test root input contract with a mocked provider
        run: terraform -chdir=infra/azure test -no-color

      - name: Initialize the isolated EUS2 Key Vault seeder identity module
        run: terraform -chdir=infra/azure/modules/key_vault_seed_identity init -backend=false -input=false -no-color

      - name: Validate the EUS2 Key Vault seeder identity module
        run: terraform -chdir=infra/azure/modules/key_vault_seed_identity validate -no-color

      - name: Test EUS2 seeder OIDC, scopes and least privilege
        run: terraform -chdir=infra/azure/modules/key_vault_seed_identity test -no-color

      - name: Initialize the managed egress firewall module without cloud credentials
        run: terraform -chdir=infra/azure/modules/egress_firewall init -backend=false -input=false -no-color

      - name: Test the managed egress firewall policy without cloud credentials
        run: terraform -chdir=infra/azure/modules/egress_firewall test -no-color

      - name: Initialize Azure bootstrap without cloud credentials
        run: terraform -chdir=infra/azure/bootstrap init -backend=false -input=false -no-color

      - name: Validate Azure bootstrap configuration
        run: terraform -chdir=infra/azure/bootstrap validate -no-color

      - name: Initialize the isolated SIEM host module without cloud credentials
        run: terraform -chdir=infra/azure/modules/siem_host init -backend=false -input=false -no-color

      - name: Validate the SIEM host module
        run: terraform -chdir=infra/azure/modules/siem_host validate -no-color

      - name: Test the SIEM host module without cloud credentials
        run: terraform -chdir=infra/azure/modules/siem_host test -no-color

      - name: Initialize the isolated Ankay host module without cloud credentials
        run: terraform -chdir=infra/azure/modules/ankay_host init -backend=false -input=false -no-color

      - name: Validate the Ankay host module
        run: terraform -chdir=infra/azure/modules/ankay_host validate -no-color

      - name: Initialize private KrakenD gateway module without cloud credentials
        run: terraform -chdir=infra/azure/modules/krakend_gateway init -backend=false -input=false -no-color

      - name: Validate the private KrakenD gateway module
        run: terraform -chdir=infra/azure/modules/krakend_gateway validate -no-color

      - name: Test private KrakenD network, ingress and secret-reference contract
        run: terraform -chdir=infra/azure/modules/krakend_gateway test -no-color
