name: Azure SIEM offline release bundle

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Immutable main commit used by all three successful source builds; must be an ancestor of current main
        type: string
        required: true
      prerequisites_run_id:
        description: Successful main run with identical pinned Wazuh build workflow; package provenance is verified against release pins
        type: string
        required: true
      dashboard_run_id:
        description: Successful qapaq-dashboard-azure.yml run on release_sha
        type: string
        required: true
      core_run_id:
        description: Successful qapaq-core-azure.yml run on release_sha
        type: string
        required: true
      edge_hostname:
        description: Optional public SOC hostname for the QAPAQ edge (TLS via Let's Encrypt); empty keeps the Wazuh dashboard on 443
        type: string
        required: false
        default: ""
      edge_extra_hostnames:
        description: Optional extra hostnames for the same certificate, space separated
        type: string
        required: false
        default: ""
      ankay_private_ip:
        description: Optional private IP of the Ankay host (e.g. 10.80.0.36) to publish /ankay/ and the Wazuh webhook
        type: string
        required: false
        default: ""

permissions:
  actions: read
  contents: read

concurrency:
  group: azure-siem-release-bundle-${{ inputs.release_sha }}
  cancel-in-progress: false

env:
  WAZUH_MANAGER_SHA: f470ad7db717b18db7feeed568949643698f0f34
  WAZUH_INDEXER_SHA: 9f4796b8738969ac50ea8b6d23cdea5ce1a8565a
  WAZUH_VERSION: 4.14.8
  OSD_COMPAT_VERSION: 2.19.6
  FILEBEAT_VERSION: 7.10.2-2
  FILEBEAT_SHA256: dc47340830b37007d18c86c779d480a4bfc86f2da43d4476a0b439d002f9e14b
  FILEBEAT_MODULE_SHA256: 7a8c67c47b22f89ab271b7e35f108f18b2215b7aa411cdd23c9994393070d38d
  WAZUH_SIGNING_KEY_SHA256: a378ca8dfa6b72122df288f64a0cde54f1cbfa3db9b43e6865cb73def35b5b17
  WAZUH_ASSISTANT_SHA: 33d2069715e8500b676d13cefe7ddaea8eb79019

jobs:
  assemble:
    name: Assemble pinned Wazuh and QAPAQ install candidate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout QAPAQ release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate immutable release commit
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Release SHA must be a full lowercase commit SHA.' >&2; exit 1; }
          git cat-file -e "$RELEASE_SHA^{commit}"
          git merge-base --is-ancestor "$RELEASE_SHA" "$GITHUB_SHA" || {
            echo 'Release SHA must already be merged into the current main branch.' >&2
            exit 1
          }
          git diff --quiet "$RELEASE_SHA" "$GITHUB_SHA" -- \
            wazuh/azure-release/assemble_release.py wazuh/azure-release/install.sh wazuh/azure-release/check-install-state.sh wazuh/azure-release/install_detection_rules.py \
            wazuh/azure-release/verify_wazuh_credentials_tar.py \
            wazuh/azure-release/normalize_ubuntu_apt_sources.py \
            wazuh/azure-release/configure_edge_azure.sh wazuh/azure-release/write_edge_config.py \
            wazuh/edge wazuh/indexer/security wazuh/scripts/indexer-admin.sh \
            infra/wazuh/shuffle/custom-qapaq-shuffle infra/wazuh/shuffle/ossec-shuffle-webhook.xml \
            infra/wazuh/shuffle/apply_ankay_webhook.py \
            wazuh/core wazuh/dashboard wazuh/office365 \
            wazuh/provider-ingestion ':!wazuh/provider-ingestion/tests/**' \
            infra/wazuh/endpoint/rules infra/wazuh/launch-detections/rules \
            infra/wazuh/finance infra/wazuh/priority infra/wazuh/agents docs/security/agents \
            infra/wazuh/active-directory/rules \
            infra/wazuh/active-directory/agent-groups infra/wazuh/active-directory/profile-catalog.json infra/wazuh/active-directory/README.md \
            infra/wazuh/launch-detections/agent-groups \
            infra/wazuh/teams \
            docs/security/launch-detection-catalog-2026-10-20.json \
            infra/azure/modules/siem_host/bootstrap-siem.py || {
              echo 'Package, installer, detection rules, or bootstrap sources changed after release_sha; rebuild the candidate on current main.' >&2
              exit 1
            }
          printf 'Release source: `%s` (ancestor of current main `%s`; package sources unchanged).\n' "$RELEASE_SHA" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Test bundle assembler and certificate archive gate
        run: |
          set -euo pipefail
          python3 -m unittest discover -s wazuh/azure-release/tests -p 'test_*.py' -v
          python3 -m unittest discover -s infra/wazuh/teams/tests -p 'test_*.py' -v
          python3 -m unittest discover -s wazuh/provider-ingestion/tests -p 'test_*.py' -v
          python3 -m py_compile wazuh/provider-ingestion/configure.py wazuh/provider-ingestion/cato/events_feed.py wazuh/provider-ingestion/sophos/upstream/*.py
          bash -n wazuh/azure-release/install.sh
          bash -n wazuh/azure-release/check-install-state.sh
          python3 -m py_compile wazuh/azure-release/assemble_release.py wazuh/azure-release/install_detection_rules.py wazuh/azure-release/verify_wazuh_credentials_tar.py
          python3 -m py_compile infra/wazuh/teams/apply_teams_workflow.py
          python3 -m unittest discover -s infra/wazuh/shuffle/tests -p 'test_*.py' -v
          python3 -m py_compile infra/wazuh/shuffle/apply_ankay_webhook.py wazuh/azure-release/write_edge_config.py
          bash -n wazuh/azure-release/configure_edge_azure.sh wazuh/edge/apply-edge.sh

      - name: Validate source workflow run IDs, branch and exact Git SHA
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          PREREQUISITES_RUN_ID: ${{ inputs.prerequisites_run_id }}
          DASHBOARD_RUN_ID: ${{ inputs.dashboard_run_id }}
          CORE_RUN_ID: ${{ inputs.core_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          validate_run() {
            local run_id="$1" workflow="$2" expected_sha="$3" metadata
            [[ "$run_id" =~ ^[0-9]{1,20}$ ]] || { echo 'Invalid source workflow run id.' >&2; return 1; }
            metadata="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
            jq -e --arg sha "$expected_sha" --arg workflow "$workflow" \
              '.head_sha == $sha and .head_branch == "main" and .status == "completed" and .conclusion == "success" and .path == $workflow' \
              <<<"$metadata" >/dev/null || {
                echo "Source run $run_id must be successful on the expected commit from main and use the expected workflow ($workflow)." >&2
                return 1
              }
          }
          validate_prerequisites_run() {
            local run_id="$1" metadata source_sha
            [[ "$run_id" =~ ^[0-9]{1,20}$ ]] || { echo 'Invalid prerequisites workflow run id.' >&2; return 1; }
            metadata="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
            jq -e \
              '.head_branch == "main" and .status == "completed" and .conclusion == "success" and .path == ".github/workflows/azure-siem-prerequisites-experimental.yml"' \
              <<<"$metadata" >/dev/null || {
                echo "Prerequisites run $run_id must be successful on main and use the expected workflow." >&2
                return 1
              }
            source_sha="$(jq -er '.head_sha' <<<"$metadata")"
            [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$source_sha^{commit}" || {
              echo 'Prerequisites run source commit is not present in the fetched main history.' >&2
              return 1
            }
            git merge-base --is-ancestor "$source_sha" "$RELEASE_SHA" || {
              echo 'Prerequisites run must come from an ancestor of release_sha.' >&2
              return 1
            }
            git diff --quiet "$source_sha" "$RELEASE_SHA" -- .github/workflows/azure-siem-prerequisites-experimental.yml || {
              echo 'Prerequisites build workflow changed between its source commit and release_sha; rebuild the pinned packages.' >&2
              return 1
            }
            printf 'Verified reusable Wazuh prerequisite run %s from %s; exact upstream package pins are checked below.\n' \
              "$run_id" "$source_sha" >> "$GITHUB_STEP_SUMMARY"
          }
          validate_prerequisites_run "$PREREQUISITES_RUN_ID"
          validate_run "$DASHBOARD_RUN_ID" '.github/workflows/qapaq-dashboard-azure.yml' "$RELEASE_SHA"
          validate_run "$CORE_RUN_ID" '.github/workflows/qapaq-core-azure.yml' "$RELEASE_SHA"

      - name: Download verified Manager, Indexer and Filebeat prerequisite artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: azure-siem-*-experimental
          path: ${{ runner.temp }}/prerequisites
          run-id: ${{ inputs.prerequisites_run_id }}
          github-token: ${{ github.token }}

      - name: Download QAPAQ dashboard package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: qapaq-dashboard-${{ inputs.release_sha }}
          path: ${{ runner.temp }}/dashboard
          run-id: ${{ inputs.dashboard_run_id }}
          github-token: ${{ github.token }}

      - name: Download QAPAQ core archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: qapaq-core-azure-${{ inputs.release_sha }}
          path: ${{ runner.temp }}/core
          run-id: ${{ inputs.core_run_id }}
          github-token: ${{ github.token }}

      - name: Verify artifact hashes and exact package revisions
        env:
          QAPAQ_SHA: ${{ inputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail
          manager="$RUNNER_TEMP/prerequisites/azure-siem-manager-4.14.8-experimental"
          indexer="$RUNNER_TEMP/prerequisites/azure-siem-indexer-4.14.8-experimental"
          filebeat="$RUNNER_TEMP/prerequisites/azure-siem-filebeat-7.10.2-2-experimental"
          (cd "$manager" && sha256sum --check SHA256SUMS)
          (cd "$indexer" && sha256sum --check SHA256SUMS)
          (cd "$filebeat" && sha256sum --check SHA256SUMS)
          manager_pkg="$(find "$manager" -maxdepth 1 -name 'wazuh-manager_*.deb' -print -quit)"
          indexer_pkg="$(find "$indexer" -maxdepth 1 -name 'wazuh-indexer_*.deb' -print -quit)"
          filebeat_pkg="$(find "$filebeat" -maxdepth 1 -name 'filebeat_*.deb' -print -quit)"
          filebeat_module="$filebeat/wazuh-filebeat-0.5.tar.gz"
          filebeat_template="$filebeat/wazuh-template.json"
          [[ "$(sha256sum "$manager_pkg" | cut -d' ' -f1)" == "$(jq -er '.sha256' "$manager/provenance.json")" ]]
          [[ "$(sha256sum "$indexer_pkg" | cut -d' ' -f1)" == "$(jq -er '.sha256' "$indexer/provenance.json")" ]]
          [[ "$(sha256sum "$filebeat_pkg" | cut -d' ' -f1)" == "$FILEBEAT_SHA256" ]]
          [[ "$(sha256sum "$filebeat_module" | cut -d' ' -f1)" == "$FILEBEAT_MODULE_SHA256" ]]
          [[ "$(sha256sum "$filebeat_template" | cut -d' ' -f1)" == "$(jq -er '.templateSha256' "$filebeat/provenance.json")" ]]
          jq -e --arg sha "$WAZUH_MANAGER_SHA" --arg actual "$(sha256sum "$manager_pkg" | cut -d' ' -f1)" '.status == "experimental" and .sourceCommit == $sha and .debVersion == "4.14.8-1" and .sha256 == $actual' "$manager/provenance.json" >/dev/null
          jq -e --arg sha "$WAZUH_INDEXER_SHA" --arg osd "$OSD_COMPAT_VERSION" --arg actual "$(sha256sum "$indexer_pkg" | cut -d' ' -f1)" '.status == "experimental" and .sourceCommit == $sha and .debVersion == "4.14.8-1" and .openSearchDashboardsCompatibility == $osd and .sha256 == $actual' "$indexer/provenance.json" >/dev/null
          jq -e --arg version "$FILEBEAT_VERSION" --arg sha "$FILEBEAT_SHA256" --arg module "$FILEBEAT_MODULE_SHA256" '.status == "experimental" and .packageVersion == $version and .packageSha256 == $sha and .moduleSha256 == $module and .aptMetadataSignatureVerified == true and .templateSourceCommit == env.WAZUH_MANAGER_SHA' "$filebeat/provenance.json" >/dev/null
          (cd "$RUNNER_TEMP/dashboard" && sha256sum -c SHA256SUMS)
          grep -Fxq "commit=$QAPAQ_SHA" "$RUNNER_TEMP/dashboard/package-metadata.txt"
          dashboard_pkg="$(find "$RUNNER_TEMP/dashboard" -maxdepth 1 -name '*.deb' -print -quit)"
          [[ "$(sha256sum "$dashboard_pkg" | cut -d' ' -f1)" == "$(awk -F= '$1 == "sha256" {print $2}' "$RUNNER_TEMP/dashboard/package-metadata.txt")" ]]
          (cd "$RUNNER_TEMP/core" && sha256sum -c SHA256SUMS)
          core_release="$(find "$RUNNER_TEMP/core" -maxdepth 1 -type f -name 'qapaq-core-*.tar.gz' -print -quit)"
          [[ -n "$core_release" ]]
          core_top="$(tar -tzf "$core_release" | sed -n '1s,/.*,,p')"
          [[ "$core_top" == "qapaq-core-${QAPAQ_SHA:0:12}" ]]

      - name: Checkout the official Wazuh installation assistant at a verified immutable commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: wazuh/wazuh-installation-assistant
          ref: ${{ env.WAZUH_ASSISTANT_SHA }}
          path: upstream/wazuh-installation-assistant
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm Wazuh pins match the selected release source
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail
          diff -u \
            <(git show "$RELEASE_SHA:.github/workflows/azure-siem-release-bundle.yml" | grep -E '^  (WAZUH_|OSD_|FILEBEAT_)') \
            <(grep -E '^  (WAZUH_|OSD_|FILEBEAT_)' "$GITHUB_WORKSPACE/.github/workflows/azure-siem-release-bundle.yml")

      - name: Verify official assistant tag and build identity
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: upstream/wazuh-installation-assistant
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$WAZUH_ASSISTANT_SHA" ]]
          git cat-file -e "$WAZUH_ASSISTANT_SHA^{commit}"
          git describe --tags --exact-match | grep -Fxq v4.14.8
          gh api "repos/wazuh/wazuh-installation-assistant/commits/$WAZUH_ASSISTANT_SHA" \
            | jq -e --arg sha "$WAZUH_ASSISTANT_SHA" '.sha == $sha and .commit.verification.verified == true' >/dev/null
          bash builder.sh -i

      - name: Fetch and verify the Wazuh signing key for offline apt
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://packages.wazuh.com/key/GPG-KEY-WAZUH --output "$RUNNER_TEMP/GPG-KEY-WAZUH"
          echo "$WAZUH_SIGNING_KEY_SHA256  $RUNNER_TEMP/GPG-KEY-WAZUH" | sha256sum --check --status

      - name: Assemble offline Wazuh QAPAQ bundle and verify bootstrap contract
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          EDGE_HOSTNAME: ${{ inputs.edge_hostname }}
          EDGE_EXTRA_HOSTNAMES: ${{ inputs.edge_extra_hostnames }}
          ANKAY_PRIVATE_IP: ${{ inputs.ankay_private_ip }}
        shell: bash
        run: |
          set -euo pipefail
          manager="$(find "$RUNNER_TEMP/prerequisites/azure-siem-manager-4.14.8-experimental" -maxdepth 1 -name 'wazuh-manager_*.deb' -print -quit)"
          indexer="$(find "$RUNNER_TEMP/prerequisites/azure-siem-indexer-4.14.8-experimental" -maxdepth 1 -name 'wazuh-indexer_*.deb' -print -quit)"
          filebeat="$(find "$RUNNER_TEMP/prerequisites/azure-siem-filebeat-7.10.2-2-experimental" -maxdepth 1 -name 'filebeat_*.deb' -print -quit)"
          dashboard="$(find "$RUNNER_TEMP/dashboard" -maxdepth 1 -name '*.deb' -print -quit)"
          core="$(find "$RUNNER_TEMP/core" -maxdepth 1 -type f -name 'qapaq-core-*.tar.gz' -print -quit)"
          module="$(find "$RUNNER_TEMP/prerequisites/azure-siem-filebeat-7.10.2-2-experimental" -maxdepth 1 -name 'wazuh-filebeat-0.5.tar.gz' -print -quit)"
          template="$(find "$RUNNER_TEMP/prerequisites/azure-siem-filebeat-7.10.2-2-experimental" -maxdepth 1 -name 'wazuh-template.json' -print -quit)"
          edge_args=()
          if [[ -n "$EDGE_HOSTNAME" ]]; then
            python3 wazuh/azure-release/write_edge_config.py --output "$RUNNER_TEMP/edge.json"
            edge_args=(--edge-config "$RUNNER_TEMP/edge.json")
          fi
          python3 wazuh/azure-release/assemble_release.py \
            --manager-deb "$manager" --indexer-deb "$indexer" --filebeat-deb "$filebeat" \
            --dashboard-deb "$dashboard" --core-archive "$core" \
            --assistant-dir "$GITHUB_WORKSPACE/upstream/wazuh-installation-assistant" \
            --filebeat-config "$GITHUB_WORKSPACE/upstream/wazuh-installation-assistant/config/filebeat/filebeat.yml" \
            --wazuh-signing-key "$RUNNER_TEMP/GPG-KEY-WAZUH" \
            --filebeat-module "$module" --filebeat-template "$template" \
            --install-script "$GITHUB_WORKSPACE/wazuh/azure-release/install.sh" \
            --verify-credentials-script "$GITHUB_WORKSPACE/wazuh/azure-release/verify_wazuh_credentials_tar.py" \
            --repo-root "$GITHUB_WORKSPACE" \
            --output-dir "$RUNNER_TEMP/siem-release" --qapaq-commit "$RELEASE_SHA" \
            --manager-commit "$WAZUH_MANAGER_SHA" --indexer-commit "$WAZUH_INDEXER_SHA" "${edge_args[@]}"
          bundle="$(find "$RUNNER_TEMP/siem-release" -maxdepth 1 -name 'qapaq-siem-*.tar.gz' -print -quit)"
          python3 - "$GITHUB_WORKSPACE/infra/azure/modules/siem_host/bootstrap-siem.py" "$bundle" "$RELEASE_SHA" <<'PY'
          import hashlib, json, pathlib, sys, tarfile, tempfile
          import os
          bootstrap = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
          assert '"managerDeb", "indexerDeb", "filebeatDeb", "qapaqDashboardDeb", "qapaqCoreArchive"' in bootstrap
          with tarfile.open(sys.argv[2], "r:gz") as archive:
              roots = {p.parts[0] for p in (pathlib.PurePosixPath(n) for n in archive.getnames()) if p.parts}
              assert len(roots) == 1
              manifest_name = next(n for n in archive.getnames() if n.endswith("/manifest.json"))
              root = manifest_name.rsplit("/", 1)[0]
              manifest = json.load(archive.extractfile(manifest_name))
              assert manifest["status"] == "installable-candidate"
              assert manifest["qapaqCommit"] == sys.argv[3]
              assert manifest["qapaqAssistant"]["name"] == "Qapaqzito"
              assert manifest["qapaqAssistant"]["status"] == "bundled-with-dashboard-and-core"
              assert manifest["qapaqAssistant"]["provider"] == "anthropic"
              assert manifest["qapaqAssistant"]["activation"] == "assistant_secret_name-and-api-egress-required"
              assert manifest["qapaqAssistant"]["secretValueBundled"] is False
              for edge_file in (
                  "wazuh/azure-release/configure_edge_azure.sh",
                  "wazuh/edge/apply-edge.sh",
                  "wazuh/edge/qapaq-edge.conf",
                  "wazuh/indexer/security/apply-security.sh",
                  "wazuh/dashboard/opensearch_dashboards.qapaq.yml",
              ):
                  assert edge_file in manifest["files"]
              if os.environ["EDGE_HOSTNAME"]:
                  edge_name = f"{root}/edge.json"
                  assert edge_name in archive.getnames()
                  edge = json.load(archive.extractfile(edge_name))
                  assert edge["hostname"] == os.environ["EDGE_HOSTNAME"]
                  if os.environ["ANKAY_PRIVATE_IP"]:
                      assert edge["ankayUpstream"] == f"{os.environ['ANKAY_PRIVATE_IP']}:3001"
                  else:
                      assert "ankayUpstream" not in edge and "ankayWebhookUrl" not in edge
              else:
                  assert f"{root}/edge.json" not in archive.getnames()
              assert manifest["detectionPack"]["activation"] == "baseline-rules-installed-context-packs-require-live-cdb-lists-and-review"
              assert set(manifest["detectionPack"]["rules"]) == {
                  "wazuh/launch-detections/rules/qapaq_launch_provider_rules.xml",
                  "wazuh/endpoint/rules/qapaq_endpoint_rules.xml",
                  "wazuh/active-directory/rules/qapaq_active_directory_rules.xml",
                  "wazuh/finance/rules/qapaq_finance_rules.xml",
                  "wazuh/priority/rules/qapaq_priority_rules.xml",
              }
              assert set(manifest["detectionPack"]["installedByDefault"]) == {
                  "wazuh/launch-detections/rules/qapaq_launch_provider_rules.xml",
                  "wazuh/endpoint/rules/qapaq_endpoint_rules.xml",
                  "wazuh/active-directory/rules/qapaq_active_directory_rules.xml",
              }
              for pack_name in ("finance", "priority"):
                  pack = manifest["detectionPack"]["candidatePacks"][pack_name]
                  assert pack["status"] == "candidate-disabled"
                  assert pack["requiresProductionContextLists"] is True
                  assert pack["evidence"] == "synthetic-logtest-only"
                  assert all(path in manifest["files"] for path in pack["contextLists"])
              assert "wazuh/launch-detections/catalog.json" in manifest["files"]
              assert "wazuh/launch-detections/install_detection_rules.py" in manifest["files"]
              assert manifest["agentProfilePack"]["status"] == "candidate-disabled"
              assert manifest["agentProfilePack"]["activation"] == "owner-approval-and-domain-controller-pilot-required"
              assert manifest["agentProfilePack"]["installerAppliesAgentProfiles"] is False
              assert set(manifest["agentProfilePack"]["profiles"]) == {
                  "wazuh/agent-profiles/windows-domain-controller.agent.conf",
                  "wazuh/agent-profiles/windows-pilot.agent.conf",
                  "wazuh/agent-profiles/windows-sysmon-pilot.agent.conf",
              }
              assert "wazuh/agent-profiles/active-directory/profile-catalog.json" in manifest["files"]
              assert "wazuh/agent-profiles/active-directory/README.md" in manifest["files"]
              agent_pack = manifest["agentDeploymentPack"]
              assert agent_pack["status"] == "candidate-pilot-required"
              assert agent_pack["activation"] == "owner-approval-pilot-per-profile"
              assert agent_pack["installerAppliesAgentProfiles"] is False
              assert agent_pack["requiresPrivacyReviewForCommandLines"] is True
              assert "wazuh/agent-deployment/profile-catalog.json" in manifest["files"]
              assert "wazuh/agent-deployment/deploy/windows/Install-QapaqWazuhAgent.ps1" in manifest["files"]
              assert "wazuh/agent-deployment/docs/README.md" in manifest["files"]
              assert "wazuh/priority/apply-priority.sh" in manifest["files"]
              installer = archive.extractfile(f"{root}/install.sh").read().decode()
              assert "install_detection_rules.py" in installer
              assert "agent-profiles" not in installer
              assert "agent-deployment" not in installer
              for name, digest in manifest["files"].items():
                  member = archive.extractfile(f"{root}/{name}")
                  assert hashlib.sha256(member.read()).hexdigest() == digest, name
          PY

      - name: Upload reviewable candidate bundle; no cloud publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qapaq-siem-installable-candidate-${{ inputs.release_sha }}
          path: ${{ runner.temp }}/siem-release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Summarize runtime gates
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          {
            echo '## Azure QAPAQ SIEM release candidate'
            printf '%s\n' "- QAPAQ source commit: \`$RELEASE_SHA\` (all source artifacts are validated against this commit)."
            echo '- Produces the exact Blob bundle contract consumed by `siem_host`.'
            echo '- Installs pinned official Wazuh Manager, Indexer, Filebeat, QAPAQ Dashboard and QAPAQ core from offline artifacts.'
            echo '- Installs the versioned QAPAQ AD, endpoint and provider detection rules by default.'
            echo '- Bundles finance and priority rules plus example CDB files as `candidate-disabled`; they require real owner-approved lists and tenant observation before activation.'
            echo '- Bundles Windows/Linux agent installers and profiles as `candidate-pilot-required`; the installer never enrolls agents or applies profiles.'
            echo '- When `edge_hostname` is set, installs the public HTTPS QAPAQ edge and routes `/api/assistant` to the private Core API; first-run TLS requires reachable HTTP-01 on TCP/80. This workflow does not change firewall rules.'
            echo '- The Ankay upstream and webhook are included only when `ankay_private_ip` is supplied; leave it empty for the SIEM-first release.'
            echo '- No Azure login, Key Vault read, Blob publication, Terraform apply, DNS change or deployment occurs in this workflow.'
            echo '- First boot still requires the one-line base64 `wazuh-install-files.tar.b64` Key Vault secret, all QAPAQ core secret refs, private network and firewall allowlist.'
            echo '- The bundle contains optional Sophos Central and Cato eventsFeed collectors in the Wazuh overlay. They remain inactive unless Key Vault references, tenant/account configuration and explicit egress are supplied; CI packaging is not tenant acceptance.'
          } >> "$GITHUB_STEP_SUMMARY"
