name: Ankay Azure host IaC validation

on:
  pull_request:
    paths:
      - "infra/azure/modules/ankay_host/**"
      - "infra/azure/ankay-runtime/**"
      - ".github/workflows/ankay-azure-iac.yml"
  push:
    branches: [main]
    paths:
      - "infra/azure/modules/ankay_host/**"
      - "infra/azure/ankay-runtime/**"
      - ".github/workflows/ankay-azure-iac.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate isolated Ankay host module (no Azure credentials)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false

      - name: Test fail-closed disk bootstrap
        run: python3 infra/azure/modules/ankay_host/test_prepare_data_disk.py

      - name: Test Key Vault secret materialization and validate runtime scripts
        run: |
          set -euo pipefail
          python3 -m unittest infra.azure.modules.ankay_host.test_fetch_runtime_secrets -v
          python3 -m py_compile infra/azure/modules/ankay_host/fetch-runtime-secrets.py
          bash -n infra/azure/modules/ankay_host/install-runtime.sh.tftpl
          bash -n infra/azure/modules/ankay_host/registry-login.sh.tftpl
          bash -n infra/azure/modules/ankay_host/start-compose.sh.tftpl
          python3 -m py_compile infra/azure/modules/ankay_host/prepare-opensearch-tls.py

      - name: Generate the OpenSearch PKI with real openssl and check permissions
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          sudo ANKAY_DATA_ROOT="$root" python3 infra/azure/modules/ankay_host/prepare-opensearch-tls.py
          sudo ANKAY_DATA_ROOT="$root" python3 infra/azure/modules/ankay_host/prepare-opensearch-tls.py
          sudo openssl verify -CAfile "$root/opensearch-tls/ca/ca.pem" "$root/opensearch-tls/node/node.pem"
          sudo openssl x509 -in "$root/opensearch-tls/node/node.pem" -noout -ext subjectAltName | grep -F 'DNS:opensearch'
          sudo openssl pkey -in "$root/opensearch-tls/node/node-key.pem" -noout
          [[ "$(sudo stat -c '%u %a' "$root/opensearch-tls/node/node-key.pem")" == '1000 400' ]]
          [[ "$(sudo stat -c '%u %a' "$root/opensearch-tls/private/ca-key.pem")" == '0 400' ]]
          [[ "$(sudo stat -c '%u' "$root/files")" == 10001 ]]
          sudo rm -rf "$root"

      - name: Test the Compose renderer and validate the rendered Compose
        run: |
          set -euo pipefail
          python3 infra/azure/ankay-runtime/tests/test_render_ankay_host.py
          env_file="$(mktemp)"
          for name in ANKAY_ENCRYPTION_MODIFIER ANKAY_OPENSEARCH_PASSWORD ANKAY_ADMIN_PASSWORD ANKAY_ADMIN_API_KEY; do
            printf '%s=synthetic-%s\n' "$name" "$name" >> "$env_file"
          done
          docker compose --project-name ankay --env-file "$env_file" \
            --file infra/azure/modules/ankay_host/tests/fixtures/compose.yaml config --quiet
          rm -f "$env_file"

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra/azure/modules/ankay_host

      - name: Initialize the isolated module without a backend
        run: terraform -chdir=infra/azure/modules/ankay_host init -backend=false -input=false -no-color

      - name: Validate Terraform syntax and provider schema
        run: terraform -chdir=infra/azure/modules/ankay_host validate -no-color

      - name: Run the module contract tests (mock provider, no Azure)
        run: terraform -chdir=infra/azure/modules/ankay_host test -no-color
