name: Ankay Qapaq to Azure ACR

on:
  pull_request:
    paths:
      - "ankay/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/ankay-azure.yml"
  push:
    branches: [main]
    paths:
      - "ankay/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/ankay-azure.yml"
  workflow_dispatch:
    inputs:
      publish_to_acr:
        description: Publish the verified Ankay frontend image from main to Azure ACR
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: ankay-azure-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify Ankay without cloud credentials
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0

      - name: Enable the package manager pinned by package.json
        run: corepack enable

      - name: Install the root codemod dependency
        run: pnpm install --frozen-lockfile --filter qapaq-secops

      - name: Test the brand codemod
        run: node --test ankay/frontend/rebrand.test.mjs

      - name: Build from the pinned Shuffle source and verify its image
        shell: bash
        run: |
          set -euo pipefail
          image="ankay-qapaq-frontend:${GITHUB_SHA}"
          bash ankay/build.sh "$RUNNER_TEMP/ankay-build" "$image"
          docker image inspect "$image" >/dev/null
          mapfile -t sources < <(find "$RUNNER_TEMP/ankay-build" -maxdepth 1 -type f -name 'ankay-qapaq-frontend-source-*.tar.gz' -print)
          [[ "${#sources[@]}" == 1 ]] || { echo 'Falta el paquete de fuente AGPL de Ankay.' >&2; exit 1; }
          tar -tzf "${sources[0]}" | grep -Fxq 'LICENSE'
          mkdir -p "$RUNNER_TEMP/ankay-publish"
          docker save "$image" | gzip -1 > "$RUNNER_TEMP/ankay-publish/image.tar.gz"
          image_sha256="$(sha256sum "$RUNNER_TEMP/ankay-publish/image.tar.gz" | awk '{print $1}')"
          source_sha256="$(sha256sum "${sources[0]}" | awk '{print $1}')"
          printf 'commit=%s\nimage=%s\nimage_sha256=%s\nsource_sha256=%s\n' \
            "$GITHUB_SHA" "$image" "$image_sha256" "$source_sha256" \
            > "$RUNNER_TEMP/ankay-publish/metadata.txt"
          cp "${sources[0]}" "$RUNNER_TEMP/ankay-publish/"
          (cd "$RUNNER_TEMP/ankay-publish" && sha256sum image.tar.gz *.tar.gz > SHA256SUMS)

      - name: Upload the run-scoped, checksummed build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ankay-${{ github.sha }}
          path: ${{ runner.temp }}/ankay-publish/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    name: Publish verified Ankay image (manual, main only)
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.publish_to_acr == true &&
      github.ref == 'refs/heads/main'
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: azure-demo
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download this run's build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ankay-${{ github.sha }}
          path: ${{ runner.temp }}/ankay-publish

      - name: Validate publication target and artifact before cloud authentication
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
          ACR_LOGIN_SERVER: ${{ vars.AZURE_ACR_LOGIN_SERVER }}
        working-directory: ${{ runner.temp }}/ankay-publish
        shell: bash
        run: |
          set -euo pipefail
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID ACR_NAME ACR_LOGIN_SERVER; do
            [[ -n "${!name}" ]] || { echo "Falta la variable de entorno GitHub $name" >&2; exit 1; }
          done
          [[ "$ACR_NAME" =~ ^[a-z0-9]{5,50}$ ]]
          [[ "$ACR_LOGIN_SERVER" == "${ACR_NAME}.azurecr.io" ]]
          sha256sum -c SHA256SUMS
          grep -Fxq "commit=${GITHUB_SHA}" metadata.txt
          grep -Fxq "image=ankay-qapaq-frontend:${GITHUB_SHA}" metadata.txt

      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Publish the verified image and record its registry digest
        env:
          ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
          ACR_LOGIN_SERVER: ${{ vars.AZURE_ACR_LOGIN_SERVER }}
        working-directory: ${{ runner.temp }}/ankay-publish
        shell: bash
        run: |
          set -euo pipefail
          docker load --input image.tar.gz
          image="ankay-qapaq-frontend:${GITHUB_SHA}"
          target="${ACR_LOGIN_SERVER}/ankay-qapaq-frontend:git-${GITHUB_SHA}"
          docker tag "$image" "$target"
          access_token="$(az acr login --name "$ACR_NAME" --expose-token --output tsv --query accessToken)"
          [[ -n "$access_token" ]] || { echo 'Azure no entregó un token temporal para ACR.' >&2; exit 1; }
          printf '%s' "$access_token" | docker login "$ACR_LOGIN_SERVER" \
            --username 00000000-0000-0000-0000-000000000000 --password-stdin
          unset access_token
          docker push "$target"
          manifest_digest="$(az acr manifest show-metadata --registry "$ACR_NAME" \
            --name "ankay-qapaq-frontend:git-${GITHUB_SHA}" --query digest --output tsv)"
          [[ "$manifest_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo 'ACR no devolvió un digest OCI válido.' >&2; exit 1; }
          printf '### Ankay Qapaq publicado en ACR\n\n- Commit: `%s`\n- Imagen: `%s/ankay-qapaq-frontend@%s`\n' \
            "$GITHUB_SHA" "$ACR_LOGIN_SERVER" "$manifest_digest" >> "$GITHUB_STEP_SUMMARY"
