name: Publish Ankay Qapaq runtime to Azure EUS2 ACR

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful Ankay build run on main
        type: string
        required: true
      source_sha:
        description: Exact 40-character QAPAQ commit recorded in the Ankay artifacts
        type: string
        required: true

permissions:
  actions: read
  contents: read

concurrency:
  group: ankay-azure-eus2-publish
  cancel-in-progress: false

env:
  ACR_EXPECTED: qapaqsecopsdemoeus3a2405f3.azurecr.io
  STORAGE_ACCOUNT: qapaqdemoeus2rel3a2405f3
  CONTAINER: siem-release

jobs:
  review:
    name: Verify Ankay artifacts and summarize exact EUS2 writes
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    outputs:
      plan_sha256: ${{ steps.plan.outputs.plan_sha256 }}
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Validate successful source run and retained artifacts
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]{1,20}$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")"
          jq -e --arg sha "$SOURCE_SHA" \
            '.head_branch == "main" and .head_sha == $sha and .status == "completed" and .conclusion == "success" and .path == ".github/workflows/ankay-azure.yml"' \
            <<<"$run_json" >/dev/null || {
              echo '::error::Source must be a successful Ankay build on main for the requested commit.'
              exit 1
            }
          artifacts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts")"
          for name in "ankay-$SOURCE_SHA" "ankay-runtime-components-$SOURCE_SHA"; do
            jq -e --arg name "$name" \
              '.artifacts[] | select(.name == $name and .expired == false and .size_in_bytes > 0)' \
              <<<"$artifacts" >/dev/null || {
                echo "::error::Expected unexpired artifact $name is missing."
                exit 1
              }
          done

      - name: Check out the reviewed main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download the frontend artifact without Azure credentials
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ankay-${{ inputs.source_sha }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/ankay-publish/frontend

      - name: Download the runtime artifact without Azure credentials
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ankay-runtime-components-${{ inputs.source_sha }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/ankay-publish/runtime

      - name: Build and summarize the exact publication plan
        id: plan
        working-directory: ${{ runner.temp }}/ankay-publish
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/.github/ci/ankay-publication-plan.py" \
            --frontend frontend --runtime runtime --source-sha "$SOURCE_SHA" \
            --acr "$ACR_EXPECTED" --storage-account "$STORAGE_ACCOUNT" --container "$CONTAINER" \
            --output plan.json --summary "$GITHUB_STEP_SUMMARY"
          echo "plan_sha256=$(sha256sum plan.json | awk '{print $1}')" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish reviewed Ankay images and AGPL sources to EUS2
    if: github.ref == 'refs/heads/main'
    needs: [review]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: azure-demo-eus2
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      PLAN_SHA256: ${{ needs.review.outputs.plan_sha256 }}
      ACR_LOGIN_SERVER: ${{ vars.AZURE_EUS2_ACR_LOGIN_SERVER }}
    steps:
      - name: Check out the reviewed main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Re-validate EUS2 target identifiers
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_EUS2_GITHUB_PUBLISHER_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_EUS2_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_EUS2_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID ACR_LOGIN_SERVER PLAN_SHA256; do
            [[ -n "${!name}" ]] || { echo "::error::Missing reviewed EUS2 publishing value: $name"; exit 1; }
          done
          [[ "$ACR_LOGIN_SERVER" == "$ACR_EXPECTED" ]]
          [[ "$AZURE_SUBSCRIPTION_ID" == aaf787f8-5964-4470-9eb6-89d15eacda61 ]]

      - name: Download the frontend artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ankay-${{ inputs.source_sha }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/ankay-publish/frontend

      - name: Download the runtime artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ankay-runtime-components-${{ inputs.source_sha }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/ankay-publish/runtime

      - name: Recompute the plan and require it to match the reviewed one
        working-directory: ${{ runner.temp }}/ankay-publish
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/.github/ci/ankay-publication-plan.py" \
            --frontend frontend --runtime runtime --source-sha "$SOURCE_SHA" \
            --acr "$ACR_EXPECTED" --storage-account "$STORAGE_ACCOUNT" --container "$CONTAINER" \
            --output plan.json
          [[ "$(sha256sum plan.json | awk '{print $1}')" == "$PLAN_SHA256" ]] || {
            echo '::error::Artifacts changed after review; refusing to publish.'; exit 1;
          }

      - name: Sign in with the EUS2 publisher identity
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_EUS2_GITHUB_PUBLISHER_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_EUS2_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_EUS2_SUBSCRIPTION_ID }}

      - name: Publish only new immutable ACR tags and source blobs
        working-directory: ${{ runner.temp }}/ankay-publish
        shell: bash
        run: |
          set -euo pipefail
          registry="${ACR_LOGIN_SERVER%.azurecr.io}"
          # Refuse before writing anything if any target already exists.
          while read -r repository tag; do
            exists="$(az acr repository show --name "$registry" --image "$repository:$tag" --query name --output tsv 2>/dev/null || true)"
            [[ -z "$exists" ]] || { echo "::error::$repository:$tag already exists; refusing to overwrite."; exit 1; }
          done < <(jq -r '.images[] | "\(.repository) \(.tag)"' plan.json)
          while read -r blob; do
            exists="$(az storage blob exists --auth-mode login --account-name "$STORAGE_ACCOUNT" \
              --container-name "$CONTAINER" --name "$blob" --query exists --output tsv)"
            [[ "$exists" == false ]] || { echo "::error::Source blob $blob already exists; refusing to overwrite."; exit 1; }
          done < <(jq -r '.sources[].blob' plan.json)

          access_token="$(az acr login --name "$registry" --expose-token --output tsv --query accessToken)"
          [[ -n "$access_token" ]] || { echo 'Azure no entregó un token temporal para ACR.'; exit 1; }
          printf '%s' "$access_token" | docker login "$ACR_LOGIN_SERVER" \
            --username 00000000-0000-0000-0000-000000000000 --password-stdin
          unset access_token

          published='[]'
          while read -r key archive local repository tag; do
            docker load --input "$archive" >/dev/null
            docker image inspect "$local" >/dev/null
            docker tag "$local" "$ACR_LOGIN_SERVER/$repository:$tag"
            docker push "$ACR_LOGIN_SERVER/$repository:$tag" >/dev/null
            digest="$(az acr manifest show-metadata --registry "$registry" --name "$repository:$tag" --query digest --output tsv)"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            published="$(jq --arg k "$key" --arg ref "$ACR_LOGIN_SERVER/$repository@$digest" --arg tag "$tag" \
              '. + [{key:$k, image:$ref, tag:$tag}]' <<<"$published")"
          done < <(jq -r '.images[] | "\(.key) \(.archive) \(.localImage) \(.repository) \(.tag)"' plan.json)

          while read -r file blob sha; do
            az storage blob upload --auth-mode login --account-name "$STORAGE_ACCOUNT" \
              --container-name "$CONTAINER" --name "$blob" --file "$file" \
              --overwrite false --max-connections 4 --no-progress \
              --metadata "sha256=$sha" "source_sha=$SOURCE_SHA" \
              --content-type application/gzip --output none
            stored="$(az storage blob show --auth-mode login --account-name "$STORAGE_ACCOUNT" \
              --container-name "$CONTAINER" --name "$blob" --query metadata.sha256 --output tsv)"
            [[ "$stored" == "$sha" ]]
          done < <(jq -r '.sources[] | "\(.file) \(.blob) \(.sha256)"' plan.json)

          jq -n --arg sha "$SOURCE_SHA" --argjson images "$published" \
            '{schemaVersion:1, sourceSha:$sha, images:$images,
              container_images:([$images[] | select(.key != "app-qapaq-ankay") | {(.key):.image}] | add),
              app_images:{"ankay/apps:qapaq-ankay_1.0.0":([$images[] | select(.key == "app-qapaq-ankay") | .image][0])}}' \
            > published-images.json
          {
            echo '### Ankay publicado en EUS2'
            echo
            echo "- Commit: \`$SOURCE_SHA\`"
            echo '- Digests (para `ankay/deploy/render-ankay-host.py --published`):'
            echo
            echo '```json'
            cat published-images.json
            echo '```'
            echo '- No crea ni cambia recursos, red, Key Vault, Terraform ni cómputo.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the digest manifest (no secrets)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ankay-eus2-published-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/ankay-publish/published-images.json
          if-no-files-found: error
          retention-days: 90
