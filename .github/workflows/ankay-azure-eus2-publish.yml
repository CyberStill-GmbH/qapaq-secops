name: Publish Ankay Qapaq frontend to Azure EUS2 ACR

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful Ankay build run on main
        type: string
        required: true
      source_sha:
        description: Exact 40-character QAPAQ commit recorded in the Ankay artifact
        type: string
        required: true

permissions:
  actions: read
  contents: read

concurrency:
  group: ankay-azure-eus2-publish
  cancel-in-progress: false

jobs:
  review:
    name: Verify frontend artifact and summarize exact EUS2 writes
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      image_sha256: ${{ steps.inspect.outputs.image_sha256 }}
      image_size: ${{ steps.inspect.outputs.image_size }}
      source_sha256: ${{ steps.inspect.outputs.source_sha256 }}
      source_size: ${{ steps.inspect.outputs.source_size }}
      image_tag: ${{ steps.inspect.outputs.image_tag }}
      source_blob_name: ${{ steps.inspect.outputs.source_blob_name }}
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Validate successful source run and retained artifact
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]{1,20}$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")"
          jq -e --arg sha "$SOURCE_SHA" \
            '.head_branch == "main" and .head_sha == $sha and .status == "completed" and .conclusion == "success" and .path == ".github/workflows/ankay-azure.yml"' \
            <<<"$run_json" >/dev/null || {
              echo '::error::Source must be a successful Ankay build on main for the requested commit.'
              exit 1
            }
          artifact_name="ankay-$SOURCE_SHA"
          artifacts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts")"
          jq -e --arg name "$artifact_name" \
            '.artifacts[] | select(.name == $name and .expired == false and .size_in_bytes > 0)' \
            <<<"$artifacts" >/dev/null || {
              echo '::error::Expected unexpired Ankay build artifact is missing.'
              exit 1
            }

      - name: Download and verify the artifact without Azure credentials
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ankay-${{ inputs.source_sha }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/ankay-publish

      - name: Summarize exact ACR tag and AGPL source Blob
        id: inspect
        working-directory: ${{ runner.temp }}/ankay-publish
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check --strict SHA256SUMS
          grep -Fxq "commit=$SOURCE_SHA" metadata.txt
          grep -Fxq "image=ankay-qapaq-frontend:$SOURCE_SHA" metadata.txt
          image_tar=image.tar.gz
          source_tar="$(find . -maxdepth 1 -type f -name 'ankay-qapaq-frontend-source-*.tar.gz' -print -quit)"
          [[ -f "$image_tar" && -n "$source_tar" ]]
          image_sha="$(sha256sum "$image_tar" | awk '{print $1}')"
          source_sha="$(sha256sum "$source_tar" | awk '{print $1}')"
          image_size="$(stat -c '%s' "$image_tar")"
          source_size="$(stat -c '%s' "$source_tar")"
          [[ "$image_sha" == "$(sed -n 's/^image_sha256=//p' metadata.txt)" ]]
          [[ "$source_sha" == "$(sed -n 's/^source_sha256=//p' metadata.txt)" ]]
          [[ "$image_sha" =~ ^[0-9a-f]{64}$ && "$source_sha" =~ ^[0-9a-f]{64}$ ]]
          image_tag="git-${SOURCE_SHA}-sha256-${image_sha}"
          source_name="$(basename "$source_tar")"
          source_blob_name="ankay-source/$SOURCE_SHA/$source_name"
          printf 'image_sha256=%s\nimage_size=%s\nsource_sha256=%s\nsource_size=%s\nimage_tag=%s\nsource_blob_name=%s\n' \
            "$image_sha" "$image_size" "$source_sha" "$source_size" "$image_tag" "$source_blob_name" >> "$GITHUB_OUTPUT"
          {
            echo '## Revisión de publicación Ankay EUS2'
            echo
            echo "- Fuente: [run ${{ inputs.source_run_id }}](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${{ inputs.source_run_id }})"
            echo "- Commit QAPAQ: \`$SOURCE_SHA\`"
            echo "- ACR: \`qapaqsecopsdemoeus3a2405f3.azurecr.io/ankay-qapaq-frontend:$image_tag\` ($image_size bytes comprimidos; SHA-256 \`$image_sha\`)"
            echo "- Código fuente AGPL: \`https://qapaqdemoeus2rel3a2405f3.blob.core.windows.net/siem-release/$source_blob_name\` ($source_size bytes; SHA-256 \`$source_sha\`)"
            echo '- Efecto máximo: crear un tag nuevo en el ACR existente y un blob privado de fuentes; los dos destinos se rechazan si ya existen.'
            echo '- No crea ni cambia recursos, permisos, red, Key Vault, Terraform, DNS o cómputo.'
            echo '- El ACR actual es Basic y el almacenamiento usa la redundancia/tier ya configurados; revisar los cargos de almacenamiento vigentes antes de aprobar la etapa protegida.'
            echo '- Este paso publica solo el frontend Ankay. No acredita un runtime Ankay completo ni provee backend/Orborus/worker/OpenSearch.'
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish reviewed Ankay frontend and source to EUS2
    if: github.ref == 'refs/heads/main'
    needs: [review]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: azure-demo-eus2
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_EUS2_GITHUB_PUBLISHER_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_EUS2_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_EUS2_SUBSCRIPTION_ID }}
      ACR_LOGIN_SERVER: ${{ vars.AZURE_EUS2_ACR_LOGIN_SERVER }}
      STORAGE_ACCOUNT: qapaqdemoeus2rel3a2405f3
      CONTAINER: siem-release
    steps:
      - name: Re-validate EUS2 target and reviewed metadata
        shell: bash
        env:
          IMAGE_TAG: ${{ needs.review.outputs.image_tag }}
          IMAGE_SHA256: ${{ needs.review.outputs.image_sha256 }}
          SOURCE_SHA256: ${{ needs.review.outputs.source_sha256 }}
          SOURCE_BLOB_NAME: ${{ needs.review.outputs.source_blob_name }}
        run: |
          set -euo pipefail
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID ACR_LOGIN_SERVER STORAGE_ACCOUNT CONTAINER IMAGE_TAG IMAGE_SHA256 SOURCE_SHA256 SOURCE_BLOB_NAME; do
            [[ -n "${!name}" ]] || { echo "::error::Missing reviewed EUS2 publishing value: $name"; exit 1; }
          done
          [[ "$ACR_LOGIN_SERVER" == qapaqsecopsdemoeus3a2405f3.azurecr.io ]]
          [[ "$STORAGE_ACCOUNT" == qapaqdemoeus2rel3a2405f3 && "$CONTAINER" == siem-release ]]
          [[ "$IMAGE_TAG" == "git-$SOURCE_SHA-sha256-$IMAGE_SHA256" ]]
          [[ "$IMAGE_SHA256" =~ ^[0-9a-f]{64}$ && "$SOURCE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$SOURCE_BLOB_NAME" == "ankay-source/$SOURCE_SHA/ankay-qapaq-frontend-source-$SOURCE_SHA.tar.gz" ]]

      - name: Download the exact reviewed artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ankay-${{ inputs.source_sha }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/ankay-publish

      - name: Re-check image and source bytes before cloud authentication
        working-directory: ${{ runner.temp }}/ankay-publish
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          IMAGE_SHA256: ${{ needs.review.outputs.image_sha256 }}
          SOURCE_SHA256: ${{ needs.review.outputs.source_sha256 }}
        run: |
          set -euo pipefail
          sha256sum --check --strict SHA256SUMS
          grep -Fxq "commit=$SOURCE_SHA" metadata.txt
          [[ "$(sha256sum image.tar.gz | awk '{print $1}')" == "$IMAGE_SHA256" ]]
          source_tar="$(find . -maxdepth 1 -type f -name 'ankay-qapaq-frontend-source-*.tar.gz' -print -quit)"
          [[ -n "$source_tar" ]]
          [[ "$(sha256sum "$source_tar" | awk '{print $1}')" == "$SOURCE_SHA256" ]]

      - name: Sign in with the EUS2 publisher identity
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_EUS2_GITHUB_PUBLISHER_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_EUS2_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_EUS2_SUBSCRIPTION_ID }}

      - name: Publish only new immutable ACR tag and source blob
        working-directory: ${{ runner.temp }}/ankay-publish
        shell: bash
        env:
          IMAGE_TAG: ${{ needs.review.outputs.image_tag }}
          IMAGE_SHA256: ${{ needs.review.outputs.image_sha256 }}
          SOURCE_SHA256: ${{ needs.review.outputs.source_sha256 }}
          SOURCE_BLOB_NAME: ${{ needs.review.outputs.source_blob_name }}
        run: |
          set -euo pipefail
          docker load --input image.tar.gz
          source_image="ankay-qapaq-frontend:${SOURCE_SHA}"
          target_image="$ACR_LOGIN_SERVER/ankay-qapaq-frontend:$IMAGE_TAG"
          docker image inspect "$source_image" >/dev/null
          tag_exists="$(az acr repository show --name "${ACR_LOGIN_SERVER%.azurecr.io}" \
            --image "ankay-qapaq-frontend:$IMAGE_TAG" --query name --output tsv 2>/dev/null || true)"
          [[ -z "$tag_exists" ]] || { echo '::error::The content-addressed ACR tag already exists; refusing to overwrite.'; exit 1; }
          blob_exists="$(az storage blob exists --auth-mode login --account-name "$STORAGE_ACCOUNT" \
            --container-name "$CONTAINER" --name "$SOURCE_BLOB_NAME" --query exists --output tsv)"
          [[ "$blob_exists" == false ]] || { echo '::error::The AGPL source Blob already exists; refusing to overwrite.'; exit 1; }
          access_token="$(az acr login --name "${ACR_LOGIN_SERVER%.azurecr.io}" --expose-token --output tsv --query accessToken)"
          [[ -n "$access_token" ]] || { echo 'Azure no entregó un token temporal para ACR.'; exit 1; }
          printf '%s' "$access_token" | docker login "$ACR_LOGIN_SERVER" \
            --username 00000000-0000-0000-0000-000000000000 --password-stdin
          unset access_token
          docker tag "$source_image" "$target_image"
          docker push "$target_image"
          image_digest="$(az acr manifest show-metadata --registry "${ACR_LOGIN_SERVER%.azurecr.io}" \
            --name "ankay-qapaq-frontend:$IMAGE_TAG" --query digest --output tsv)"
          [[ "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          source_tar="$(find . -maxdepth 1 -type f -name 'ankay-qapaq-frontend-source-*.tar.gz' -print -quit)"
          az storage blob upload --auth-mode login --account-name "$STORAGE_ACCOUNT" \
            --container-name "$CONTAINER" --name "$SOURCE_BLOB_NAME" --file "$source_tar" \
            --overwrite false --max-connections 4 --no-progress \
            --metadata "sha256=$SOURCE_SHA256" "source_sha=$SOURCE_SHA" \
            --content-type application/gzip --output none
          stored_sha="$(az storage blob show --auth-mode login --account-name "$STORAGE_ACCOUNT" \
            --container-name "$CONTAINER" --name "$SOURCE_BLOB_NAME" --query metadata.sha256 --output tsv)"
          [[ "$stored_sha" == "$SOURCE_SHA256" ]]
          printf '### Ankay frontend y fuente publicados en EUS2\n\n- Commit: `%s`\n- Imagen: `%s/ankay-qapaq-frontend@%s`\n- Blob de fuentes: `https://%s.blob.core.windows.net/%s/%s`\n- SHA-256 imagen del artefacto CI: `%s`\n- SHA-256 fuente AGPL: `%s`\n- El servicio aún no se instala; falta construir y aprobar los otros cinco servicios Ankay.\n' \
            "$SOURCE_SHA" "$ACR_LOGIN_SERVER" "$image_digest" "$STORAGE_ACCOUNT" "$CONTAINER" "$SOURCE_BLOB_NAME" \
            "$IMAGE_SHA256" "$SOURCE_SHA256" >> "$GITHUB_STEP_SUMMARY"
