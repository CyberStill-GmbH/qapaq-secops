name: Diagnose Wazuh dashboard domain

on:
  push:
    branches: [main]
    paths: [.github/workflows/diagnose-wazuh-dashboard-domain.yml]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AWS_PAGER: ""
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::955200662475:role/qapaq-secops-github-terraform-demo
          aws-region: us-east-1
          role-session-name: qapaq-secops-dashboard-diagnose
          allowed-account-ids: 955200662475

      - name: Read failed dashboard command output
        shell: bash
        run: |
          set -euo pipefail
          association_id="$(aws ssm list-associations --query "Associations[?AssociationName=='qapaq-secops-demo-wazuh-dashboard-domain'] | [0].AssociationId" --output text)"
          if [[ -z "$association_id" || "$association_id" == None ]]; then
            echo '::error::Dashboard domain association was not found.'
            exit 1
          fi
          execution_id="$(aws ssm describe-association-executions --association-id "$association_id" --query 'sort_by(AssociationExecutions, &CreatedTime)[-1].ExecutionId' --output text)"
          if [[ -z "$execution_id" || "$execution_id" == None ]]; then
            echo '::error::No execution history was found for the dashboard association.'
            exit 1
          fi
          targets="$(aws ssm describe-association-execution-targets --association-id "$association_id" --execution-id "$execution_id" --output json)"
          printf '%s\n' "$targets" | jq '.AssociationExecutionTargets[] | {ResourceId, Status, DetailedStatus, OutputSource}'
          found=false
          while IFS=$'\t' read -r command_id instance_id; do
            [[ -n "$command_id" ]] || continue
            found=true
            aws ssm get-command-invocation --command-id "$command_id" --instance-id "$instance_id" --query '{Status:Status,ExitCode:ResponseCode,Output:StandardOutputContent,Error:StandardErrorContent}' --output json
          done < <(printf '%s\n' "$targets" | jq -r '.AssociationExecutionTargets[] | select(.OutputSource.OutputSourceType == "RunCommand") | [.OutputSource.OutputSourceId, .ResourceId] | @tsv')
          if [[ "$found" != true ]]; then
            echo '::error::The association did not provide a Run Command output ID.'
            exit 1
          fi

      - name: Inspect ECS service failures
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          aws ecs describe-services --cluster qapaq-secops-demo --services qapaq-secops-demo-api qapaq-secops-demo-krakend --query 'services[].{Name:serviceName,Desired:desiredCount,Running:runningCount,Pending:pendingCount,Deployments:deployments[].{Status:status,TaskDefinition:taskDefinition,FailedTasks:failedTasks,State:rolloutState,Reason:rolloutStateReason},Events:events[:8].message}' --output json
          for service in api krakend; do
            task_arns="$(aws ecs list-tasks --cluster qapaq-secops-demo --service-name "qapaq-secops-demo-$service" --desired-status STOPPED --max-results 5 --query taskArns --output text)"
            if [[ -n "$task_arns" && "$task_arns" != None ]]; then
              read -r -a task_list <<< "$task_arns"
              aws ecs describe-tasks --cluster qapaq-secops-demo --tasks "${task_list[@]}" --query 'tasks[].{Task:taskArn,TaskDefinition:taskDefinitionArn,StopCode:stopCode,StoppedReason:stoppedReason,Containers:containers[].{Name:name,ExitCode:exitCode,Reason:reason}}' --output json
            fi
          done

      - name: Read Wazuh initialization and API startup errors
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          association_id="$(aws ssm list-associations --query "Associations[?AssociationName=='qapaq-secops-demo-wazuh-bootstrap'] | [0].AssociationId" --output text)"
          if [[ -n "$association_id" && "$association_id" != None ]]; then
            execution_id="$(aws ssm describe-association-executions --association-id "$association_id" --query 'sort_by(AssociationExecutions, &CreatedTime)[-1].ExecutionId' --output text)"
            if [[ -n "$execution_id" && "$execution_id" != None ]]; then
              targets="$(aws ssm describe-association-execution-targets --association-id "$association_id" --execution-id "$execution_id" --output json)"
              printf '%s\n' "$targets" | jq '.AssociationExecutionTargets[] | {ResourceId, Status, DetailedStatus, OutputSource}'
              while IFS=$'\t' read -r command_id instance_id; do
                [[ -n "$command_id" ]] || continue
                aws ssm get-command-invocation --command-id "$command_id" --instance-id "$instance_id" --query '{Status:Status,ExitCode:ResponseCode,Output:StandardOutputContent,Error:StandardErrorContent}' --output json
              done < <(printf '%s\n' "$targets" | jq -r '.AssociationExecutionTargets[] | select(.OutputSource.OutputSourceType == "RunCommand") | [.OutputSource.OutputSourceId, .ResourceId] | @tsv')
            fi
          fi
          log_stream="$(aws logs describe-log-streams --log-group-name /qapaq-secops/demo/api --order-by LastEventTime --descending --limit 1 --query 'logStreams[0].logStreamName' --output text)"
          if [[ -n "$log_stream" && "$log_stream" != None ]]; then
            aws logs get-log-events --log-group-name /qapaq-secops/demo/api --log-stream-name "$log_stream" --limit 30 --query 'events[].message' --output json
          fi

      - name: Read failed API revision startup logs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          aws ecs describe-tasks --cluster qapaq-secops-demo --tasks 4620f02dd87e4639bd54dca5d62f7c4b --query 'tasks[].{Task:taskArn,TaskDefinition:taskDefinitionArn,StopCode:stopCode,StoppedReason:stoppedReason,Containers:containers[].{Name:name,ExitCode:exitCode,Reason:reason}}' --output json
          streams="$(aws logs describe-log-streams --log-group-name /qapaq-secops/demo/api --order-by LastEventTime --descending --limit 4 --query 'logStreams[].logStreamName' --output json)"
          while IFS= read -r stream; do
            echo "API stream: $stream"
            aws logs get-log-events --log-group-name /qapaq-secops/demo/api --log-stream-name "$stream" --limit 12 --query 'events[].message' --output json
          done < <(printf '%s\n' "$streams" | jq -r '.[]')

      - name: Check required secret versions without reading values
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for suffix in entra/client-secret postgres/soc-runtime api/entity-ref-key api/vapid-private-key wazuh/indexer-reader wazuh/indexer-proxy-ca wazuh/dashboard-admin-user wazuh/dashboard-analyst-user; do
            secret_id="qapaq-secops/demo/$suffix"
            count="$(aws secretsmanager list-secret-version-ids --secret-id "$secret_id" --query "length(Versions[?contains(VersionStages, 'AWSCURRENT')])" --output text)"
            echo "$secret_id: current_version_count=$count"
          done

      - name: Inspect deployment OIDC trust conditions
        if: always()
        shell: bash
        run: aws iam get-role --role-name qapaq-secops-github-terraform-demo --query 'Role.AssumeRolePolicyDocument.Statement[].Condition' --output json

      - name: Inspect private Indexer TLS failure
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/indexer-diagnostic.json <<'PARAMS'
          {"commands":["set -eu","python3 - <<'PY'\nimport re\nfrom pathlib import Path\np=Path('/var/log/nginx/error.log')\nfor line in p.read_text(errors='replace').splitlines()[-200:]:\n if 'upstream' in line and ('9200' in line or 'wazuh-alerts' in line):\n  print(re.sub(r', request:.*', '', line))\nPY","openssl s_client -connect 127.0.0.1:9200 </dev/null 2>/dev/null | openssl x509 -noout -subject -issuer -ext subjectAltName","ss -lntp | grep -E ':9200|:5601'"]}
          PARAMS
          command_id="$(aws ssm send-command --instance-ids i-06e0c5fd6ad8b6906 --document-name AWS-RunShellScript --parameters file:///tmp/indexer-diagnostic.json --query Command.CommandId --output text)"
          aws ssm wait command-executed --command-id "$command_id" --instance-id i-06e0c5fd6ad8b6906 || true
          aws ssm get-command-invocation --command-id "$command_id" --instance-id i-06e0c5fd6ad8b6906 --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' --output json
