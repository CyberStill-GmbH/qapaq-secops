name: Terraform AWS PowerUser

# Manual plan/apply for infra/aws-poweruser in account 046372463234.
# Required repository variable: QAPAQ_AWS_POWERUSER_TERRAFORM_ROLE_ARN.
# The role and GitHub OIDC provider are provisioned separately by an AWS administrator.

on:
  workflow_dispatch:
    inputs:
      action:
        description: Terraform operation
        type: choice
        required: true
        default: plan
        options:
          - plan
          - apply
      plan_run_id:
        description: Successful plan workflow run ID (required for apply)
        type: string
        required: false
      plan_sha256:
        description: SHA-256 of the reviewed poweruser.tfplan (required for apply)
        type: string
        required: false

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: qapaq-secops-aws-poweruser-terraform
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION: us-east-1
  TERRAFORM_VERSION: 1.16.5

jobs:
  terraform:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: infra/aws-poweruser
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require main branch and PowerUser role variable
        shell: bash
        env:
          ACTION: ${{ inputs.action }}
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
          PLAN_SHA256: ${{ inputs.plan_sha256 }}
          AWS_POWERUSER_TERRAFORM_ROLE_ARN: ${{ vars.QAPAQ_AWS_POWERUSER_TERRAFORM_ROLE_ARN }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo '::error::Terraform AWS PowerUser can run only from main.'
            exit 1
          fi
          if [[ ! "$AWS_POWERUSER_TERRAFORM_ROLE_ARN" =~ ^arn:aws:iam::046372463234:role/.+ ]]; then
            echo '::error::Set QAPAQ_AWS_POWERUSER_TERRAFORM_ROLE_ARN to a role ARN in account 046372463234.'
            exit 1
          fi
          if [[ "$ACTION" == "apply" ]]; then
            if [[ ! "$PLAN_RUN_ID" =~ ^[0-9]+$ ]]; then
              echo '::error::Apply requires the run ID of a successful plan workflow.'
              exit 1
            fi
            if [[ ! "$PLAN_SHA256" =~ ^[[:xdigit:]]{64}$ ]]; then
              echo '::error::Apply requires the 64-character SHA-256 shown by the reviewed plan run.'
              exit 1
            fi
          fi

      - name: Verify plan run provenance
        if: inputs.action == 'apply'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
          CURRENT_SHA: ${{ github.sha }}
          CURRENT_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PLAN_RUN_ID}")"
          jq -e \
            --arg commit "$CURRENT_SHA" \
            --arg repository "$CURRENT_REPOSITORY" \
            '.event == "workflow_dispatch" and
             .head_branch == "main" and
             .head_repository.full_name == $repository and
             ((.path | split("@")[0]) == ".github/workflows/terraform-aws-poweruser.yml") and
             .status == "completed" and
             .conclusion == "success" and
             .head_sha == $commit' \
            <<<"$run_json" >/dev/null || {
              echo '::error::Plan run must be a successful PowerUser workflow_dispatch on main at this exact commit.'
              exit 1
            }

      - name: Download reviewed Terraform plan
        if: inputs.action == 'apply'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: poweruser-plan-${{ inputs.plan_run_id }}
          path: infra/aws-poweruser/downloaded-plan
          repository: ${{ github.repository }}
          run-id: ${{ inputs.plan_run_id }}
          github-token: ${{ github.token }}

      - name: Verify reviewed plan hash and metadata
        if: inputs.action == 'apply'
        shell: bash
        env:
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
          PLAN_SHA256: ${{ inputs.plan_sha256 }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          plan_path=downloaded-plan/poweruser.tfplan
          review_path=downloaded-plan/plan.txt
          manifest_path=downloaded-plan/plan-manifest.json
          [[ -s "$plan_path" && -s "$review_path" && -s "$manifest_path" ]] || {
            echo '::error::The short-lived plan artifact is incomplete or expired; create a new plan.'
            exit 1
          }
          actual_plan_sha="$(sha256sum "$plan_path" | cut -d ' ' -f 1)"
          actual_review_sha="$(sha256sum "$review_path" | cut -d ' ' -f 1)"
          [[ "$actual_plan_sha" == "${PLAN_SHA256,,}" ]] || {
            echo '::error::The downloaded plan SHA-256 does not match the reviewed plan input.'
            exit 1
          }
          jq -e \
            --arg run_id "$PLAN_RUN_ID" \
            --arg commit "$CURRENT_SHA" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg plan_sha "$actual_plan_sha" \
            --arg review_sha "$actual_review_sha" \
            '.run_id == $run_id and
             .commit_sha == $commit and
             .repository == $repository and
             .root == "infra/aws-poweruser" and
             .workflow == ".github/workflows/terraform-aws-poweruser.yml" and
             .backend_key == "aws-poweruser/dev/terraform.tfstate" and
             .terraform_version == "1.16.5" and
             .plan_sha256 == $plan_sha and
             .review_sha256 == $review_sha' \
            "$manifest_path" >/dev/null || {
              echo '::error::The plan artifact metadata, rendered review, commit, or run ID does not match.'
              exit 1
            }
          cp "$plan_path" poweruser.tfplan
          echo "Verified reviewed plan: run ${PLAN_RUN_ID}, commit ${CURRENT_SHA}, SHA-256 ${actual_plan_sha}."

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.QAPAQ_AWS_POWERUSER_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: qapaq-poweruser-terraform-${{ github.run_id }}
          allowed-account-ids: '046372463234'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -input=false -backend-config=backend.hcl

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        if: inputs.action == 'plan'
        run: |
          set -euo pipefail
          terraform plan \
            -input=false \
            -refresh=true \
            -lock=true \
            -lock-timeout=5m \
            -no-color \
            -var-file=environments/dev.tfvars \
            -out=poweruser.tfplan
          terraform show -no-color poweruser.tfplan > plan.txt
          PLAN_SHA256="$(sha256sum poweruser.tfplan | cut -d ' ' -f 1)"
          REVIEW_SHA256="$(sha256sum plan.txt | cut -d ' ' -f 1)"
          jq -n \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg commit_sha "$GITHUB_SHA" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg root "infra/aws-poweruser" \
            --arg workflow ".github/workflows/terraform-aws-poweruser.yml" \
            --arg backend_key "aws-poweruser/dev/terraform.tfstate" \
            --arg terraform_version "$TERRAFORM_VERSION" \
            --arg plan_sha256 "$PLAN_SHA256" \
            --arg review_sha256 "$REVIEW_SHA256" \
            '{run_id:$run_id, commit_sha:$commit_sha, repository:$repository,
              root:$root, workflow:$workflow,
              backend_key:$backend_key, terraform_version:$terraform_version,
              plan_sha256:$plan_sha256, review_sha256:$review_sha256}' \
            > plan-manifest.json
          {
            echo '### Terraform AWS PowerUser plan'
            echo
            echo "- Commit: `$GITHUB_SHA`"
            echo "- Plan run ID: `$GITHUB_RUN_ID`"
            echo "- Plan SHA-256: `$PLAN_SHA256`"
            echo '- Review `plan.txt` in artifact `poweruser-plan-'"$GITHUB_RUN_ID"'` before starting a separate manual Apply run.'
            echo '- Artifact expires after one day. Apply requires this run ID and SHA-256.'
            echo
            echo '```'
            grep -E '^(Plan:|No changes)' plan.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload short-lived reviewed plan
        if: inputs.action == 'plan'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: poweruser-plan-${{ github.run_id }}
          path: |
            infra/aws-poweruser/poweruser.tfplan
            infra/aws-poweruser/plan.txt
            infra/aws-poweruser/plan-manifest.json
          if-no-files-found: error
          retention-days: 1

      - name: Terraform Apply reviewed saved plan
        if: inputs.action == 'apply'
        run: terraform apply -input=false -lock=true -lock-timeout=5m -auto-approve -no-color poweruser.tfplan
