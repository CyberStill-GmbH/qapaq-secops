name: Publish verified images

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-images-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      checks: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: "955200662475"
      AWS_ECR_PUBLISHER_ROLE_ARN: ${{ vars.AWS_ECR_PUBLISHER_ROLE_ARN }}
      IMAGE_TAG: git-${{ github.sha }}
      COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: Require manual dispatch from main
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/heads/main || "$GITHUB_EVENT_NAME" != workflow_dispatch ]]; then
            echo 'Image publication is allowed only by manual dispatch from main.' >&2
            exit 1
          fi

      - name: Checkout exact CI-verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Wait for CI / required on this exact commit
        shell: bash
        env:
          ACTIONS_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            checks=$(curl --fail --silent --show-error \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${ACTIONS_GITHUB_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/commits/${COMMIT_SHA}/check-runs?per_page=100")
            result=$(jq -r \
              '[.check_runs[] | select(.name == "CI / required" and .app.slug == "github-actions")] | sort_by(.started_at // "") | last | [.status // "", .conclusion // ""] | @tsv' \
              <<< "$checks")
            status=${result%%$'\t'*}
            conclusion=${result#*$'\t'}
            if [[ "$status" == completed && "$conclusion" == success ]]; then
              echo "CI / required passed for ${COMMIT_SHA}."
              exit 0
            fi
            if [[ "$status" == completed ]]; then
              echo "CI / required concluded '${conclusion}' for ${COMMIT_SHA}." >&2
              exit 1
            fi
            echo "Waiting for CI / required on ${COMMIT_SHA} (attempt ${attempt}/90)."
            sleep 10
          done
          echo "Timed out waiting for CI / required on ${COMMIT_SHA}." >&2
          exit 1

      - name: Validate publisher configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${AWS_ECR_PUBLISHER_ROLE_ARN:?Set the AWS_ECR_PUBLISHER_ROLE_ARN repository variable from Terraform output}"
          if [[ "$AWS_ECR_PUBLISHER_ROLE_ARN" != "arn:aws:iam::${AWS_ACCOUNT_ID}:role/qapaq-secops-demo-github-ecr-publisher" ]]; then
            echo 'AWS_ECR_PUBLISHER_ROLE_ARN must identify the dedicated publisher role in the expected account.' >&2
            exit 1
          fi
          test "$IMAGE_TAG" = "git-${COMMIT_SHA}"

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ECR_PUBLISHER_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: qapaq-secops-image-publish

      - name: Verify AWS account and resolve ECR repository URLs
        id: ecr
        shell: bash
        run: |
          set -euo pipefail
          test -n "${AWS_ECR_PUBLISHER_ROLE_ARN:?Set the AWS_ECR_PUBLISHER_ROLE_ARN repository variable}"
          account_id=$(aws sts get-caller-identity --query Account --output text)
          if [[ "$account_id" != "$AWS_ACCOUNT_ID" ]]; then
            echo "Refusing to publish to unexpected AWS account: ${account_id}" >&2
            exit 1
          fi
          repositories=$(aws ecr describe-repositories \
            --repository-names qapaq-secops-api qapaq-secops-worker qapaq-secops-krakend \
            --query 'repositories[].repositoryName' --output text)
          for repository in qapaq-secops-api qapaq-secops-worker qapaq-secops-krakend; do
            if ! grep -qw "$repository" <<< "$repositories"; then
              echo "Required ECR repository is missing: ${repository}" >&2
              exit 1
            fi
          done
          for service in api worker krakend; do
            uri="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/qapaq-secops-${service}"
            printf '%s=%s\n' "$service" "$uri" >> "$GITHUB_OUTPUT"
          done
          aws ecr get-login-password --region "$AWS_REGION" |
            docker login --username AWS --password-stdin "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

      - name: Build and pass the same runtime, smoke, lifecycle, and Trivy gates as CI
        run: bash .github/ci/verify-container-images.sh

      - name: Tag and push only verified images
        shell: bash
        env:
          API_REPOSITORY: ${{ steps.ecr.outputs.api }}
          WORKER_REPOSITORY: ${{ steps.ecr.outputs.worker }}
          KRAKEND_REPOSITORY: ${{ steps.ecr.outputs.krakend }}
        run: |
          set -euo pipefail
          docker tag qapaq-ci:api "${API_REPOSITORY}:${IMAGE_TAG}"
          docker tag qapaq-ci:worker "${WORKER_REPOSITORY}:${IMAGE_TAG}"
          docker tag qapaq-ci:krakend "${KRAKEND_REPOSITORY}:${IMAGE_TAG}"
          docker push "${API_REPOSITORY}:${IMAGE_TAG}"
          docker push "${WORKER_REPOSITORY}:${IMAGE_TAG}"
          docker push "${KRAKEND_REPOSITORY}:${IMAGE_TAG}"

      - name: Record immutable image digests
        shell: bash
        env:
          API_REPOSITORY: ${{ steps.ecr.outputs.api }}
          WORKER_REPOSITORY: ${{ steps.ecr.outputs.worker }}
          KRAKEND_REPOSITORY: ${{ steps.ecr.outputs.krakend }}
        run: |
          set -euo pipefail
          timestamp=$(date --utc +'%Y-%m-%dT%H:%M:%SZ')
          read -r api_tag api_digest < <(aws ecr batch-get-image --repository-name qapaq-secops-api --image-ids "imageTag=${IMAGE_TAG}" --query 'images[0].imageId.[imageTag,imageDigest]' --output text)
          read -r worker_tag worker_digest < <(aws ecr batch-get-image --repository-name qapaq-secops-worker --image-ids "imageTag=${IMAGE_TAG}" --query 'images[0].imageId.[imageTag,imageDigest]' --output text)
          read -r krakend_tag krakend_digest < <(aws ecr batch-get-image --repository-name qapaq-secops-krakend --image-ids "imageTag=${IMAGE_TAG}" --query 'images[0].imageId.[imageTag,imageDigest]' --output text)
          [[ "$api_tag" == "$IMAGE_TAG" && "$worker_tag" == "$IMAGE_TAG" && "$krakend_tag" == "$IMAGE_TAG" ]]
          for digest in "$api_digest" "$worker_digest" "$krakend_digest"; do
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          done
          mkdir -p artifacts/deployment
          jq -n \
            --arg commit "$COMMIT_SHA" \
            --arg account "$AWS_ACCOUNT_ID" \
            --arg region "$AWS_REGION" \
            --arg timestamp "$timestamp" \
            --arg api_repository "$API_REPOSITORY" \
            --arg api_tag "$api_tag" \
            --arg api_digest "$api_digest" \
            --arg worker_repository "$WORKER_REPOSITORY" \
            --arg worker_tag "$worker_tag" \
            --arg worker_digest "$worker_digest" \
            --arg krakend_repository "$KRAKEND_REPOSITORY" \
            --arg krakend_tag "$krakend_tag" \
            --arg krakend_digest "$krakend_digest" \
            '{schemaVersion:1,project:"qapaq-secops",environment:"demo",awsAccount:$account,region:$region,gitCommit:$commit,publishedAt:$timestamp,images:{api:{repository:"qapaq-secops-api",uri:$api_repository,tag:$api_tag,digest:$api_digest},worker:{repository:"qapaq-secops-worker",uri:$worker_repository,tag:$worker_tag,digest:$worker_digest},krakend:{repository:"qapaq-secops-krakend",uri:$krakend_repository,tag:$krakend_tag,digest:$krakend_digest}}}' \
            > artifacts/deployment/image-manifest.json
          cat artifacts/deployment/image-manifest.json

      - name: Upload image manifest evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-manifest-${{ github.sha }}
          path: artifacts/deployment/image-manifest.json
          if-no-files-found: error
          retention-days: 30
