name: QAPAQ launch detection pack

on:
  pull_request:
    paths:
      - 'infra/wazuh/launch-detections/**'
      - 'docs/security/launch-detection-catalog-2026-10-20.json'
      - '.github/workflows/wazuh-launch-detections.yml'
  push:
    branches: [main]
    paths:
      - 'infra/wazuh/launch-detections/**'
      - 'docs/security/launch-detection-catalog-2026-10-20.json'
      - '.github/workflows/wazuh-launch-detections.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qapaq-wazuh-launch-detections-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-logtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate 30-detection manifest and rule references
        run: python3 infra/wazuh/launch-detections/validate_catalog.py
      - name: Start isolated Wazuh Manager 4.14.8
        run: docker run --detach --rm --name qapaq-wazuh-launch-test --ulimit nofile=458752:458752 wazuh/wazuh-manager:4.14.8
      - name: Wait for Manager and run positive/negative fixtures
        run: |
          ready=false
          for attempt in $(seq 1 60); do
            if docker exec qapaq-wazuh-launch-test /var/ossec/bin/wazuh-analysisd -t >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true
          bash infra/wazuh/launch-detections/tests/run-logtest.sh qapaq-wazuh-launch-test
