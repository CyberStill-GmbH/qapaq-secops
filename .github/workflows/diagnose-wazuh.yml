name: Diagnose Wazuh EC2

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::955200662475:role/qapaq-secops-github-terraform-demo
          aws-region: us-east-1
          role-session-name: qapaq-secops-wazuh-diagnose
          allowed-account-ids: 955200662475

      - name: Inspect Wazuh host and bootstrap logs
        shell: bash
        run: |
          set -euo pipefail
          instance_id="$(aws ec2 describe-instances \
            --filters 'Name=tag:Name,Values=qapaq-secops-demo-wazuh' 'Name=instance-state-name,Values=pending,running,stopping,stopped' \
            --query 'Reservations[].Instances[].InstanceId | [0]' --output text)"
          if [[ -z "$instance_id" || "$instance_id" == None ]]; then
            echo 'No Wazuh EC2 instance found.'
            exit 1
          fi
          echo "Instance: $instance_id"
          aws ec2 describe-instances --instance-ids "$instance_id" \
            --query 'Reservations[].Instances[].{State:State.Name,Status:Placement.AvailabilityZone,PublicIP:PublicIpAddress,Subnet:SubnetId,Launch:LaunchTime}' --output table
          aws ec2 describe-instance-status --instance-ids "$instance_id" --include-all-instances \
            --query 'InstanceStatuses[].{Instance:InstanceStatus.Status,System:SystemStatus.Status,Reachability:InstanceStatus.Details[?Name==`reachability`].Status|[0]}' --output table
          echo '--- EC2 system console (tail) ---'
          aws ec2 get-console-output --instance-id "$instance_id" --latest \
            --query Output --output text | tail -n 120 || true

          echo '--- SSM managed instance status ---'
          aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=$instance_id" \
            --query 'InstanceInformationList[].{Ping:PingStatus,Agent:AgentVersion,Platform:PlatformName}' --output table || true

          command_id="$(aws ssm send-command \
            --instance-ids "$instance_id" \
            --document-name AWS-RunShellScript \
            --comment 'Read Wazuh bootstrap diagnostics' \
            --parameters 'commands=["echo --- cloud-init-output ---; tail -n 100 /var/log/cloud-init-output.log 2>/dev/null || true; echo --- bootstrap ---; tail -n 100 /var/log/qapaq-wazuh-bootstrap.log 2>/dev/null || true; echo --- wazuh-install ---; tail -n 60 /var/log/wazuh-install.log 2>/dev/null || true; echo --- units ---; systemctl --no-pager --full status nginx snapd wazuh-manager wazuh-indexer wazuh-dashboard 2>&1 || true; echo --- listeners ---; ss -lntp 2>&1 || true"]' \
            --query 'Command.CommandId' --output text 2>/dev/null || true)"
          if [[ -z "$command_id" || "$command_id" == None ]]; then
            echo 'SSM Run Command could not be sent (permissions, agent, or instance connectivity).'
            exit 0
          fi
          echo "SSM command: $command_id"
          for attempt in $(seq 1 24); do
            status="$(aws ssm get-command-invocation --command-id "$command_id" \
              --instance-id "$instance_id" --query Status --output text 2>/dev/null || true)"
            case "$status" in
              Success|Failed|Cancelled|TimedOut|Undeliverable|Terminated) break ;;
            esac
            sleep 5
          done
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$instance_id" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' --output json || true

          probe_script="$(cat <<'REMOTE'
          python3 - <<'PY'
          import tarfile

          archive = tarfile.open('/root/wazuh-install-files.tar')
          stream = archive.extractfile('wazuh-install-files/wazuh-passwords.txt')
          for index, raw in enumerate(stream):
              line = raw.decode('utf-8', errors='replace').rstrip('\n')
              if line.lstrip().startswith('#'):
                  print(f'{index}: comment has_admin={"admin" in line.lower()} ({len(line)} chars)')
              elif line.strip():
                  key, separator, value = line.partition(':')
                  print(f'{index}: key={key.strip()!r} value_chars={len(value.strip())} colon={bool(separator)}')
          PY
          REMOTE
          )"
          probe_payload="$(jq -cn --arg command "$probe_script" '{commands: [$command]}')"
          probe_id="$(aws ssm send-command --instance-ids "$instance_id" \
            --document-name AWS-RunShellScript --comment 'Read redacted Wazuh password file layout' \
            --parameters "$probe_payload" --query 'Command.CommandId' --output text)"
          for attempt in $(seq 1 12); do
            status="$(aws ssm get-command-invocation --command-id "$probe_id" \
              --instance-id "$instance_id" --query Status --output text 2>/dev/null || true)"
            case "$status" in Success|Failed|Cancelled|TimedOut|Undeliverable|Terminated) break ;; esac
            sleep 5
          done
          aws ssm get-command-invocation --command-id "$probe_id" --instance-id "$instance_id" \
            --query '{Status:Status,RedactedLayout:StandardOutputContent,Error:StandardErrorContent}' --output json || true
