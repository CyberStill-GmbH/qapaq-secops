name: Seed QAPAQ Entra secret to Azure Key Vault

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qapaq-azure-key-vault-secret-seed
  cancel-in-progress: false

jobs:
  seed:
    name: Store QAPAQ API Entra secret without opening Key Vault networking
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: azure-demo
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the protected main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate required credentials and target
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_TERRAFORM_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ENTRA_CLIENT_SECRET: ${{ secrets.ENTRA_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID ENTRA_CLIENT_SECRET; do
            [[ -n "${!name}" ]] || { echo "::error::Missing required GitHub secret: $name"; exit 1; }
          done
          [[ "$AZURE_SUBSCRIPTION_ID" == 'aaf787f8-5964-4470-9eb6-89d15eacda61' ]] || {
            echo '::error::Refusing to target an unexpected Azure subscription.'
            exit 1
          }

      - name: Sign in with GitHub OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_TERRAFORM_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Refuse overwrite and deploy as a secure ARM parameter
        shell: bash
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ENTRA_CLIENT_SECRET: ${{ secrets.ENTRA_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          resource_group='rg-qapaqsecopsdemo-66f8c73b'
          vault_name='kv-qapaqsecopsd-66f8c73b'
          secret_resource_id="/subscriptions/${AZURE_SUBSCRIPTION_ID}/resourceGroups/${resource_group}/providers/Microsoft.KeyVault/vaults/${vault_name}/secrets/qapaq-entra-client-secret"

          check_error="$RUNNER_TEMP/qapaq-secret-check.err"
          set +e
          existing_id="$(az resource show --ids "$secret_resource_id" --api-version 2025-05-01 --query id --output tsv 2>"$check_error")"
          check_status=$?
          set -e
          if [[ $check_status -eq 0 && -n "$existing_id" ]]; then
            echo '::error::The target secret already exists; refusing to create another version or overwrite it.'
            exit 1
          fi
          if ! grep -q 'ResourceNotFound' "$check_error"; then
            echo '::error::Could not confirm the target secret is absent; refusing to continue.'
            exit 1
          fi
          rm -f "$check_error"

          parameter_file="$RUNNER_TEMP/qapaq-secret-parameters.json"
          chmod 700 "$RUNNER_TEMP"
          umask 077
          python3 - "$parameter_file" <<'PY'
          import json
          import os
          import pathlib
          import sys

          target = pathlib.Path(sys.argv[1])
          target.write_text(json.dumps({
              "$schema": "https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#",
              "contentVersion": "1.0.0.0",
              "parameters": {"secretValue": {"value": os.environ["ENTRA_CLIENT_SECRET"]}},
          }), encoding="utf-8")
          target.chmod(0o600)
          PY
          trap 'rm -f "$parameter_file"' EXIT

          az deployment group create \
            --name "qapaq-entra-secret-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --resource-group "$resource_group" \
            --template-file infra/azure/secrets/entra-client-secret.json \
            --parameters "@$parameter_file" \
            --output none

          az resource show \
            --ids "$secret_resource_id" \
            --api-version 2025-05-01 \
            --query '{id:id, enabled:properties.attributes.enabled}' \
            --output json

          echo 'Stored qapaq-entra-client-secret from ENTRA_CLIENT_SECRET; value was not emitted.' >> "$GITHUB_STEP_SUMMARY"
