name: Terraform Demo

on:
  workflow_dispatch:
    inputs:
      action:
        description: Terraform operation to run
        type: choice
        required: true
        default: plan
        options:
          - plan
          - apply
          - audit

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-demo
  cancel-in-progress: false

jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/aws
    env:
      TF_IN_AUTOMATION: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::955200662475:role/qapaq-secops-github-terraform-demo
          aws-region: us-east-1
          role-session-name: qapaq-secops-terraform
          allowed-account-ids: 955200662475

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        run: terraform plan -var-file environments/demo.tfvars -input=false -no-color -out=tfplan

      - name: Terraform Apply
        if: inputs.action == 'apply'
        run: terraform apply -input=false -auto-approve -no-color tfplan

      - name: Audit Phase 2B resources and remote state
        if: inputs.action == 'audit'
        shell: bash
        run: |
          set -euo pipefail
          echo '## Terraform state addresses'
          terraform state list

          echo '## Existing ECR repositories'
          if ! aws ecr describe-repositories \
            --repository-names qapaq-secops-api qapaq-secops-worker qapaq-secops-krakend \
            --query 'repositories[].{name:repositoryName,uri:repositoryUri,tagMutability:imageTagMutability,scanOnPush:imageScanningConfiguration.scanOnPush}' \
            --output json; then
            echo 'One or more expected ECR repositories are absent.'
          fi

          echo '## Publisher role and trust policy'
          if ! aws iam get-role \
            --role-name qapaq-secops-demo-github-ecr-publisher \
            --query 'Role.{Arn:Arn,Trust:AssumeRolePolicyDocument}' \
            --output json; then
            echo 'Publisher IAM role is absent.'
          fi

          echo '## Phase 2B S3 buckets'
          for bucket in \
            qapaq-secops-demo-raw-955200662475 \
            qapaq-secops-demo-evidence-955200662475 \
            qapaq-secops-demo-artifacts-955200662475; do
            if aws s3api head-bucket --bucket "$bucket" >/dev/null 2>&1; then
              echo "$bucket: present"
            else
              echo "$bucket: absent or inaccessible"
            fi
          done

