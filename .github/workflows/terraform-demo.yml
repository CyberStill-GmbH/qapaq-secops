name: Terraform Demo

on:
  push:
    branches:
      - main
    paths:
      - "infra/aws/**"
      - ".github/workflows/terraform-demo.yml"
  workflow_dispatch:
    inputs:
      action:
        description: Terraform operation to run
        type: choice
        required: true
        default: plan
        options:
          - plan
          - apply
          - audit
          - bootstrap-dns

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-demo
  cancel-in-progress: false

jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/aws
    env:
      TF_IN_AUTOMATION: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::955200662475:role/qapaq-secops-github-terraform-demo
          aws-region: us-east-1
          role-session-name: qapaq-secops-terraform
          allowed-account-ids: 955200662475

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan (DNS zone bootstrap)
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'bootstrap-dns'
        run: terraform plan -target=aws_route53_zone.public_api[0] -var-file environments/demo.tfvars -input=false -no-color -out=tfplan

      - name: Terraform Plan
        if: github.event_name != 'workflow_dispatch' || inputs.action != 'bootstrap-dns'
        run: terraform plan -var-file environments/demo.tfvars -input=false -no-color -out=tfplan

      - name: Terraform Apply
        if: github.event_name == 'workflow_dispatch' && (inputs.action == 'apply' || inputs.action == 'bootstrap-dns')
        run: terraform apply -input=false -auto-approve -no-color tfplan

      - name: Show DNS delegation details
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'bootstrap-dns'
        shell: bash
        run: |
          set -euo pipefail
          echo '## Route 53 name servers for qapaq.secops.com'
          terraform output -json public_route53_zone_name_servers
          echo '## Parent secops.com zone in this AWS account (if managed here)'
          parent_zone_id="$(aws route53 list-hosted-zones-by-name \
            --dns-name secops.com. \
            --query "HostedZones[?Name == 'secops.com.'] | [0].Id" \
            --output text)"
          if [ "$parent_zone_id" = "None" ] || [ -z "$parent_zone_id" ]; then
            echo 'No public secops.com parent zone is visible to the deployment role; delegate the child NS at the domain DNS provider.'
          else
            echo "Parent hosted zone: $parent_zone_id"
            aws route53 list-resource-record-sets \
              --hosted-zone-id "$parent_zone_id" \
              --query "ResourceRecordSets[?Name == 'qapaq.secops.com.' && Type == 'NS']" \
              --output json
          fi

      - name: Audit Phase 2B resources and remote state
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'audit'
        shell: bash
        run: |
          set -euo pipefail
          echo '## Terraform state addresses'
          terraform state list

          echo '## Existing ECR repositories'
          if ! aws ecr describe-repositories \
            --repository-names qapaq-secops-api qapaq-secops-worker qapaq-secops-krakend \
            --query 'repositories[].{name:repositoryName,uri:repositoryUri,tagMutability:imageTagMutability,scanOnPush:imageScanningConfiguration.scanOnPush}' \
            --output json; then
            echo 'One or more expected ECR repositories are absent.'
          fi

          echo '## Publisher role and trust policy'
          if ! aws iam get-role \
            --role-name qapaq-secops-demo-github-ecr-publisher \
            --query 'Role.{Arn:Arn,Trust:AssumeRolePolicyDocument}' \
            --output json; then
            echo 'Publisher IAM role is absent.'
          fi

          echo '## Publisher role policies'
          aws iam list-attached-role-policies \
            --role-name qapaq-secops-demo-github-ecr-publisher \
            --output json
          aws iam list-role-policies \
            --role-name qapaq-secops-demo-github-ecr-publisher \
            --output json
          aws iam get-role-policy \
            --role-name qapaq-secops-demo-github-ecr-publisher \
            --policy-name publish-demo-ecr-images \
            --query PolicyDocument \
            --output json

          echo '## Phase 2B S3 buckets'
          for bucket in \
            qapaq-secops-demo-raw-955200662475 \
            qapaq-secops-demo-evidence-955200662475 \
            qapaq-secops-demo-artifacts-955200662475; do
            if aws s3api head-bucket --bucket "$bucket" >/dev/null 2>&1; then
              echo "$bucket: present"
            else
              echo "$bucket: absent or inaccessible"
            fi
          done

