name: Terraform Demo

on:
  push:
    branches:
      - main
    paths:
      - "infra/aws/**"
      - "wazuh/access/**"
      - "wazuh/office365/**"
      - ".github/workflows/terraform-demo.yml"
  workflow_dispatch:
    inputs:
      action:
        description: Terraform operation; DNS bootstrap is disabled for this rollout.
        type: choice
        required: true
        default: plan
        options:
          - plan
          - apply
          - audit
      entra_callback_registered:
        description: Confirm the exact qapaq-secops.jappi.net.pe callback URI is registered in Entra before applying.
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  checks: read
  id-token: write

concurrency:
  group: terraform-demo
  cancel-in-progress: false

jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: infra/aws
    env:
      TF_IN_AUTOMATION: "true"
      # Sprint 5: OID de los dueños del grupo de admisión (admin en QAPAQ). Variable de
      # repositorio de GitHub, no del repositorio git; vacía = sin dueños declarados.
      TF_VAR_soc_group_owner_oids: ${{ vars.QAPAQ_GROUP_OWNER_OIDS }}
      # Sprint 5 · fase 3: grupo de admisión para el padrón por Graph (vacío = deshabilitado).
      TF_VAR_soc_directory_group_id: ${{ vars.QAPAQ_DIRECTORY_GROUP_ID || vars.SOC_DIRECTORY_GROUP_ID }}
      # Grupos cuyos miembros reciben admin; solo los declarados explícitamente.
      # Solo los grupos explícitamente declarados conceden admin; pertenecer al padrón SOC no basta.
      TF_VAR_soc_admin_group_ids: ${{ vars.QAPAQ_ADMIN_GROUP_IDS }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::955200662475:role/qapaq-secops-github-terraform-demo
          aws-region: us-east-1
          role-session-name: qapaq-secops-terraform
          allowed-account-ids: 955200662475

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        if: github.event_name != 'workflow_dispatch' || inputs.action != 'audit'
        shell: bash
        run: |
          set -euo pipefail
          plan_args=(-var-file environments/demo.tfvars -input=false -no-color -out=tfplan)
          certificate_address='aws_acm_certificate.public_api[0]'
          if certificate_state="$(terraform state show -no-color "$certificate_address" 2>/dev/null)"; then
            certificate_arn="$(awk '$1 == "arn" && $2 == "=" { gsub(/"/, "", $3); print $3; exit }' <<< "$certificate_state")"
            if [ -z "$certificate_arn" ]; then
              echo '::error::Could not read the managed ACM certificate ARN.'
              exit 1
            fi
            certificate_status="$(aws acm describe-certificate --certificate-arn "$certificate_arn" --query 'Certificate.Status' --output text)"
            case "$certificate_status" in
              FAILED|VALIDATION_TIMED_OUT)
                echo "Managed ACM certificate is $certificate_status; planning replacement of $certificate_address only."
                plan_args+=("-replace=$certificate_address")
                ;;
            esac
          fi
          terraform plan "${plan_args[@]}"

      - name: Reject unexpected destruction or secret rotation
        if: github.event_name != 'workflow_dispatch' || inputs.action != 'audit'
        shell: bash
        run: |
          set -euo pipefail
          terraform show -json tfplan > "$RUNNER_TEMP/qapaq-tfplan.json"
          TFPLAN_JSON="$RUNNER_TEMP/qapaq-tfplan.json" python3 - <<'PY'
          import json, os, sys
          with open(os.environ["TFPLAN_JSON"], encoding="utf-8") as stream:
              plan = json.load(stream)
          failures = []
          for item in plan.get("resource_changes", []):
              address = item.get("address", "unknown")
              resource_type = item.get("type", "")
              change = item.get("change", {})
              actions = change.get("actions", [])
              before = change.get("before") or {}
              after = change.get("after") or {}
              dashboard_host = "qapaq-secops.jappi.net.pe"
              allowed_dashboard_dns = False
              if resource_type == "aws_route53_record" and actions in (["create"], ["update"]):
                  if address == "aws_route53_record.wazuh_dashboard[0]":
                      allowed_dashboard_dns = (
                          after.get("name", "").rstrip(".").lower() == dashboard_host
                          and after.get("type") == "A"
                      )
                  elif address == "aws_route53_record.wazuh_dashboard_caa[0]":
                      allowed_dashboard_dns = (
                          after.get("name", "").rstrip(".").lower() == dashboard_host
                          and after.get("type") == "CAA"
                          and after.get("records") == ['0 issue "letsencrypt.org"']
                      )
              if resource_type.startswith("aws_route53_") and actions != ["no-op"] and not allowed_dashboard_dns:
                  failures.append(f"unapproved DNS change: {address} {actions}")
              if "delete" in actions:
                  failures.append(f"unexpected destroy/replacement: {address} {actions}")
              if resource_type == "aws_secretsmanager_secret_version" and actions != ["no-op"]:
                  failures.append(f"secret version changes are blocked: {address} {actions}")
              if resource_type == "aws_elasticache_replication_group":
                  if before and before.get("auth_token_wo_version") != after.get("auth_token_wo_version"):
                      failures.append(f"Valkey AUTH version change is blocked: {address}")
          if failures:
              print("::error::Terraform plan violates the DNS allowlist/no-destroy/no-secret-rotation gate.")
              print("\n".join(failures))
              sys.exit(1)
          print("Plan gate passed: only the QAPAQ dashboard A/Let's Encrypt CAA may change; no other DNS, destroy, secret or Valkey AUTH changes.")
          PY

      - name: Wait for CI / required on this exact commit
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
        shell: bash
        env:
          ACTIONS_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            checks=$(curl --fail --silent --show-error \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${ACTIONS_GITHUB_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100")
            result=$(jq -r \
              '[.check_runs[] | select(.name == "CI / required" and .app.slug == "github-actions")] | sort_by(.started_at // "") | last | [.status // "", .conclusion // ""] | @tsv' \
              <<< "$checks")
            status=${result%%$'\t'*}
            conclusion=${result#*$'\t'}
            if [[ "$status" == completed && "$conclusion" == success ]]; then
              echo "CI / required passed for ${GITHUB_SHA}."
              exit 0
            fi
            if [[ "$status" == completed ]]; then
              echo "CI / required concluded '${conclusion}' for ${GITHUB_SHA}." >&2
              exit 1
            fi
            echo "Waiting for CI / required on ${GITHUB_SHA} (attempt ${attempt}/90)."
            sleep 10
          done
          echo "Timed out waiting for CI / required on ${GITHUB_SHA}." >&2
          exit 1


      - name: Verify existing Entra secret without changing it
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
        shell: bash
        run: |
          set -euo pipefail
          current="$(aws secretsmanager list-secret-version-ids --secret-id qapaq-secops/demo/entra/client-secret --query "length(Versions[?contains(VersionStages, 'AWSCURRENT')])" --output text)"
          if [[ "$current" == 0 ]]; then
            echo '::error::The existing Entra secret must already have an AWSCURRENT version in Secrets Manager.'
            exit 1
          fi

      - name: Require Entra callback registration confirmation
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
        env:
          ENTRA_CALLBACK_REGISTERED: ${{ inputs.entra_callback_registered }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$ENTRA_CALLBACK_REGISTERED" != "true" ]]; then
            echo '::error::Register https://qapaq-secops.jappi.net.pe/qapaq-api/api/auth/callback in Entra, then dispatch apply with the confirmation enabled.'
            exit 1
          fi

      - name: Require runtime images built from current source
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
        shell: bash
        run: |
          set -euo pipefail
          manifest_commit="$(sed -n 's/^runtime_image_manifest_commit = "\([0-9a-f]\{40\}\)"$/\1/p' environments/demo.tfvars)"
          if [[ ! "$manifest_commit" =~ ^[0-9a-f]{40}$ ]] || ! git merge-base --is-ancestor "$manifest_commit" "$GITHUB_SHA"; then
            echo '::error::The configured image manifest commit must be a full ancestor of this main commit.'
            exit 1
          fi
          if ! git diff --quiet "$manifest_commit" "$GITHUB_SHA" -- \
            apps/api apps/worker modules platform packages scripts package.json pnpm-lock.yaml pnpm-workspace.yaml \
            .github/ci/verify-container-images.sh; then
            echo '::error::API/worker/runtime source changed after the configured image manifest. Publish images from the final source and update demo.tfvars before apply.'
            exit 1
          fi
          echo "Runtime source is unchanged since verified image commit ${manifest_commit}."

      - name: Verify configured image digests exist in ECR
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
        shell: bash
        run: |
          set -euo pipefail
          for service in api worker krakend; do
            digest="$(sed -n "/^  ${service} = /s/.*\\(sha256:[0-9a-f]\{64\}\\).*/\\1/p" environments/demo.tfvars)"
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Missing immutable ${service} digest in environments/demo.tfvars."
              exit 1
            fi
            aws ecr describe-images \
              --repository-name "qapaq-secops-${service}" \
              --image-ids "imageDigest=${digest}" \
              --query 'imageDetails[0].imageDigest' --output text >/dev/null
          done
          echo 'All configured runtime image digests exist in ECR.'

      - name: Terraform Apply
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
        run: terraform apply -input=false -auto-approve -no-color tfplan


      - name: Verify Wazuh initialization and recover the gateway
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
        shell: bash
        run: |
          set -euo pipefail
          bootstrap="$(terraform output -json wazuh_bootstrap)"
          if [[ "$bootstrap" != null ]]; then
            association_id="$(jq -r '.association' <<< "$bootstrap")"
            association_version="$(aws ssm describe-association --association-id "$association_id" --query 'AssociationDescription.AssociationVersion' --output text)"
            status=None
            for attempt in $(seq 1 120); do
              execution="$(aws ssm describe-association-executions --association-id "$association_id" --query "sort_by(AssociationExecutions[?AssociationVersion=='$association_version'], &CreatedTime)[-1]" --output json)"
              status="$(jq -r '.Status // "None"' <<< "$execution")"
              case "$status" in
                Success) break ;;
                Failed|TimedOut|Cancelled)
                  execution_id="$(jq -r '.ExecutionId' <<< "$execution")"
                  targets="$(aws ssm describe-association-execution-targets --association-id "$association_id" --execution-id "$execution_id" --output json)"
                  while IFS=$'\t' read -r command_id instance_id; do
                    [[ -n "$command_id" ]] || continue
                    aws ssm get-command-invocation --command-id "$command_id" --instance-id "$instance_id" --query '{Status:Status,ExitCode:ResponseCode,Output:StandardOutputContent,Error:StandardErrorContent}' --output json
                  done < <(printf '%s\n' "$targets" | jq -r '.AssociationExecutionTargets[] | select(.OutputSource.OutputSourceType == "RunCommand") | [.OutputSource.OutputSourceId, .ResourceId] | @tsv')
                  echo "::error::Wazuh initialization failed: $status"
                  exit 1
                  ;;
              esac
              sleep 5
            done
            if [[ "$status" != Success ]]; then
              echo "::error::Wazuh initialization did not complete: $status"
              exit 1
            fi
            for suffix in indexer-reader indexer-proxy-ca dashboard-admin-user dashboard-analyst-user; do
              secret_id="qapaq-secops/demo/wazuh/$suffix"
              current="$(aws secretsmanager list-secret-version-ids --secret-id "$secret_id" --query "length(Versions[?contains(VersionStages, 'AWSCURRENT')])" --output text)"
              if [[ "$current" == 0 ]]; then
                echo "::error::Required generated secret has no AWSCURRENT version: $secret_id"
                exit 1
              fi
            done
            aws ecs update-service --cluster qapaq-secops-demo --service qapaq-secops-demo-krakend --force-new-deployment --query 'service.serviceName' --output text
          fi
          # ECS injects Secrets Manager values at task startup; refresh the API after sync.
          aws ecs update-service --cluster qapaq-secops-demo --service qapaq-secops-demo-api --force-new-deployment --query 'service.serviceName' --output text
          aws ecs wait services-stable --cluster qapaq-secops-demo --services qapaq-secops-demo-api qapaq-secops-demo-krakend qapaq-secops-demo-worker
          curl --fail --silent --show-error --retry 6 --retry-delay 5 --max-time 15 https://api.jappi.net.pe/api/health/ready -o /dev/null
          curl --fail --silent --show-error --retry 6 --retry-delay 5 --max-time 15 https://qapaq-secops.jappi.net.pe/qapaq-api/api/health/ready -o /dev/null

      - name: Verify browser sign-in redirect
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, urllib.parse
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args):
                  return None
          opener = urllib.request.build_opener(NoRedirect)
          try:
              response = opener.open("https://qapaq-secops.jappi.net.pe/qapaq-api/api/auth/start", timeout=20)
          except urllib.error.HTTPError as error:
              response = error
          target = urllib.parse.urlsplit(response.headers.get("Location", ""))
          assert response.code == 302, f"Expected login redirect, received HTTP {response.code}"
          assert target.scheme == "https" and target.hostname == "login.microsoftonline.com", "Invalid identity-provider redirect"
          authorize = urllib.parse.parse_qs(target.query)
          expected_callback = "https://qapaq-secops.jappi.net.pe/qapaq-api/api/auth/callback"
          assert authorize.get("redirect_uri") == [expected_callback], "Unexpected Entra callback URI"
          cookies = response.headers.get_all("Set-Cookie", [])
          assert any("Path=/qapaq-api/api/auth/callback" in cookie for cookie in cookies), "OIDC cookie path does not match the public callback"
          print("Browser sign-in: Microsoft redirect, exact callback URI, and browser cookie path verified")
          PY

      - name: Verify public endpoints return HTTP 200
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
        shell: bash
        run: |
          set -euo pipefail
          wait_for_http_200() {
            local label="$1" url="$2" http_status="" attempt
            for attempt in $(seq 1 6); do
              http_status="$(curl --location --max-redirs 5 --silent --show-error \
                --output /dev/null --write-out '%{http_code}' --max-time 15 "$url" || true)"
              if [[ "$http_status" == "200" ]]; then
                echo "$label: HTTP 200 (attempt $attempt)"
                return 0
              fi
              echo "$label: HTTP ${http_status:-000} (attempt $attempt/6)"
              sleep 5
            done
            echo "::error::$label did not return HTTP 200; last status: ${http_status:-000}."
            return 1
          }

          dashboard_url="$(terraform output -raw wazuh_dashboard_url)"
          api_url="$(terraform output -raw public_api_url)"
          dashboard_url="${dashboard_url%/}"
          wait_for_http_200 "QAPAQ Dashboard" "$dashboard_url/"
          wait_for_http_200 "QAPAQ API readiness" "$api_url/api/health/ready"
          wait_for_http_200 "Same-origin QAPAQ API readiness" \
            "https://qapaq-secops.jappi.net.pe/qapaq-api/api/health/ready"

      - name: Show public deployment URLs
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
        shell: bash
        run: |
          set -euo pipefail
          dashboard_url="$(terraform output -raw wazuh_dashboard_url)"
          api_url="$(terraform output -raw public_api_url)"
          echo "Wazuh Dashboard: $dashboard_url"
          echo "QAPAQ API URL: $api_url"

      - name: Audit Phase 2B resources and remote state
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'audit'
        shell: bash
        run: |
          set -euo pipefail
          echo '## Terraform state addresses (read only)'
          terraform state list

          echo '## Existing ECR repositories'
          if ! aws ecr describe-repositories \
            --repository-names qapaq-secops-api qapaq-secops-worker qapaq-secops-krakend \
            --query 'repositories[].{name:repositoryName,uri:repositoryUri,tagMutability:imageTagMutability,scanOnPush:imageScanningConfiguration.scanOnPush}' \
            --output json; then
            echo 'One or more expected ECR repositories are absent.'
          fi

          echo '## Publisher role and trust policy'
          if ! aws iam get-role \
            --role-name qapaq-secops-demo-github-ecr-publisher \
            --query 'Role.{Arn:Arn,Trust:AssumeRolePolicyDocument}' \
            --output json; then
            echo 'Publisher IAM role is absent.'
          fi

          echo '## Publisher role policies'
          aws iam list-attached-role-policies \
            --role-name qapaq-secops-demo-github-ecr-publisher \
            --output json
          aws iam list-role-policies \
            --role-name qapaq-secops-demo-github-ecr-publisher \
            --output json
          aws iam get-role-policy \
            --role-name qapaq-secops-demo-github-ecr-publisher \
            --policy-name publish-demo-ecr-images \
            --query PolicyDocument \
            --output json

          echo '## Phase 2B S3 buckets'
          for bucket in \
            qapaq-secops-demo-raw-955200662475 \
            qapaq-secops-demo-evidence-955200662475 \
            qapaq-secops-demo-artifacts-955200662475; do
            if aws s3api head-bucket --bucket "$bucket" >/dev/null 2>&1; then
              echo "$bucket: present"
            else
              echo "$bucket: absent or inaccessible"
            fi
          done

