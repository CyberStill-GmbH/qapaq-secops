name: Secure QAPAQ API access logs

on:
  workflow_dispatch:
    inputs:
      action:
        description: Apply query-free logging or restore the prior Nginx configuration
        required: true
        type: choice
        options:
          - apply
          - rollback
        default: apply

permissions:
  id-token: write
  contents: read

concurrency:
  group: qapaq-api-no-query-logging
  cancel-in-progress: false

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate script syntax
        run: bash -n infra/aws/scripts/qapaq-api-no-query-logging.sh

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::955200662475:role/qapaq-secops-github-terraform-demo
          aws-region: us-east-1
          role-session-name: qapaq-secops-no-query-logging
          allowed-account-ids: 955200662475

      - name: Apply or roll back Nginx access logging through SSM
        shell: bash
        env:
          ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          case "$ACTION" in
            apply|rollback) ;;
            *) echo 'Unsupported action.' >&2; exit 2 ;;
          esac
          mapfile -t instances < <(aws ec2 describe-instances \
            --filters 'Name=tag:Name,Values=qapaq-secops-demo-wazuh' 'Name=instance-state-name,Values=running' \
            --query 'Reservations[].Instances[].InstanceId' --output text | tr '\t' '\n' | sed '/^$/d')
          if [[ "${#instances[@]}" -ne 1 || -z "${instances[0]}" || "${instances[0]}" == None ]]; then
            echo "Expected exactly one running qapaq-secops-demo-wazuh instance; found ${#instances[@]}." >&2
            exit 1
          fi

          script_b64="$(base64 --wrap=0 infra/aws/scripts/qapaq-api-no-query-logging.sh)"
          remote_command="printf '%s' '${script_b64}' | base64 -d >/tmp/qapaq-api-no-query-logging.sh && chmod 700 /tmp/qapaq-api-no-query-logging.sh && /tmp/qapaq-api-no-query-logging.sh '${ACTION}'"
          parameters="$(jq -cn --arg command "$remote_command" '{commands: [$command]}')"
          command_id="$(aws ssm send-command \
            --instance-ids "${instances[0]}" \
            --document-name AWS-RunShellScript \
            --comment "QAPAQ API query-free access logging: ${ACTION}" \
            --parameters "$parameters" \
            --query 'Command.CommandId' --output text)"

          status=Pending
          for attempt in $(seq 1 60); do
            status="$(aws ssm get-command-invocation --command-id "$command_id" \
              --instance-id "${instances[0]}" --query Status --output text 2>/dev/null || true)"
            case "$status" in
              Success|Failed|Cancelled|TimedOut|Undeliverable|Terminated) break ;;
            esac
            sleep 5
          done
          if [[ "$status" != Success ]]; then
            echo "Nginx logging change ended with status: ${status:-unknown}" >&2
            aws ssm get-command-invocation --command-id "$command_id" \
              --instance-id "${instances[0]}" \
              --query '{Output:StandardOutputContent,Error:StandardErrorContent}' --output json || true
            exit 1
          fi
          aws ssm get-command-invocation --command-id "$command_id" \
            --instance-id "${instances[0]}" --query StandardOutputContent --output text
