name: Terraform Azure plan and apply

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the exact reviewed plan from this run (main or approved Azure demo branch)
        type: boolean
        required: true
        default: false
      deployment_scope:
        description: Select SOC deployment or foundation-only maintenance
        type: choice
        required: true
        default: soc
        options:
          - soc
          - foundation

permissions:
  contents: read

concurrency:
  group: terraform-azure-demo
  cancel-in-progress: false

jobs:
  preflight:
    name: Check branch and apply review inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require main or the approved Azure demo continuation branch
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" || "$GITHUB_REF" == "refs/heads/codex/azure-soc-continuation" ]] || {
            echo '::error::Terraform Azure is restricted to main or codex/azure-soc-continuation.'
            exit 1
          }

  plan:
    name: Create and summarize protected Terraform plan
    needs: [preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: azure-demo
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra/azure
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_TERRAFORM_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
      TF_VAR_postgres_admin_password: ${{ secrets.AZURE_POSTGRES_ADMIN_PASSWORD }}
      # Runtime stays explicitly disabled unless the Azure environment opts in.
      # SIEM and Ankay JSON contain non-secret configuration and Key Vault names;
      # secret values must remain in Key Vault and must never be placed here.
      AZURE_ACR_LOGIN_SERVER: ${{ vars.AZURE_ACR_LOGIN_SERVER }}
      TF_VAR_enable_runtime: ${{ vars.AZURE_ENABLE_RUNTIME || 'false' }}
      TF_VAR_container_images: ${{ secrets.AZURE_CONTAINER_IMAGES_JSON || vars.AZURE_CONTAINER_IMAGES_JSON || '{}' }}
      TF_VAR_siem_host: ${{ secrets.AZURE_SIEM_HOST_JSON || vars.AZURE_SIEM_HOST_JSON || 'null' }}
      TF_VAR_ankay_host: ${{ secrets.AZURE_ANKAY_HOST_JSON || vars.AZURE_ANKAY_HOST_JSON || 'null' }}
      TF_VAR_key_vault_secret_ids: ${{ secrets.AZURE_KEY_VAULT_SECRET_IDS_JSON || vars.AZURE_KEY_VAULT_SECRET_IDS_JSON || '{}' }}
      TF_STATE_RESOURCE_GROUP: ${{ vars.AZURE_TF_STATE_RESOURCE_GROUP }}
      TF_STATE_STORAGE_ACCOUNT: ${{ vars.AZURE_TF_STATE_STORAGE_ACCOUNT }}
      TF_STATE_CONTAINER: ${{ vars.AZURE_TF_STATE_CONTAINER }}
      TF_STATE_KEY: ${{ vars.AZURE_TF_STATE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate OIDC, state backend and Terraform inputs
        shell: bash
        run: |
          set -euo pipefail
          for name in ARM_CLIENT_ID ARM_TENANT_ID ARM_SUBSCRIPTION_ID TF_VAR_postgres_admin_password \
            TF_STATE_RESOURCE_GROUP TF_STATE_STORAGE_ACCOUNT TF_STATE_CONTAINER TF_STATE_KEY; do
            [[ -n "${!name}" ]] || { echo "::error::Missing required GitHub secret or variable: $name"; exit 1; }
          done
          [[ "$TF_STATE_STORAGE_ACCOUNT" =~ ^[a-z0-9]{3,24}$ ]] || { echo '::error::Invalid Azure state storage account name.'; exit 1; }
          [[ "$TF_STATE_CONTAINER" =~ ^[a-z0-9-]{3,63}$ ]] || { echo '::error::Invalid Azure state container name.'; exit 1; }
          if [[ "${{ inputs.apply }}" == true ]]; then
            printf '%s\n' 'Cost estimate: docs/cloud/azure/cost-feasibility-2026-10-20.md (USD 200 is an alert threshold, not a spending cap).' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Validate opt-in Azure runtime configuration without printing inputs
        working-directory: .
        run: node scripts/ci/validate-azure-deployment-inputs.mjs

      - name: Require the QAPAQ SIEM host for an apply
        if: ${{ inputs.apply && inputs.deployment_scope == 'soc' }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const host = JSON.parse(process.env.TF_VAR_siem_host ?? 'null');
          if (host === null) {
            console.error('::error::SOC apply refused: configure AZURE_SIEM_HOST_JSON with the Azure VM, approved ingress CIDRs, SSH public key, release bundle and Key Vault secret names. This is Azure host configuration, not an AWS firewall dependency.');
            process.exit(1);
          }
          NODE

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false

      - name: Check format
        run: terraform fmt -check -recursive

      - name: Initialize the protected Azure Storage backend with OIDC
        shell: bash
        run: |
          set -euo pipefail
          terraform init -input=false -no-color \
            -backend-config="resource_group_name=$TF_STATE_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$TF_STATE_STORAGE_ACCOUNT" \
            -backend-config="container_name=$TF_STATE_CONTAINER" \
            -backend-config="key=$TF_STATE_KEY" \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true"

      - name: Validate
        run: terraform validate -no-color

      - name: Create saved plan
        shell: bash
        run: |
          set -euo pipefail
          terraform plan -input=false -no-color -out="$RUNNER_TEMP/azure.tfplan"
          terraform show -json "$RUNNER_TEMP/azure.tfplan" > "$RUNNER_TEMP/azure-plan.json"

      - name: Reject destructive actions and summarize resource changes
        run: node scripts/ci/azure-tf-plan-summary.mjs "$RUNNER_TEMP/azure-plan.json"
        working-directory: .

      - name: Record commit and checksum
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/plan.commit"
          sha256sum "$RUNNER_TEMP/azure.tfplan" | awk '{print $1}' > "$RUNNER_TEMP/plan.sha256"

      - name: Upload the sensitive saved plan for same-run apply
        if: ${{ inputs.apply }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: azure-tfplan-${{ github.sha }}
          path: |
            ${{ runner.temp }}/azure.tfplan
            ${{ runner.temp }}/plan.commit
            ${{ runner.temp }}/plan.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  apply:
    name: Apply the exact reviewed plan
    if: ${{ inputs.apply }}
    needs: [plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: azure-demo
    permissions:
      actions: read
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra/azure
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_TERRAFORM_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
      TF_VAR_postgres_admin_password: ${{ secrets.AZURE_POSTGRES_ADMIN_PASSWORD }}
      AZURE_ACR_LOGIN_SERVER: ${{ vars.AZURE_ACR_LOGIN_SERVER }}
      TF_VAR_enable_runtime: ${{ vars.AZURE_ENABLE_RUNTIME || 'false' }}
      TF_VAR_container_images: ${{ secrets.AZURE_CONTAINER_IMAGES_JSON || vars.AZURE_CONTAINER_IMAGES_JSON || '{}' }}
      TF_VAR_siem_host: ${{ secrets.AZURE_SIEM_HOST_JSON || vars.AZURE_SIEM_HOST_JSON || 'null' }}
      TF_VAR_ankay_host: ${{ secrets.AZURE_ANKAY_HOST_JSON || vars.AZURE_ANKAY_HOST_JSON || 'null' }}
      TF_VAR_key_vault_secret_ids: ${{ secrets.AZURE_KEY_VAULT_SECRET_IDS_JSON || vars.AZURE_KEY_VAULT_SECRET_IDS_JSON || '{}' }}
      TF_STATE_RESOURCE_GROUP: ${{ vars.AZURE_TF_STATE_RESOURCE_GROUP }}
      TF_STATE_STORAGE_ACCOUNT: ${{ vars.AZURE_TF_STATE_STORAGE_ACCOUNT }}
      TF_STATE_CONTAINER: ${{ vars.AZURE_TF_STATE_CONTAINER }}
      TF_STATE_KEY: ${{ vars.AZURE_TF_STATE_KEY }}
    steps:
      - name: Checkout the exact planned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download this run's saved plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: azure-tfplan-${{ github.sha }}
          path: ${{ runner.temp }}/azure-plan

      - name: Verify commit and saved-plan checksum
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(cat "$RUNNER_TEMP/azure-plan/plan.commit")" == "$GITHUB_SHA" ]] || {
            echo '::error::Saved plan commit does not match this workflow run.'
            exit 1
          }
          expected="$(cat "$RUNNER_TEMP/azure-plan/plan.sha256")"
          actual="$(sha256sum "$RUNNER_TEMP/azure-plan/azure.tfplan" | awk '{print $1}')"
          [[ "$expected" == "$actual" ]] || { echo '::error::Saved Terraform plan checksum mismatch.'; exit 1; }

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false

      - name: Initialize the same protected Azure Storage backend
        shell: bash
        run: |
          set -euo pipefail
          terraform init -input=false -no-color \
            -backend-config="resource_group_name=$TF_STATE_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$TF_STATE_STORAGE_ACCOUNT" \
            -backend-config="container_name=$TF_STATE_CONTAINER" \
            -backend-config="key=$TF_STATE_KEY" \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true"

      - name: Apply only the reviewed saved plan
        run: terraform apply -input=false -auto-approve -no-color "$RUNNER_TEMP/azure-plan/azure.tfplan"
