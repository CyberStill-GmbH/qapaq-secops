name: CI Security

on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: '23 9 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      languages: ${{ steps.inputs.outputs.languages }}
      containers: ${{ steps.inputs.outputs.containers }}
      has_pnpm: ${{ steps.inputs.outputs.has_pnpm }}
      has_containers: ${{ steps.inputs.outputs.has_containers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test input discovery
        working-directory: .github/ci
        run: python3 -m unittest --verbose
      - id: inputs
        run: python3 .github/ci/discover.py

  codeql:
    needs: discover
    if: ${{ needs.discover.outputs.languages != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.discover.outputs.languages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@4bd7200e1f146b1c937cae12d258b50f41a53cf8 # v4.38.0
        with:
          languages: ${{ matrix.language }}
      - name: Analyze source and write SARIF locally
        uses: github/codeql-action/analyze@4bd7200e1f146b1c937cae12d258b50f41a53cf8 # v4.38.0
        with:
          category: /language:${{ matrix.language }}
          output: codeql-results
          upload: never
          upload-database: false
      - name: Preserve CodeQL SARIF evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codeql-${{ matrix.language }}-${{ github.sha }}
          path: codeql-results
          if-no-files-found: error
          retention-days: 30

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: bash .github/ci/install-scanner.sh gitleaks
      - name: Scan full fetched history with redaction
        shell: bash
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP}/gitleaks-report.json"
          if gitleaks git --redact=100 --report-format json --report-path "$report" --exit-code=1 --log-opts="--all" .; then
            echo "No secret findings in fetched history."
          else
            python3 - "$report" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as report_file:
              findings = json.load(report_file)
          for finding in findings:
              print(
                  "Redacted finding:"
                  f" fingerprint={finding.get('Fingerprint', '')}"
                  f" file={finding.get('File', '')}"
                  f" rule={finding.get('RuleID', '')}"
                  f" commit={finding.get('Commit', '')}"
                  f" line={finding.get('StartLine', '')}"
              )
          PY
            exit 1
          fi

  filesystem:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash .github/ci/install-scanner.sh trivy
      - name: Scan filesystem vulnerabilities and misconfigurations
        run: trivy fs --scanners vuln,misconfig --severity HIGH,CRITICAL --exit-code 1 --no-progress .

  pnpm-audit:
    needs: discover
    if: needs.discover.outputs.has_pnpm == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Enable the package manager pinned by package.json
        run: corepack enable
      - name: Audit locked production and development dependencies
        run: pnpm audit --audit-level high

  quality:
    needs: discover
    if: needs.discover.outputs.has_pnpm == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require an explicit application runtime
        run: test -s .nvmrc || { echo 'NOT_CONFIGURED - add .nvmrc for the application'; exit 1; }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Enable the package manager pinned by package.json
        run: corepack enable
      - name: Install locked dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Generate the Prisma client for clean checkout checks
        run: pnpm --filter @qapaq/database generate
      - name: C-24 lifecycle contract and security specs
        run: >-
          pnpm exec vitest run --config vitest.config.ts
          platform/configuration/test/runtime-config.spec.ts
          platform/configuration/test/secret-control-plane.spec.ts
          platform/database/test/c24-secret-metadata.contract.spec.ts
      - name: Run configured project checks (missing checks fail)
        env:
          FORMAT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.event.merge_group.base_sha }}
        run: pnpm run verify

  entrypoints:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Generate the Prisma client for clean checkout checks
        run: pnpm --filter @qapaq/database generate
      - name: C-02 checks without external services
        run: |
          pnpm run typecheck
          pnpm run lint
          pnpm run test:unit
          pnpm run boundaries
          pnpm --filter @qapaq/api... --filter @qapaq/worker... build
          node tests/smoke/build-public-web.mjs
          pnpm run smoke:built
      - name: Verify React startup and recovery in Chromium
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm run test:e2e

  c04-postgres:
    name: C-04 and C-24 PostgreSQL evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec tsc -p scripts/ci/tsconfig.json --noEmit
      - name: Run C-04 and C-24 against digest-pinned PostgreSQL and write evidence
        env:
          TESTCONTAINERS_RYUK_DISABLED: 'true'
        run: pnpm exec tsx scripts/ci/c04-evidence.ts
      - name: Attach redacted C-04 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: c04-postgres-${{ github.sha }}
          path: artifacts/integration/**/environment-evidence.json
          if-no-files-found: error
          retention-days: 30

  c06-base:
    name: C-06 base services evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TESTCONTAINERS_RYUK_DISABLED: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Generate Prisma client for integration tests
        run: pnpm --filter @qapaq/database generate
      - name: Typecheck integration environment
        run: pnpm --filter @qapaq/testing typecheck
      - name: Record Docker runner capacity
        run: docker info --format 'Docker {{.ServerVersion}} · {{.NCPU}} CPU · {{.MemTotal}} bytes RAM'
      - name: Run two isolated PostgreSQL, Redis and MinIO environments
        run: pnpm exec vitest run --config vitest.integration.config.ts platform/testing/test/base-environment.integration.spec.ts --reporter=verbose
      - name: Validate C-11 durable admission with C-06 PostgreSQL and MinIO
        run: pnpm exec vitest run --config vitest.integration.config.ts modules/telemetry/test/admission.integration.spec.ts --reporter=verbose
      - name: Attach redacted C-06 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: c06-base-${{ github.sha }}
          path: artifacts/integration/**/environment-evidence.json
          if-no-files-found: error
          retention-days: 30

  c28-krakend:
    name: C-28 KrakenD config and route contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Install workspace for the C-10 adapter probe
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Route allowlist and security contract
        run: node --test platform/gateway/krakend/test/contract.test.mjs
      - name: Validate Compose input
        run: docker compose --env-file platform/gateway/krakend/.env.example -f platform/gateway/krakend/compose.yaml config --quiet
      - name: Runtime integration with controlled JWKS and Wazuh backend
        run: node platform/gateway/krakend/test/integration.mjs

  containers:
    needs: discover
    if: needs.discover.outputs.has_containers == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify all production container images
        run: bash .github/ci/verify-container-images.sh

  gate:
    name: CI / required
    if: always()
    needs: [discover, codeql, secrets, filesystem, pnpm-audit, quality, entrypoints, c04-postgres, c06-base, c28-krakend, containers]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Enforce all applicable checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          jobs = json.loads(os.environ['RESULTS'])
          required = ['discover', 'codeql', 'secrets', 'filesystem', 'entrypoints', 'c04-postgres', 'c06-base', 'c28-krakend']
          outputs = jobs['discover']['outputs']
          if outputs.get('has_pnpm') == 'true':
              required += ['pnpm-audit', 'quality']
          if outputs.get('has_containers') == 'true':
              required += ['containers']
          failed = [name for name in required if jobs[name]['result'] != 'success']
          if failed:
              raise SystemExit('Failed or missing required checks: ' + ', '.join(failed))
          print('All applicable checks passed. See discovery summary for missing coverage.')
          PY
