name: Terraform Serverless

# Plan/apply de infra/aws-serverless en la cuenta AWS de QAPAQ vía OIDC (sin claves).
# - push a main: plan.
# - workflow_dispatch: plan o apply. El apply corre en el environment "aws-<env>" de GitHub
#   (agregar reviewers ahí para exigir aprobación manual).
#
# Variables de repositorio (Settings → Secrets and variables → Actions → Variables):
#   QAPAQ_AWS_TERRAFORM_ROLE_ARN  arn del rol creado por scripts/bootstrap-github-oidc.sh
#   QAPAQ_AWS_ACCOUNT_ID          cuenta AWS de QAPAQ (allowed-account-ids)
#   QAPAQ_TFSTATE_BUCKET          bucket creado por scripts/bootstrap-state.sh

on:
  push:
    branches:
      - main
    paths:
      - "infra/aws-serverless/**"
      - ".github/workflows/terraform-serverless.yml"
  workflow_dispatch:
    inputs:
      action:
        description: Operación de Terraform
        type: choice
        required: true
        default: plan
        options:
          - plan
          - apply
      environment:
        description: Entorno (environments/<env>.tfvars)
        type: choice
        required: true
        default: dev
        options:
          - dev

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-serverless-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION: us-east-1
  TF_ENV: ${{ inputs.environment || 'dev' }}

jobs:
  plan:
    if: github.event_name == 'push' || inputs.action == 'plan'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: infra/aws-serverless
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.QAPAQ_AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: qapaq-terraform-serverless-plan
          allowed-account-ids: ${{ vars.QAPAQ_AWS_ACCOUNT_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: >
          terraform init
          -backend-config="bucket=${{ vars.QAPAQ_TFSTATE_BUCKET }}"
          -backend-config="key=aws-serverless/${TF_ENV}/terraform.tfstate"
          -backend-config="region=${AWS_REGION}"
          -backend-config="encrypt=true"
          -backend-config="use_lockfile=true"

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        run: |
          terraform plan -var-file="environments/${TF_ENV}.tfvars" -no-color -out=tfplan
          terraform show -no-color tfplan > plan.txt
          {
            echo "### Terraform plan (${TF_ENV})"
            echo '```'
            grep -E '^(Plan:|No changes)' plan.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ env.TF_ENV }}
          path: infra/aws-serverless/plan.txt
          retention-days: 7

  apply:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: aws-${{ inputs.environment }}
    defaults:
      run:
        working-directory: infra/aws-serverless
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.QAPAQ_AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: qapaq-terraform-serverless-apply
          allowed-account-ids: ${{ vars.QAPAQ_AWS_ACCOUNT_ID }}
          role-duration-seconds: 3600

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false

      - name: Terraform Init
        run: >
          terraform init
          -backend-config="bucket=${{ vars.QAPAQ_TFSTATE_BUCKET }}"
          -backend-config="key=aws-serverless/${TF_ENV}/terraform.tfstate"
          -backend-config="region=${AWS_REGION}"
          -backend-config="encrypt=true"
          -backend-config="use_lockfile=true"

      - name: Terraform Apply
        run: terraform apply -var-file="environments/${TF_ENV}.tfvars" -auto-approve -no-color
