name: Sync deploy secrets

# Sprint 5 — carga los secretos del despliegue en AWS Secrets Manager sin exponerlos.
#
# Los valores viven solo en los secretos del environment `demo` de GitHub y viajan por variables
# de entorno del paso a `aws secretsmanager put-secret-value` mediante un archivo temporal con
# permisos 0600 (nunca por argumentos de línea de comandos, tfvars, plan ni state). GitHub
# enmascara cualquier aparición en los logs; además el paso no imprime valores, solo qué
# secreto se actualizó.
#
# Un secreto vacío en GitHub se omite: así se puede cargar uno sin tocar los demás.
#
# Secretos de GitHub (environment `demo`) → Secrets Manager:
#   ENTRA_CLIENT_SECRET           → qapaq-secops/demo/entra/client-secret
#   WAZUH_OFFICE365_CLIENT_SECRET → qapaq-secops/demo/wazuh/office365-client-secret
#   WAZUH_BREAK_GLASS_UPNS        → qapaq-secops/demo/wazuh/break-glass-identities
#   TEAMS_WORKFLOW_URL            → qapaq-secops/demo/teams/workflow-url
#
# Las credenciales que genera la plataforma (lector del Indexer, usuarios del Dashboard, CA del
# proxy, roles de PostgreSQL, clave de referencias) no pasan por aquí: se crean en AWS y nunca
# salen de AWS.

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: sync-deploy-secrets
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: demo
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::955200662475:role/qapaq-secops-github-terraform-demo
          aws-region: us-east-1
          role-session-name: qapaq-secops-sync-secrets
          allowed-account-ids: 955200662475

      - name: Put secrets
        shell: bash
        env:
          ENTRA_CLIENT_SECRET: ${{ secrets.ENTRA_CLIENT_SECRET }}
          WAZUH_OFFICE365_CLIENT_SECRET: ${{ secrets.WAZUH_OFFICE365_CLIENT_SECRET }}
          WAZUH_BREAK_GLASS_UPNS: ${{ secrets.WAZUH_BREAK_GLASS_UPNS }}
          TEAMS_WORKFLOW_URL: ${{ secrets.TEAMS_WORKFLOW_URL }}
        run: |
          set -euo pipefail
          umask 077
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          put() { # variable secret-id
            local value="${!1:-}"
            if [[ -z "$value" ]]; then
              echo "omitido: $2 (sin valor en GitHub)"
              return
            fi
            printf '%s' "$value" >"$work/value"
            aws secretsmanager put-secret-value --secret-id "$2" \
              --secret-string "file://$work/value" --query 'VersionId' --output text >/dev/null
            rm -f "$work/value"
            echo "actualizado: $2"
          }
          put ENTRA_CLIENT_SECRET qapaq-secops/demo/entra/client-secret
          put WAZUH_OFFICE365_CLIENT_SECRET qapaq-secops/demo/wazuh/office365-client-secret
          put WAZUH_BREAK_GLASS_UPNS qapaq-secops/demo/wazuh/break-glass-identities
          put TEAMS_WORKFLOW_URL qapaq-secops/demo/teams/workflow-url
