<!-- QAPAQ SOC · política de agente: linux-servers (docs/16-politicas.md).
     Administrado por wazuh/manager/policy/apply-agent-groups.sh; no editar en el manager.
     Base: infra/wazuh/launch-detections/agent-groups/linux-pilot.agent.conf.
     Presupuesto de recursos: FIM programado cada 12 h con prioridad baja y tope de EPS; tiempo
     real solo en rutas de persistencia/credenciales que cambian poco. -->
<agent_config os="Linux">

  <labels>
    <label key="qapaq.policy">linux-servers</label>
  </labels>

  <!-- FIM -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
    <scan_on_start>yes</scan_on_start>
    <skip_nfs>yes</skip_nfs>
    <skip_dev>yes</skip_dev>
    <skip_proc>yes</skip_proc>
    <skip_sys>yes</skip_sys>
    <process_priority>10</process_priority>
    <max_eps>50</max_eps>
    <synchronization>
      <enabled>yes</enabled>
      <interval>5m</interval>
      <max_eps>10</max_eps>
    </synchronization>

    <!-- Tiempo real con who-data (auditd): persistencia, acceso remoto, privilegios y PAM. El evento
         trae quién (audit.login_user, proceso y PID) cambió el archivo. Sin auditd el agente cae solo
         a realtime (inotify). Ver docs/18-visibilidad-de-red-y-capacidades-wazuh.md. -->
    <directories check_all="yes" whodata="yes">/etc/ssh</directories>
    <directories check_all="yes" whodata="yes">/etc/sudoers,/etc/sudoers.d</directories>
    <directories check_all="yes" whodata="yes">/etc/pam.d</directories>
    <directories check_all="yes" whodata="yes">/etc/passwd,/etc/group,/etc/shadow,/etc/gshadow</directories>
    <directories check_all="yes" whodata="yes">/etc/crontab,/etc/cron.d,/etc/cron.daily,/etc/cron.hourly,/etc/cron.weekly,/etc/cron.monthly</directories>
    <directories check_all="yes" whodata="yes">/etc/systemd/system</directories>
    <directories check_all="yes" whodata="yes">/etc/audit/rules.d,/etc/audit/auditd.conf</directories>
    <directories check_all="yes" whodata="yes">/root/.ssh</directories>
    <directories check_all="yes" whodata="yes">/home/*/.ssh</directories>
    <directories check_all="yes" whodata="yes">/opt/qapaq/secrets</directories>
    <!-- Contenido sensible: se vigila quién lo toca, nunca se guarda la diferencia. -->
    <nodiff>/opt/qapaq/secrets</nodiff>

    <!-- Programado (cada 12 h): configuración y binarios del sistema. -->
    <directories check_all="yes">/etc</directories>
    <directories check_all="yes">/usr/bin,/usr/sbin,/bin,/sbin</directories>
    <directories check_all="yes">/boot</directories>

    <!-- Ruido conocido (cambia en operación normal). -->
    <ignore>/etc/mtab</ignore>
    <ignore>/etc/hosts.deny</ignore>
    <ignore>/etc/mail/statistics</ignore>
    <ignore>/etc/random-seed</ignore>
    <ignore>/etc/random.seed</ignore>
    <ignore>/etc/adjtime</ignore>
    <ignore>/etc/httpd/logs</ignore>
    <ignore>/etc/utmpx</ignore>
    <ignore>/etc/wtmpx</ignore>
    <ignore>/etc/cups/certs</ignore>
    <ignore>/etc/dumpdates</ignore>
    <ignore>/etc/svc/volatile</ignore>
    <ignore>/etc/resolv.conf</ignore>
    <ignore>/etc/ld.so.cache</ignore>
    <ignore type="sregex">.log$|.swp$|.tmp$|~$</ignore>
    <!-- Nunca guardar diferencias de material secreto. -->
    <nodiff>/etc/ssl/private.key</nodiff>
    <nodiff>/etc/shadow</nodiff>
    <nodiff>/etc/gshadow</nodiff>
  </syscheck>

  <!-- Rootcheck (anomalías y rootkits conocidos) -->
  <rootcheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
    <check_files>yes</check_files>
    <check_trojans>yes</check_trojans>
    <check_dev>yes</check_dev>
    <check_sys>yes</check_sys>
    <check_pids>yes</check_pids>
    <check_ports>yes</check_ports>
    <check_if>yes</check_if>
    <skip_nfs>yes</skip_nfs>
    <!-- Capas overlay de Docker/containerd: cambian mientras check_sys las recorre y disparan la
         regla 521 («Possible kernel level rootkit») como falso positivo en cada pasada. -->
    <ignore type="sregex">^/var/lib/docker/</ignore>
    <ignore type="sregex">^/var/lib/containerd/</ignore>
  </rootcheck>

  <!-- SCA: el agente elige el benchmark CIS que Wazuh trae para su distro
       (cis_ubuntu24-04, cis_amazon_linux_2023, cis_rhel9, ...). -->
  <sca>
    <enabled>yes</enabled>
    <scan_on_start>yes</scan_on_start>
    <interval>12h</interval>
    <skip_nfs>yes</skip_nfs>
  </sca>

  <!-- Inventario: alimenta la detección de vulnerabilidades del manager (paquetes). -->
  <wodle name="syscollector">
    <disabled>no</disabled>
    <!-- 1 h: paquetes (detección de vulnerabilidades), interfaces, procesos y TODOS los puertos
         (all="yes" incluye conexiones establecidas: IT Hygiene → Puertos muestra con quién habla el
         host). El estado se sincroniza por diferencias: el costo es el de los cambios, no el total. -->
    <interval>1h</interval>
    <scan_on_start>yes</scan_on_start>
    <hardware>yes</hardware>
    <os>yes</os>
    <network>yes</network>
    <packages>yes</packages>
    <ports all="yes">yes</ports>
    <processes>yes</processes>
    <users>yes</users>
    <groups>yes</groups>
    <services>yes</services>
    <synchronization>
      <max_eps>10</max_eps>
    </synchronization>
  </wodle>

  <!-- Logs de autenticación desde journald (presente en Ubuntu, Debian, RHEL y Amazon Linux 2023;
       no se asume /var/log/auth.log ni /var/log/secure). Filtrado a los procesos de acceso para
       acotar volumen. El resto del sistema lo cubre la configuración local del agente. -->
  <localfile>
    <location>journald</location>
    <log_format>journald</log_format>
    <filter field="_COMM">^(sshd|sudo|su|login|systemd-logind|useradd|userdel|usermod|groupadd|groupdel|passwd|chpasswd|chage)$</filter>
  </localfile>

  <!-- Canario sintético del agente (qapaq_canary.py, `logger -t qapaq-canary`, regla 101835 nivel 3).
       Bloque aparte: Wazuh une los bloques journald con OR, así solo entra esta etiqueta y no todo
       `logger` del host. Sin él el filtro por _COMM descartaba el canario y «agent» daba missing. -->
  <localfile>
    <location>journald</location>
    <log_format>journald</log_format>
    <filter field="SYSLOG_IDENTIFIER">^qapaq-canary$</filter>
  </localfile>

  <!-- ===================== Visibilidad de red (docs/18) ===================== -->
  <!-- Requiere en el agente logcollector.remote_commands=1 (local_internal_options.conf): lo deja
       infra/wazuh/network/agent/install-linux-network-visibility.sh. Sin eso el agente ignora estos
       bloques y lo avisa en su ossec.log; el resto de la política sigue funcionando. -->

  <!-- Foto de puertos en escucha (proceso dueño, sin PIDs) cada 5 min; la regla QAPAQ 101800
       (check_diff, misma lógica que la 533 oficial) avisa cuando cambia. -->
  <localfile>
    <log_format>full_command</log_format>
    <command>sh /var/ossec/etc/shared/qapaq-netconn.sh listen</command>
    <alias>qapaq listening ports</alias>
    <frequency>300</frequency>
  </localfile>

  <!-- Escuchas y conexiones TCP establecidas NUEVAS (una línea por flujo, sin repetir los que
       siguen abiertos) cada 2 min: reglas 101801-101809 y listas de reputación 101860+. -->
  <localfile>
    <log_format>command</log_format>
    <command>sh /var/ossec/etc/shared/qapaq-netconn.sh events</command>
    <alias>qapaq-netconn</alias>
    <frequency>120</frequency>
  </localfile>

  <!-- auditd: connect/bind/accept de sesiones interactivas y herramientas de red
       (qapaq-audit-network.rules, distribuido con este grupo) + eventos who-data de FIM. -->
  <localfile>
    <log_format>audit</log_format>
    <location>/var/log/audit/audit.log</location>
  </localfile>

</agent_config>
