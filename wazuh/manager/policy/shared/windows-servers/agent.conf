<!-- QAPAQ SOC · política de agente: windows-servers (docs/16-politicas.md).
     Administrado por wazuh/manager/policy/apply-agent-groups.sh; no editar en el manager.
     Base: infra/wazuh/launch-detections/agent-groups/windows-pilot.agent.conf.
     Sysmon y PowerShell Operational NO se recogen aquí: están en el grupo opt-in
     windows-telemetry-extended (gate de privacidad, ver infra/wazuh/active-directory/README.md). -->
<agent_config os="Windows">

  <labels>
    <label key="qapaq.policy">windows-servers</label>
  </labels>

  <!-- FIM -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
    <scan_on_start>yes</scan_on_start>
    <max_eps>50</max_eps>
    <windows_audit_interval>300</windows_audit_interval>
    <synchronization>
      <enabled>yes</enabled>
      <interval>5m</interval>
      <max_eps>10</max_eps>
    </synchronization>

    <!-- Tiempo real: persistencia. -->
    <directories check_all="yes" realtime="yes">C:\Windows\System32\Tasks</directories>
    <directories check_all="yes" realtime="yes">%PROGRAMDATA%\Microsoft\Windows\Start Menu\Programs\Startup</directories>
    <directories check_all="yes" realtime="yes">C:\Windows\System32\GroupPolicy\Machine\Scripts</directories>

    <!-- Programado (cada 12 h). -->
    <directories check_all="yes">C:\Windows\System32\drivers\etc</directories>
    <directories check_all="yes">C:\Windows\System32\WindowsPowerShell\v1.0\Profile.ps1</directories>
    <directories check_all="yes" recursion_level="0">C:\Windows\System32</directories>
    <directories check_all="yes" recursion_level="0">C:\Windows\SysWOW64</directories>
    <directories check_all="yes">C:\inetpub\wwwroot</directories>

    <!-- Registro: autoarranque, servicios, Winlogon y LSA. -->
    <windows_registry arch="both">HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\Run</windows_registry>
    <windows_registry arch="both">HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\RunOnce</windows_registry>
    <windows_registry arch="both">HKEY_LOCAL_MACHINE\Software\Microsoft\Windows NT\CurrentVersion\Winlogon</windows_registry>
    <windows_registry arch="both">HKEY_LOCAL_MACHINE\Software\Microsoft\Windows NT\CurrentVersion\Image File Execution Options</windows_registry>
    <windows_registry>HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Lsa</windows_registry>
    <windows_registry>HKEY_LOCAL_MACHINE\System\CurrentControlSet\Services</windows_registry>
    <windows_registry>HKEY_LOCAL_MACHINE\Security</windows_registry>

    <!-- Ruido conocido. -->
    <ignore>C:\Windows\System32\LogFiles</ignore>
    <ignore>C:\Windows\System32\wdi</ignore>
    <ignore>C:\Windows\System32\config</ignore>
    <ignore type="sregex">.log$|.htm$|.jpg$|.png$|.chm$|.pnf$|.evtx$|.etl$|.tmp$</ignore>
    <registry_ignore>HKEY_LOCAL_MACHINE\Security\Policy\Secrets</registry_ignore>
    <registry_ignore>HKEY_LOCAL_MACHINE\Security\SAM\Domains\Account\Users</registry_ignore>
    <registry_ignore type="sregex">\Enum$</registry_ignore>
    <registry_ignore>HKEY_LOCAL_MACHINE\System\CurrentControlSet\Services\MpKslDrv</registry_ignore>
    <registry_ignore>HKEY_LOCAL_MACHINE\System\CurrentControlSet\Services\WinDefend</registry_ignore>
    <registry_ignore>HKEY_LOCAL_MACHINE\System\CurrentControlSet\Services\bam\State\UserSettings</registry_ignore>
  </syscheck>

  <!-- Rootcheck: chequeos de política de Windows que trae el agente. -->
  <rootcheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
    <windows_apps>./shared/win_applications_rcl.txt</windows_apps>
    <windows_malware>./shared/win_malware_rcl.txt</windows_malware>
  </rootcheck>

  <!-- SCA: el agente elige el CIS de su versión (cis_win2019, cis_win2022, ...). -->
  <sca>
    <enabled>yes</enabled>
    <scan_on_start>yes</scan_on_start>
    <interval>12h</interval>
  </sca>

  <!-- Inventario (paquetes y hotfixes alimentan la detección de vulnerabilidades). -->
  <wodle name="syscollector">
    <disabled>no</disabled>
    <interval>6h</interval>
    <scan_on_start>yes</scan_on_start>
    <hardware>yes</hardware>
    <os>yes</os>
    <network>yes</network>
    <packages>yes</packages>
    <hotfixes>yes</hotfixes>
    <ports all="no">yes</ports>
    <processes>yes</processes>
    <synchronization>
      <max_eps>10</max_eps>
    </synchronization>
  </wodle>

  <!-- Canales de eventos. Security con el filtro por defecto de Wazuh (descarta auditoría de
       objetos y de la plataforma de filtrado: alto volumen sin regla consumidora). Los eventos
       que usan las reglas QAPAQ de AD (4662, 4719, 4728/4732/4756, 4768/4769/4771, 5136/5137/5141,
       1102) NO están en la exclusión. -->
  <localfile>
    <location>Security</location>
    <log_format>eventchannel</log_format>
    <query>Event/System[EventID != 5145 and EventID != 5156 and EventID != 5447 and EventID != 4656 and EventID != 4658 and EventID != 4663 and EventID != 4660 and EventID != 4670 and EventID != 4690 and EventID != 4703 and EventID != 4907 and EventID != 5152 and EventID != 5157]</query>
  </localfile>
  <localfile>
    <location>System</location>
    <log_format>eventchannel</log_format>
  </localfile>
  <localfile>
    <location>Application</location>
    <log_format>eventchannel</log_format>
  </localfile>
  <localfile>
    <location>Microsoft-Windows-Windows Defender/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

</agent_config>
