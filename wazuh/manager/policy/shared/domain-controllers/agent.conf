<!-- QAPAQ SOC · política de agente: domain-controllers (docs/16-politicas.md).
     Administrado por wazuh/manager/policy/apply-agent-groups.sh; no editar en el manager.
     Se asigna JUNTO con windows-servers (multigrupo: windows-servers,domain-controllers): aquí solo
     va lo propio del DC. Base: infra/wazuh/active-directory/agent-groups/windows-domain-controller.agent.conf
     y la matriz de infra/wazuh/active-directory/profile-catalog.json: las reglas AD consumen el canal
     Security (ya lo recoge windows-servers); Directory Service, DNS Server, Group Policy y
     PowerShell quedan fuera hasta que exista una regla consumidora aprobada. -->
<agent_config os="Windows">

  <labels>
    <label key="qapaq_profile">active-directory-pilot</label>
    <label key="qapaq.policy">domain-controllers</label>
  </labels>

  <syscheck>
    <!-- SYSVOL replica scripts y GPO: programado, no en tiempo real (la replicación DFSR
         generaría ráfagas). NTDS.dit y los logs de la base AD no se vigilan: cambian siempre. -->
    <directories check_all="yes">C:\Windows\SYSVOL\domain\Policies</directories>
    <directories check_all="yes">C:\Windows\SYSVOL\domain\scripts</directories>
    <ignore>C:\Windows\NTDS</ignore>
    <ignore type="sregex">\\DfsrPrivate\\</ignore>
    <windows_registry>HKEY_LOCAL_MACHINE\System\CurrentControlSet\Services\NTDS\Parameters</windows_registry>
    <windows_registry>HKEY_LOCAL_MACHINE\System\CurrentControlSet\Services\Netlogon\Parameters</windows_registry>
    <windows_registry>HKEY_LOCAL_MACHINE\System\CurrentControlSet\Services\Kdc</windows_registry>
  </syscheck>

</agent_config>
