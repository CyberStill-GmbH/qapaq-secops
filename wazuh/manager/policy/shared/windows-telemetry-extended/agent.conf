<!-- QAPAQ SecOps · política de agente OPT-IN: windows-telemetry-extended (docs/16-politicas.md).
     Administrado por wazuh/manager/policy/apply-agent-groups.sh; el grupo se crea VACÍO.
     GATE: Sysmon Event ID 1 y PowerShell 4104 pueden contener líneas de comando y contenido de
     scripts (datos personales/secretos). Asignar un agente a este grupo requiere aprobación de
     privacidad/retención (Ley 29733, N2) y una configuración Sysmon revisada
     (infra/wazuh/active-directory/README.md, infra/wazuh/endpoint/README.md).
     Se asigna como grupo adicional: windows-servers,windows-telemetry-extended.
     Incluye la telemetría de red de endpoints (Sysmon 3/22, WFP 5156/5157, pfirewall.log): destinos,
     puertos y proceso de cada conexión son metadatos personales en estaciones de trabajo. -->
<agent_config os="Windows">

  <labels>
    <label key="qapaq.telemetry">extended</label>
  </labels>

  <!-- Sysmon (solo si está instalado): proceso (1), red (3), driver (6), acceso a LSASS y otros
       (10), creación de archivo ejecutable (11/29), registro (12/13), DNS (22), manipulación (25). -->
  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
    <query>Event/System[EventID = 1 or EventID = 3 or EventID = 6 or EventID = 10 or EventID = 11 or EventID = 12 or EventID = 13 or EventID = 22 or EventID = 25 or EventID = 29]</query>
  </localfile>

  <!-- PowerShell: Script Block Logging (4104) y carga de motor (400). -->
  <localfile>
    <location>Microsoft-Windows-PowerShell/Operational</location>
    <log_format>eventchannel</log_format>
    <query>Event/System[EventID = 4104]</query>
  </localfile>
  <localfile>
    <location>Windows PowerShell</location>
    <log_format>eventchannel</log_format>
    <query>Event/System[EventID = 400]</query>
  </localfile>

  <!-- ===================== Visibilidad de red (docs/18) ===================== -->
  <!-- Sysmon 3 (conexión de red con proceso, usuario y destino) y 22 (consulta DNS) ya están en el
       bloque de Sysmon de arriba. Las reglas QAPAQ 101880-101889 los cruzan con las listas de reputación.

       Windows Filtering Platform: 5156 (conexión permitida) y 5157 (bloqueada). Los grupos base los
       excluyen del canal Security por volumen. Aquí se suscriben aparte con la ubicación en minúsculas:
       logcollector descarta un <localfile> cuya ubicación coincide EXACTAMENTE con otro (strcmp en
       remove_duplicates) y quedaría solo uno de los dos filtros; el nombre del canal de Windows no
       distingue mayúsculas, así que «security» es la misma bitácora con una segunda consulta.
       Requiere la subcategoría de auditoría «Filtering Platform Connection» (auditpol) habilitada. -->
  <localfile>
    <location>security</location>
    <log_format>eventchannel</log_format>
    <query>Event/System[EventID = 5156 or EventID = 5157]</query>
  </localfile>

  <!-- Bitácora del Firewall de Windows (habilitar por GPO: registrar paquetes descartados y
       conexiones correctas, tamaño 16 MB). Decoder qapaq-winfw. -->
  <localfile>
    <location>%SystemRoot%\System32\LogFiles\Firewall\pfirewall.log</location>
    <log_format>syslog</log_format>
  </localfile>

</agent_config>
