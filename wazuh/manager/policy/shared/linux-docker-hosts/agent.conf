<!-- QAPAQ SOC · política de agente: linux-docker-hosts (docs/16-politicas.md, docs/18).
     Administrado por wazuh/manager/policy/apply-agent-groups.sh; no editar en el manager.
     Grupo ADICIONAL para hosts Linux que corren Docker (el nodo del SOC, agente 001):
     linux-servers,linux-docker-hosts. Requiere el módulo Python `docker` en el agente
     (infra/wazuh/network/agent/install-linux-network-visibility.sh lo instala). -->
<agent_config os="Linux">

  <labels>
    <label key="qapaq.runtime">docker</label>
  </labels>

  <!-- Docker listener: eventos del daemon (create/start/stop/die, exec_start, pull, network
       connect/disconnect, volume mount). Alimenta la vista Docker de la app de Wazuh y las reglas
       oficiales 87900-87999 + QAPAQ 101850-101852. -->
  <wodle name="docker-listener">
    <disabled>no</disabled>
    <interval>10m</interval>
    <attempts>5</attempts>
    <run_on_start>yes</run_on_start>
  </wodle>

</agent_config>
