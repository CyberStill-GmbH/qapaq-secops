# QAPAQ edge: una URL y un login para el dashboard (fork qapaq_ops) y la API QAPAQ.
# docs/04-identidad-y-acceso.md. Alineado con wazuh-dashboard-src:qapaq/deploy/nginx/qapaq-dashboard.conf
# (misma allowlist y mismas rutas públicas), pero sin KrakenD: /api va directo a la API QAPAQ.
#
#   navegador ──TLS──▶ nginx ──▶ OSD fork QAPAQ (127.0.0.1:5601)
#                          └───▶ API QAPAQ (${QAPAQ_API}, ALB interno o Cloud Map)
#
# Invariantes:
#  - x-proxy-user / x-proxy-roles las escribe SIEMPRE nginx (vacías en rutas públicas). nginx no
#    hereda proxy_set_header si el location define alguno, así que cada location las fija.
#  - /api/* NO es todo de QAPAQ: OSD y el plugin de Wazuh tienen sus propias /api/* (saved_objects,
#    status, ...). Solo la allowlist de prefijos QAPAQ va a la API.
#  - X-Forwarded-For se sobrescribe con $remote_addr.
# Lo renderiza y aplica wazuh/edge/apply-edge.sh (envsubst de SOC_HOSTNAME, QAPAQ_API, CERT_NAME).
# QAPAQ_API = origen privado SIN ruta (p. ej. http://api.demo.qapaq.internal:3000): va dentro de
# locations regex, donde nginx no admite URI en proxy_pass.

proxy_cache_path /var/cache/nginx/qapaq_auth levels=1 keys_zone=qapaq_auth:10m max_size=50m inactive=60s;

upstream qapaq_osd {
  server 127.0.0.1:5601;
  keepalive 16;
}

# ¿Navegación de documento (redirige al login) o petición de datos (401 JSON)?
map $http_accept $qapaq_wants_html {
  default 0;
  "~*text/html" 1;
}

server {
  listen 80;
  server_name ${SOC_HOSTNAME};
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  http2 on;
  server_name ${SOC_HOSTNAME};
  ssl_certificate     /etc/letsencrypt/live/${CERT_NAME}/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/${CERT_NAME}/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  server_tokens off;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  client_max_body_size 50m;
  proxy_http_version 1.1;
  proxy_set_header Connection "";

  # --- API QAPAQ en el mismo origen: solo sus prefijos ------------------------------------
  # `events` no está: la búsqueda de eventos es Discover. `notifications` va aparte (abajo)
  # porque el plugin Notifications de OSD usa /api/notifications/*.
  location ~ ^/api/(auth|alerts|incidents|changes|sources|operations|audit|admin|me)(/|$) {
    proxy_pass ${QAPAQ_API};
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Sec-Fetch-Site $http_sec_fetch_site;
    proxy_set_header x-proxy-user "";
    proxy_set_header x-proxy-roles "";
    proxy_buffering off;      # long-poll y SSE de /api/changes
    proxy_read_timeout 65s;
  }

  # Solo las rutas exactas de la bandeja QAPAQ: GET /api/notifications y
  # POST /api/notifications/<uuid>/acknowledge. El resto de /api/notifications/* (get_configs,
  # create_config, ...) sigue al plugin Notifications de OSD. /drain es operación interna.
  location ~ ^/api/notifications(/[0-9a-fA-F-]{36}/acknowledge)?$ {
    proxy_pass ${QAPAQ_API};
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Sec-Fetch-Site $http_sec_fetch_site;
    proxy_set_header x-proxy-user "";
    proxy_set_header x-proxy-roles "";
  }

  # --- Introspección de la sesión (subpetición interna de auth_request) -------------------
  location = /_qapaq/introspect {
    internal;
    proxy_pass ${QAPAQ_API}/api/auth/introspect;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Accept "application/json";
    proxy_set_header Origin https://$host;    # resolveActor valida el origen
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header x-proxy-user "";
    proxy_set_header x-proxy-roles "";
    # La API responde no-store; el edge cachea 5 s por cookie igual (revocación ≤ 5 s).
    proxy_cache          qapaq_auth;
    proxy_cache_key      $cookie_qapaq_session;
    proxy_cache_valid    204 5s;
    proxy_cache_valid    401 403 0;
    proxy_ignore_headers Cache-Control Expires Set-Cookie;
  }

  # --- Rutas públicas del dashboard: login/logout QAPAQ (plugin qapaq_ops) y estáticos -----
  location ^~ /qapaq/ {
    proxy_pass http://qapaq_osd;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header x-proxy-user "";
    proxy_set_header x-proxy-roles "";
  }

  location ^~ /ui/ {
    proxy_pass http://qapaq_osd;
    proxy_set_header Host $host;
    proxy_set_header x-proxy-user "";
    proxy_set_header x-proxy-roles "";
  }

  # El login de Wazuh / Security plugin no existe: siempre el de QAPAQ.
  location = /app/login {
    return 302 /qapaq/login$is_args$args;
  }

  # --- Todo lo demás: dashboard autenticado por la sesión QAPAQ ---------------------------
  location / {
    auth_request /_qapaq/introspect;
    auth_request_set $qapaq_user  $upstream_http_x_qapaq_user;
    auth_request_set $qapaq_roles $upstream_http_x_qapaq_roles;
    error_page 401 = @qapaq_sign_in;
    error_page 403 = @qapaq_forbidden;

    proxy_pass http://qapaq_osd;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header x-proxy-user  $qapaq_user;
    proxy_set_header x-proxy-roles $qapaq_roles;
    proxy_read_timeout 120s;
  }

  location @qapaq_sign_in {
    # `nextUrl` va último y en crudo: el login QAPAQ lo lee así (rawNextUrl) y lo valida.
    if ($qapaq_wants_html) {
      return 302 /qapaq/login?nextUrl=$request_uri;
    }
    default_type application/json;
    return 401 '{"code":"AUTH_REQUIRED"}';
  }

  location @qapaq_forbidden {
    if ($qapaq_wants_html) {
      return 302 /qapaq/login?authError=NETWORK_NOT_ALLOWED;
    }
    default_type application/json;
    return 403 '{"code":"NETWORK_NOT_ALLOWED"}';
  }
}
