# QAPAQ edge: una URL y un login (docs/04-identidad-y-acceso.md).
# Va en /etc/nginx/conf.d/ del host Wazuh. Sustituir los ${...} al aplicar (envsubst).
#   ${SOC_HOSTNAME}  dominio público de la plataforma
#   ${QAPAQ_API}     URL interna de la API QAPAQ (ALB interno o Cloud Map), p. ej. https://api.internal:443
# Verificar con `nginx -t` antes de recargar.

proxy_cache_path /var/cache/nginx/qapaq_auth levels=1 keys_zone=qapaq_auth:10m max_size=50m inactive=60s;

upstream wazuh_dashboard { server 127.0.0.1:5601; keepalive 16; }

server {
  listen 443 ssl;
  http2 on;
  server_name ${SOC_HOSTNAME};
  ssl_certificate     /etc/letsencrypt/live/${SOC_HOSTNAME}/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/${SOC_HOSTNAME}/privkey.pem;
  server_tokens off;
  add_header Strict-Transport-Security "max-age=31536000" always;

  # Las cabeceras de identidad las pone SOLO este proxy. nginx no hereda proxy_set_header si
  # el location define alguno, así que cada location las vacía o las fija explícitamente.

  # --- Introspección de la sesión QAPAQ (subrequest interna) ---
  location = /_qapaq_introspect {
    internal;
    proxy_pass              ${QAPAQ_API}/api/auth/introspect;
    proxy_pass_request_body off;
    proxy_set_header        Content-Length "";
    proxy_set_header        Cookie $http_cookie;
    proxy_set_header        Host $host;
    proxy_set_header        Origin https://$host;          # resolveActor valida el origen
    proxy_set_header        X-Forwarded-For $remote_addr;
    proxy_set_header        X-Forwarded-Proto https;
    proxy_set_header        x-proxy-user  "";
    proxy_set_header        x-proxy-roles "";
    # La API responde no-store; el edge cachea 5 s por cookie igual (revocación ≤ 5 s).
    proxy_cache             qapaq_auth;
    proxy_cache_key         $cookie_qapaq_session;
    proxy_cache_valid       204 5s;
    proxy_cache_valid       401 403 0;
    proxy_ignore_headers    Cache-Control Expires Set-Cookie;
  }

  # --- API QAPAQ (incluye /api/auth/start y /api/auth/callback; sin auth_request) ---
  location /api/ {
    proxy_pass         ${QAPAQ_API};
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Forwarded-For $remote_addr;
    proxy_set_header   X-Forwarded-Proto https;
    proxy_set_header   x-proxy-user  "";
    proxy_set_header   x-proxy-roles "";
    proxy_buffering    off;            # long-poll y SSE de /api/changes
    proxy_read_timeout 65s;
  }

  # --- Consola de casos QAPAQ (build de apps/web) ---
  location /soc/ {
    auth_request /_qapaq_introspect;
    error_page 401 = @login;
    alias /usr/share/qapaq-web/;
    try_files $uri $uri/ /soc/index.html;
  }

  # --- Wazuh Dashboard con proxy auth ---
  location / {
    auth_request /_qapaq_introspect;
    auth_request_set $qapaq_user  $upstream_http_x_qapaq_user;
    auth_request_set $qapaq_roles $upstream_http_x_qapaq_roles;
    error_page 401 = @login;
    error_page 403 = @forbidden;

    proxy_pass         http://wazuh_dashboard;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Forwarded-For $remote_addr;
    proxy_set_header   x-proxy-user  $qapaq_user;
    proxy_set_header   x-proxy-roles $qapaq_roles;
  }

  location @login     { return 302 /api/auth/start?returnTo=$request_uri; }
  location @forbidden { return 302 /soc/?accessNotice=forbidden; }
}

server {
  listen 80;
  server_name ${SOC_HOSTNAME};
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}
