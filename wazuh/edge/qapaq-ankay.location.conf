  location = /ankay {
    return 308 /ankay/;
  }

  location ^~ /ankay/ {
    auth_request /_qapaq/introspect;
    error_page 401 = @qapaq_sign_in;
    error_page 403 = @qapaq_forbidden;

    proxy_pass http://${ANKAY_UPSTREAM}/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Prefix /ankay;
    proxy_read_timeout 300s;
    proxy_buffering off;
    proxy_set_header Accept-Encoding "";
    sub_filter 'href="/' 'href="/ankay/';
    sub_filter 'src="/' 'src="/ankay/';
    sub_filter 'href:"/' 'href:"/ankay/';
    sub_filter '/static/' '/ankay/static/';
    sub_filter '/images/' '/ankay/images/';
    sub_filter_types text/html text/css application/javascript application/json;
    sub_filter_once off;
  }
