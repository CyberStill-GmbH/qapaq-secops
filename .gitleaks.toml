title = "QAPAQ SecOps secret scanning"

[extend]
useDefault = true

[[allowlists]]
description = "Public Go checksum from SumDB for golang.org/x/oauth2 v0.36.0; narrowly scoped to this checksum line in the generated dependency patch."
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''(^|/)ankay/runtime/shuffle-runtime-security-upgrades\.patch$''']
regexTarget = "match"
regexes = ['''^oauth2 v0\.36\.0 h1:peZ/1z27fi9hUOFCAZaHyrpWG5lwe0RJEEEeH0ThlIs=$''']

[[allowlists]]
description = "Public SHA-256 digest for the official Wazuh signing key; scoped to the release workflow commit and file."
condition = "AND"
targetRules = ["generic-api-key"]
commits = [
  "6429e91569f31b06fb625125c9a399541548da0d",
  "f599adf7591cc0adab34d5f43a355073d23f909d",
]
paths = ['''(^|/)\.github/workflows/azure-siem-release-bundle\.yml$''']

[[allowlists]]
description = "False positive from the product name Valkey-compatible in an Azure cost feasibility paragraph; scoped to the historical finding commit and document."
condition = "AND"
targetRules = ["generic-api-key"]
commits = ["e93fc79b935b807a7ec3437fecb95be4ff741fdb"]
paths = ['''(^|/)docs/cloud/azure/cost-feasibility-2026-10-22\.md$''']

[[allowlists]]
description = "Public Go module SHA-256 sums embedded in the Moby v29 backend migration patch; scoped to its commit and dependency patch files."
condition = "AND"
targetRules = ["generic-api-key"]
commits = ["79a1964f31fde18d5ba7db1f0eafd0ea3a4366f3"]
paths = [
  '''(^|/)ankay/runtime/shuffle-runtime-moby-v29\.patch$''',
  '''(^|/)ankay/runtime/shuffle-shared-moby-v29\.patch$''',
]
regexTarget = "match"
regexes = ['''^((.+)?h1:)?[A-Za-z0-9+/]{43}=$''']

[[allowlists]]
description = "Public Go module SHA-256 sums embedded in the Moby v29 worker migration patch; scoped to its commit and dependency patch file."
condition = "AND"
targetRules = ["generic-api-key"]
commits = ["48529ce74ed2fe5c6492b281252cb33fbe10bb80"]
paths = ['''(^|/)ankay/runtime/shuffle-worker-moby-v29\.patch$''']
regexTarget = "match"
regexes = ['''^((.+)?h1:)?[A-Za-z0-9+/]{43}=$''']
