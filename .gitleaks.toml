title = "qapaq-secops gitleaks config"

[extend]
useDefault = true

# El fixture de C-02 se nombró originalmente `secret` en tests/smoke/support.mjs
# (commit 8ff6c78) y luego se renombro a `fixtureToken`; el historial de git
# conserva el nombre antiguo, por lo que un escaneo --log-opts="--all" lo sigue
# encontrando. El valor es sintetico ('c02-fixture-value'), documentado en
# docs/development/c-02-entrypoints.md, y nunca fue una credencial real.
[allowlist]
  description = "Fixture sintetico de C-02 renombrado; no es un secreto real"
  commits = ["8ff6c78f2779fc25b05a0355849647a770225a0f"]
  paths = ['''tests/smoke/support\.mjs''']
