# Inventario documental de fuentes. No contiene secretos ni habilita producción.
# Cada TO_BE_PROVIDED debe resolverse y aprobarse antes del estado enabled.
schema_version: "1.0"
secret_provider:
  lifecycle_component: C-24
  decision: ADR-027
  backend: TO_BE_PROVIDED
  production_endpoint: TO_BE_PROVIDED
  production_identity: TO_BE_PROVIDED
  production_certificate_ref: TO_BE_PROVIDED
  workload_identity: TO_BE_PROVIDED
  credentials_source: TO_BE_PROVIDED
  production_policy: TO_BE_PROVIDED
  control_plane_operations: [create, rotate, revoke]
  runtime_resolution_boundary: separate
  final_e2e: Sprint 3
provider_gateway:
  product: KrakenD Community Edition
  deployment: on_premises
  decision: ADR-026
  version: 3.0.0
  image_digest: TO_BE_PROVIDED
  minimum_replicas: 2
  load_balancer: TO_BE_PROVIDED
  secret_provider: TO_BE_PROVIDED
  production_tls_certificate_ref: TO_BE_PROVIDED
  production_oidc_issuer: TO_BE_PROVIDED
  production_oidc_jwks_url: TO_BE_PROVIDED
  production_oidc_audience: TO_BE_PROVIDED
  wazuh_indexer_backend_url: TO_BE_PROVIDED
  wazuh_indexer_ca_ref: TO_BE_PROVIDED
  image_registry_mirror: TO_BE_PROVIDED
  invariant: durable_admission_before_downstream_bullmq
connectors:
  c10_wazuh_adapter:
    application_port: SecurityEventProvider
    network_dependency: provider_gateway
    gateway_base_url: TO_BE_PROVIDED
    gateway_credential_ref: TO_BE_PROVIDED
    allowed_routes:
      - { method: GET, path: /wazuh/_cluster/health }
      - { method: POST, path: /wazuh/_search }
    direct_indexer_access: prohibited
sources:
  - source_id: wazuh-to-be-provided
    product: Wazuh
    mvp_role: detection_engine_and_alert_source
    edition: TO_BE_PROVIDED
    owner_team: infrastructure
    business_owner: security
    interface:
      api: C-28 KrakenD provider gateway
      api_version: TO_BE_PROVIDED
      region: TO_BE_PROVIDED
      authentication: TO_BE_PROVIDED
      credential_ref: TO_BE_PROVIDED
    authorization: { approved_scopes: [], approval_ticket: TO_BE_PROVIDED }
    datasets:
      - id: TO_BE_PROVIDED
        enabled: false
        source_event_id: TO_BE_PROVIDED
        event_time_field: TO_BE_PROVIDED
        schema_version: TO_BE_PROVIDED
    pagination: { strategy: TO_BE_PROVIDED, cursor_field: TO_BE_PROVIDED }
    limits: { quota: TO_BE_PROVIDED, maximum_page_size: TO_BE_PROVIDED }
    replay: { classification: TO_BE_PROVIDED, maximum_window: TO_BE_PROVIDED, zero_loss_guarantee: false }
    retention: { source_retention: TO_BE_PROVIDED, platform_retention: U-004 }
    status: planned

  - source_id: microsoft-to-be-provided
    product: Microsoft Entra ID or Microsoft 365
    mvp_role: sole_business_source_via_wazuh
    edition: TO_BE_PROVIDED
    owner_team: infrastructure
    business_owner: security
    interface:
      api: TO_BE_PROVIDED
      api_version: TO_BE_PROVIDED
      region: TO_BE_PROVIDED
      authentication: client_credentials
      # App registration creada 2026-09-22; el valor real vive solo en .env local
      # (gitignored) y debe migrar a un secret manager antes de cualquier
      # entorno compartido. Este nombre es una referencia, no el secreto.
      credential_ref: secret://qapaq/microsoft/entra-app
    authorization: { approved_scopes: [], approval_ticket: TO_BE_PROVIDED }
    datasets:
      - id: TO_BE_PROVIDED
        enabled: false
        source_event_id: TO_BE_PROVIDED
        event_time_field: TO_BE_PROVIDED
        schema_version: TO_BE_PROVIDED
    pagination: { strategy: TO_BE_PROVIDED, cursor_field: TO_BE_PROVIDED }
    limits: { quota: TO_BE_PROVIDED, maximum_page_size: TO_BE_PROVIDED }
    replay: { classification: TO_BE_PROVIDED, maximum_window: TO_BE_PROVIDED, zero_loss_guarantee: false }
    retention: { source_retention: TO_BE_PROVIDED, platform_retention: U-004 }
    # enabled por decision de Franco Clavo Santander (Product Owner), 2026-09-24,
    # sobre la base del credential_ref de app registration ya entregado (2026-09-22).
    # approved_scopes, approval_ticket, dataset, api_version y region siguen
    # TO_BE_PROVIDED; no hay registrada una conexion real de lectura contra
    # Microsoft 365 que demuestre el criterio de PBI-006 ("una conexion minima
    # real demuestra acceso de solo lectura a las alertas"). Este enabled es una
    # decision administrativa del Product Owner, no evidencia tecnica completa;
    # ver docs/decisions/unresolved.md.
    status: enabled

