# C-28 — balanceador interno delante de las réplicas de KrakenD.
# El gateway es stateless: el balanceo es round-robin sin afinidad de sesión. Una
# réplica que deja de responder sale del conjunto por `max_fails`, y vuelve sola; eso
# es lo que convierte un rolling update en una operación sin ventana de indisponibilidad.

worker_processes 1;
events { worker_connections 1024; }

http {
  access_log off;
  server_tokens off;

  upstream krakend {
    # `max_fails`/`fail_timeout` expulsan temporalmente a la réplica que falla.
    server gateway-a:8080 max_fails=2 fail_timeout=5s;
    server gateway-b:8080 max_fails=2 fail_timeout=5s;
    keepalive 32;
  }

  server {
    listen 8080;

    # Salud del propio balanceador. No consulta al gateway: responder aquí distingue
    # "el balanceador está vivo" de "hay réplicas sanas detrás", que son dos fallos
    # distintos y se diagnostican por separado.
    location = /__health {
      access_log off;
      add_header Content-Type text/plain always;
      return 200 "ok";
    }

    # El balanceador no decide autorización ni reescribe la ruta: solo reparte.
    location / {
      proxy_pass http://krakend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Request-Id $request_id;
      # Reintento solo ante fallos de conexión, nunca tras enviar un POST completo:
      # repetir una escritura ya entregada duplicaría trabajo aguas arriba.
      proxy_next_upstream error timeout http_502 http_503;
      proxy_next_upstream_tries 2;
      proxy_connect_timeout 2s;
      proxy_read_timeout 10s;
    }
  }
}
