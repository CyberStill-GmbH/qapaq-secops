# C-26 — orígenes de datos de QAPAQ SecOps.
# Se declaran por provisioning y no por la interfaz: un origen creado a mano no queda
# versionado, no se revisa y no sobrevive a una restauración.
apiVersion: 1
datasources:
  - name: QAPAQ Prometheus
    uid: qapaq-prometheus
    type: prometheus
    access: proxy
    # Red interna: el navegador del analista nunca habla con Prometheus directamente.
    url: http://prometheus.qapaq.internal:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 30s
      manageAlerts: false
  - name: QAPAQ Loki
    uid: qapaq-loki
    type: loki
    access: proxy
    url: http://loki.qapaq.internal:3100
    editable: false
    jsonData:
      maxLines: 1000
      # Los logs no son auditoría: la consulta se acota y se redacta en origen (C-15).
      derivedFields: []
