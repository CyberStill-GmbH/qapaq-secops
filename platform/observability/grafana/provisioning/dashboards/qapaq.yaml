# C-26 — proveedor de dashboards versionados.
apiVersion: 1
providers:
  - name: qapaq-secops
    orgId: 1
    folder: QAPAQ SecOps
    type: file
    # La edición desde la interfaz no se persiste: la fuente es el repositorio.
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false
