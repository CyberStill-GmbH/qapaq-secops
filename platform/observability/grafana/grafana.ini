; C-26 — endurecimiento de Grafana OSS para QAPAQ SecOps.
; Cada ajuste corrige un valor por defecto que no es aceptable en un entorno con datos
; de seguridad. La spec `grafana-provisioning.spec.ts` verifica que siga siendo así.

[server]
http_addr = 127.0.0.1
protocol = http
enforce_domain = true

[auth.anonymous]
enabled = false

[auth]
disable_login_form = false
oauth_auto_login = false

[users]
allow_sign_up = false
allow_org_create = false
auto_assign_org_role = Viewer

[security]
cookie_secure = true
cookie_samesite = strict
allow_embedding = false
disable_gravatar = true

[analytics]
reporting_enabled = false
check_for_updates = false

[dashboards]
min_refresh_interval = 30s
